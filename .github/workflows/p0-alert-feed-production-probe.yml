name: P0 Alert Feed Production Probe

on:
  push:
    branches:
      - probe/p0-alert-feed-production-2026-08-30
    paths:
      - .github/workflows/p0-alert-feed-production-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe deployed canonical alert feed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'https://fatedrop-cloud-production.up.railway.app/api/signals';
          const historyOnlyReasons = new Set([
            'Baseline scan verified purchasable availability; canonical Manifested anchor recorded without alert delivery',
            'Verified live offer had no active Manifested lifecycle anchor; current confirmation starts a truthful live window',
          ]);
          async function get(url) {
            const response = await fetch(url, { headers: { accept: 'application/json' } });
            const payload = await response.json();
            return { httpStatus: response.status, payload };
          }
          (async () => {
            const alertResult = await get(`${base}?detail=alerts&limit=100`);
            const alerts = Array.isArray(alertResult.payload.alerts) ? alertResult.payload.alerts : [];
            const alertStages = { WHISPER: 0, ECHO: 0, MANIFESTED: 0, VANISHED: 0 };
            let historyOnlyLeak = 0;
            for (const alert of alerts) {
              if (Object.hasOwn(alertStages, alert.fateStage)) alertStages[alert.fateStage] += 1;
              if (historyOnlyReasons.has(String(alert.message || ''))) historyOnlyLeak += 1;
            }

            const raw = {};
            for (const state of ['whisper', 'echo', 'manifested', 'vanished']) {
              const result = await get(`${base}?state=${state}&limit=100`);
              const signals = Array.isArray(result.payload.signals) ? result.payload.signals : [];
              const anchorCount = signals.filter((signal) => historyOnlyReasons.has(String(signal.reason || ''))).length;
              raw[state] = {
                httpStatus: result.httpStatus,
                count: signals.length,
                anchorCount,
                ordinaryCount: signals.length - anchorCount,
                newestDetectedAt: signals[0]?.detectedAt || null,
                oldestDetectedAt: signals.at(-1)?.detectedAt || null,
              };
            }

            const result = {
              httpStatus: alertResult.httpStatus,
              success: alertResult.payload.success === true,
              available: alertResult.payload.available === true,
              alertCount: alerts.length,
              alertStages,
              historyOnlyLeak,
              raw,
              generatedAt: alertResult.payload.generatedAt || null,
            };
            console.log(JSON.stringify(result));
            fs.writeFileSync('p0-alert-feed-production-result.json', `${JSON.stringify(result, null, 2)}\n`);
            if (!(alertResult.httpStatus === 200 && result.success && result.available && historyOnlyLeak === 0)) process.exitCode = 1;
          })().catch((error) => {
            fs.writeFileSync('p0-alert-feed-production-result.json', `${JSON.stringify({ error: String(error?.message || error) }, null, 2)}\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Persist redacted aggregate
        if: always()
        shell: bash
        run: |
          if [ ! -f p0-alert-feed-production-result.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p0-alert-feed-production-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Record redacted production alert feed probe"
          git push
