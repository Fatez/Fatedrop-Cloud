name: P0 Alert Feed Production Probe

on:
  push:
    branches:
      - probe/p0-alert-feed-production-2026-08-30

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed canonical alert feed
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://fatedrop-cloud-production.up.railway.app/api/signal-summary?detail=alerts&limit=100';
          const historyOnlyReasons = new Set([
            'Baseline scan verified purchasable availability; canonical Manifested anchor recorded without alert delivery',
            'Verified live offer had no active Manifested lifecycle anchor; current confirmation starts a truthful live window',
          ]);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let last = null;
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const response = await fetch(url, { headers: { accept: 'application/json' } });
              const payload = await response.json();
              const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
              const stages = { WHISPER: 0, ECHO: 0, MANIFESTED: 0, VANISHED: 0 };
              let historyOnlyLeak = 0;
              for (const alert of alerts) {
                if (Object.hasOwn(stages, alert.fateStage)) stages[alert.fateStage] += 1;
                if (historyOnlyReasons.has(String(alert.message || ''))) historyOnlyLeak += 1;
              }
              last = {
                attempt,
                httpStatus: response.status,
                success: payload.success === true,
                available: payload.available === true,
                count: alerts.length,
                stages,
                historyOnlyLeak,
                generatedAt: payload.generatedAt || null,
              };
              console.log(JSON.stringify(last));
              if (response.ok && payload.success === true && payload.available === true && historyOnlyLeak === 0) process.exit(0);
            } catch (error) {
              last = { attempt, error: String(error?.message || error) };
              console.log(JSON.stringify(last));
            }
            await sleep(15_000);
          }
          console.error(JSON.stringify({ productionProbeFailed: true, last }));
          process.exit(1);
          NODE
