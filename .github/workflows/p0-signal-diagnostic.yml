name: P0 Signal Engine Diagnostic

on:
  push:
    branches:
      - "fix/p0-signal-engine-recovery-2026-08-30"
    paths:
      - "signal-engine/**"
      - ".github/workflows/p0-signal-diagnostic.yml"

permissions:
  contents: read

jobs:
  select-shard-4:
    name: Select shard 4 files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.select.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        shell: bash
        run: |
          mapfile -t all < <(find signal-engine/tests -maxdepth 1 -name '*.test.mjs' -print | sed 's#^signal-engine/##' | sort)
          selected=()
          for i in "${!all[@]}"; do
            if (( i % 16 == 4 )); then selected+=("${all[$i]}"); fi
          done
          files=$(node -e 'process.stdout.write(JSON.stringify(process.argv.slice(1)))' "${selected[@]}")
          echo "files=$files" >> "$GITHUB_OUTPUT"
          printf 'Shard 4 files: %s\n' "$files"

  probe-shard-4:
    name: Probe ${{ matrix.file }}
    needs: select-shard-4
    if: ${{ needs.select-shard-4.outputs.files != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.select-shard-4.outputs.files) }}
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run isolated shard-4 test
        run: node --test "${{ matrix.file }}"
