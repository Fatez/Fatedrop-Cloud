name: Cardmarket User URL Input Export

on:
  push:
    branches:
      - audit/cardmarket-user-url-evidence-2026-09-14
    paths:
      - '.github/workflows/cardmarket-user-url-input-export.yml'
      - 'signal-engine/src/trader/value/cardmarket-user-url-input-export-cli.mjs'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Export approved Cardmarket catalogue and current production backlog
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-user-url-input-export-cli.mjs
      - name: Upload read-only inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-user-url-input-export
          path: ${{ runner.temp }}/cardmarket-user-url-input-export/*.json
          if-no-files-found: error
          retention-days: 7
