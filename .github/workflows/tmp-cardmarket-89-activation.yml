name: TEMP Cardmarket Residual Post-Activation Audit

on:
  push:
    branches:
      - ops/cardmarket-89-activation-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact merged application base and workflow-only diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3dabace37977d39b0c3f0091da7801f7608a183f HEAD
          test -z "$(git diff --name-only 3dabace37977d39b0c3f0091da7801f7608a183f..HEAD | grep -v '^.github/workflows/tmp-cardmarket-89-activation.yml$' || true)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run canonical residual price audit
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-residual-price-audit-cli.mjs
      - name: Print residual class inventory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cardmarket-residual-price-audit.json`, 'utf8'));
          const compact = report.rows.map((row) => ({
            cardIdentityId: row.cardIdentityId,
            setName: row.setName,
            name: row.name,
            collectorNumber: row.collectorNumber,
            variantCode: row.variantCode,
            classification: row.classification,
            mappings: row.mappings,
            currentTargetLanePositive: row.currentTargetLanePositive,
            currentBaseLanePositive: row.currentBaseLanePositive,
            ownershipConflict: row.ownershipConflict,
            sourceOwners: row.sourceOwners,
          }));
          console.log(JSON.stringify({ counts: report.counts, classes: report.classes, rows: compact }));
          if (report.counts.mappedWithoutPositivePrice !== 138) throw new Error(`expected 138 mapped residual identities, got ${report.counts.mappedWithoutPositivePrice}`);
          NODE
      - name: Upload residual audit
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-post-89-residual-audit
          path: ${{ runner.temp }}/cardmarket-residual-price-audit.json
          if-no-files-found: error
          retention-days: 14
