name: TEMP Cardmarket Exact Stale Mapping Diagnostic

on:
  push:
    branches:
      - ops/cardmarket-89-activation-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify workflow-only diagnostic branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3dabace37977d39b0c3f0091da7801f7608a183f HEAD
          test -z "$(git diff --name-only 3dabace37977d39b0c3f0091da7801f7608a183f..HEAD | grep -v '^.github/workflows/tmp-cardmarket-89-activation.yml$' || true)"
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Rebuild duplicate-mapped exact candidate set
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-residual-duplicate-mapping-audit-cli.mjs
      - name: Validate desired ownership, stale variant provenance, and two normal conflicts
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          import { loadTcgdexRepositoryEvidence } from './src/trader/value/tcgdex-repository-cardmarket-evidence.mjs';
          const audit = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cardmarket-residual-duplicate-mapping-audit.json`, 'utf8'));
          if (audit.counts.safeUniqueRetireCandidates !== 42) throw new Error(`expected 42 strong duplicate candidates, got ${audit.counts.safeUniqueRetireCandidates}`);
          const tcgdex = loadTcgdexRepositoryEvidence(process.env.TCGDEX_REPO, { includeCards: true });
          const cardById = new Map();
          for (const set of tcgdex.sets) for (const card of set.cards) cardById.set(card.tcgdexCardId, card);
          const candidateProducts = [...new Set(audit.candidates.flatMap((c) => [c.desiredProductId, ...c.staleProductIds]))];
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2 });
          try {
            const { rows: ownership } = await pool.query(`SELECT source_record_id,source_variant_key,card_identity_id,id AS mapping_id
              FROM fatedrop_card_source_mappings
              WHERE source_name='cardmarket' AND source_record_id=ANY($1::text[])
              ORDER BY source_record_id,source_variant_key,card_identity_id`, [candidateProducts]);
            const ownersByProduct = new Map();
            for (const row of ownership) {
              const id = String(row.source_record_id);
              const list = ownersByProduct.get(id) || [];
              list.push({ mappingId: row.mapping_id, sourceVariantKey: row.source_variant_key, cardIdentityId: row.card_identity_id });
              ownersByProduct.set(id, list);
            }
            const candidates = audit.candidates.map((candidate) => {
              const card = cardById.get(candidate.tcgdexCardId);
              const staleEvidence = candidate.staleProductIds.map((id) => ({
                productId: String(id),
                tcgdexVariants: (card?.variants || []).filter((variant) => String(variant.cardmarketProductId || '') === String(id)),
                productionOwners: ownersByProduct.get(String(id)) || [],
              }));
              return {
                cardIdentityId: candidate.cardIdentityId,
                setName: candidate.setName,
                name: candidate.name,
                collectorNumber: candidate.collectorNumber,
                tcgdexCardId: candidate.tcgdexCardId,
                desiredProductId: String(candidate.desiredProductId),
                desiredOwners: ownersByProduct.get(String(candidate.desiredProductId)) || [],
                staleEvidence,
                baselineVariants: candidate.proof.baselineVariants,
              };
            });
            const desiredWithOtherIdentityOwner = candidates.filter((c) => c.desiredOwners.some((owner) => owner.cardIdentityId !== c.cardIdentityId));
            const staleExplicitOnSameTcgdexCard = candidates.filter((c) => c.staleEvidence.some((entry) => entry.tcgdexVariants.length > 0));
            const { rows: conflicts } = await pool.query(`SELECT m.id AS mapping_id,m.card_identity_id,m.source_record_id,m.source_variant_key,
                i.variant_code,p.name,p.collector_number,s.name AS set_name
              FROM fatedrop_card_source_mappings m
              JOIN fatedrop_card_identities i ON i.id=m.card_identity_id
              JOIN fatedrop_card_printings p ON p.id=i.printing_id
              JOIN fatedrop_card_sets s ON s.id=i.set_id
              WHERE m.source_name='cardmarket' AND m.source_record_id=ANY($1::text[])
              ORDER BY m.source_record_id,m.source_variant_key`, [['568801','760792']]);
            const report = {
              candidateCount: candidates.length,
              desiredWithOtherIdentityOwnerCount: desiredWithOtherIdentityOwner.length,
              desiredWithOtherIdentityOwner,
              staleExplicitOnSameTcgdexCardCount: staleExplicitOnSameTcgdexCard.length,
              staleExplicitOnSameTcgdexCard,
              candidates,
              heldConflictMappings: conflicts,
            };
            await writeFile(`${process.env.RUNNER_TEMP}/cardmarket-exact-stale-mapping-diagnostic.json`, JSON.stringify(report, null, 2));
            console.log(JSON.stringify({
              candidateCount: report.candidateCount,
              desiredWithOtherIdentityOwnerCount: report.desiredWithOtherIdentityOwnerCount,
              staleExplicitOnSameTcgdexCardCount: report.staleExplicitOnSameTcgdexCardCount,
              staleExplicitSummary: staleExplicitOnSameTcgdexCard.map((c) => ({ cardIdentityId:c.cardIdentityId,name:c.name,desiredProductId:c.desiredProductId,stale:c.staleEvidence.filter((e)=>e.tcgdexVariants.length).map((e)=>({productId:e.productId,variants:e.tcgdexVariants})) })),
              heldConflictMappings: conflicts,
            }));
          } finally {
            await pool.end();
          }
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-exact-stale-mapping-diagnostic
          path: |
            ${{ runner.temp }}/cardmarket-residual-duplicate-mapping-audit.json
            ${{ runner.temp }}/cardmarket-exact-stale-mapping-diagnostic.json
          if-no-files-found: error
          retention-days: 14
