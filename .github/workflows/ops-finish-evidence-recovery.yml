name: OPS Finish Evidence Recovery

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Evidence provider to acquire'
        required: true
        type: choice
        options: [scrydex, cardmarket, tcgplayer]
        default: scrydex
      persist_evidence:
        description: 'Persist immutable raw snapshots and reviewed decisions'
        required: true
        type: boolean
        default: false
      activate_states:
        description: 'Persist classifier states after exact rehearsal counts are pinned'
        required: true
        type: boolean
        default: false
      expected_active_priced:
        description: 'Required when activate_states=true'
        required: false
        type: string
      expected_active_unpriced:
        description: 'Required when activate_states=true'
        required: false
        type: string
      expected_invalid:
        description: 'Required when activate_states=true'
        required: false
        type: string
      expected_unresolved:
        description: 'Required when activate_states=true'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fateprice-finish-evidence-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Require pinned activation counts for writes
        if: ${{ inputs.activate_states }}
        env:
          A: ${{ inputs.expected_active_priced }}
          B: ${{ inputs.expected_active_unpriced }}
          C: ${{ inputs.expected_invalid }}
          D: ${{ inputs.expected_unresolved }}
        run: |
          test -n "$A" && test -n "$B" && test -n "$C" && test -n "$D"
          test $((A+B+C+D)) -eq 1121
      - name: Build exact historical target set
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/finish-evidence-targets-cli.mjs evidence/pokemontcg-finish-evidence-audit-34719433407.json ${{ runner.temp }}/finish-evidence-targets.json
      - name: Acquire raw provider evidence
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
          TCGPLAYER_BEARER_TOKEN: ${{ secrets.TCGPLAYER_BEARER_TOKEN }}
          TCGPLAYER_METADATA_APPROVED: ${{ secrets.TCGPLAYER_METADATA_APPROVED }}
        run: python scripts/acquire_finish_evidence.py --provider '${{ inputs.provider }}' --targets ${{ runner.temp }}/finish-evidence-targets.json --output ${{ runner.temp }}/finish-evidence-acquisition.json --retries 6 --pace-seconds 0.2
      - name: Normalize explicit evidence fail closed
        run: node src/trader/value/finish-evidence-review-cli.mjs ${{ runner.temp }}/finish-evidence-targets.json ${{ runner.temp }}/finish-evidence-reviewed.json ${{ runner.temp }}/finish-evidence-acquisition.json
      - name: Store immutable evidence snapshots
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          EVIDENCE_WRITE: ${{ inputs.persist_evidence && 'true' || 'false' }}
          PRICE_WRITE: 'false'
          EVIDENCE_STORE_REPORT: ${{ runner.temp }}/finish-evidence-store.json
        run: node src/trader/value/finish-evidence-snapshot-store-cli.mjs ${{ runner.temp }}/finish-evidence-acquisition.json
      - name: Rehearse or activate cumulative resolution state
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          ACTIVATION_WRITE: ${{ inputs.activate_states && 'true' || 'false' }}
          PRICE_WRITE: 'false'
          EXPECTED_ACTIVE_PRICED: ${{ inputs.activate_states && inputs.expected_active_priced || '' }}
          EXPECTED_ACTIVE_UNPRICED: ${{ inputs.activate_states && inputs.expected_active_unpriced || '' }}
          EXPECTED_INVALID_CATALOGUE_ENTRY: ${{ inputs.activate_states && inputs.expected_invalid || '' }}
          EXPECTED_UNRESOLVED_EVIDENCE: ${{ inputs.activate_states && inputs.expected_unresolved || '' }}
        run: node src/trader/value/variant-resolution-activation-cli.mjs evidence/pokemontcg-finish-evidence-audit-34719433407.json ${{ runner.temp }}/finish-evidence-reviewed.json ${{ runner.temp }}
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-evidence-${{ inputs.provider }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/finish-evidence-targets.json
            ${{ runner.temp }}/finish-evidence-acquisition.json
            ${{ runner.temp }}/finish-evidence-reviewed.json
            ${{ runner.temp }}/finish-evidence-store.json
            ${{ runner.temp }}/variant-resolution-ledger.json
            ${{ runner.temp }}/variant-resolution-activation-plan.json
            ${{ runner.temp }}/variant-resolution-activation-report.json
            ${{ runner.temp }}/delta_activation.sql
          if-no-files-found: warn
          retention-days: 30
