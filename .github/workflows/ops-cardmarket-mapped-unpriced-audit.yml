name: OPS Cardmarket Mapped Unpriced Audit

on:
  push:
    branches:
      - feat/cardmarket-mapped-unpriced-audit-2026-09-12
    paths:
      - '.github/workflows/ops-cardmarket-mapped-unpriced-audit.yml'
      - 'signal-engine/src/trader/value/cardmarket-mapped-unpriced-audit-cli.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Classify mapped but unpriced identities
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-mapped-unpriced-audit-cli.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-mapped-unpriced-audit
          path: ${{ runner.temp }}/cardmarket-mapped-unpriced-audit.json
          if-no-files-found: error
          retention-days: 14
