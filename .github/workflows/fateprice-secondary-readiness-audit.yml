name: FatePrice Secondary Readiness Audit

on:
  push:
    branches:
      - audit/fateprice-secondary-readiness-2026-09-14
    paths:
      - '.github/workflows/fateprice-secondary-readiness-audit.yml'
      - 'signal-engine/src/trader/value/fateprice-secondary-readiness-audit-cli.mjs'
      - 'signal-engine/src/trader/value/fateprice-secondary-crosswalk-v2-audit-cli.mjs'
      - 'signal-engine/tests/fateprice-secondary-readiness-audit.test.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run focused audit tests
        run: node --test tests/fateprice-secondary-readiness-audit.test.mjs
      - name: Audit final unpriced cohort without provider calls or writes
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          EXPECTED_UNPRICED: '819'
          EXPECTED_SECTION_A: '94'
          EXPECTED_SECTION_B: '725'
        run: node src/trader/value/fateprice-secondary-readiness-audit-cli.mjs
      - name: Audit exact variant TCGplayer crosswalk evidence
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          EXPECTED_UNPRICED: '819'
          EXPECTED_SECTION_A: '94'
          EXPECTED_SECTION_B: '725'
        run: node src/trader/value/fateprice-secondary-crosswalk-v2-audit-cli.mjs
      - name: Upload readiness audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fateprice-secondary-readiness-audit
          path: ${{ runner.temp }}/fateprice-secondary-readiness-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact crosswalk audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fateprice-secondary-crosswalk-v2-audit
          path: ${{ runner.temp }}/fateprice-secondary-crosswalk-v2-audit.json
          if-no-files-found: error
          retention-days: 14
