name: Physical Echo intelligence safe gate v2

on:
  push:
    branches: [feat/retailer-intelligence-surfaces-2026-09-01]
    paths:
      - ".github/workflows/physical-echo-intelligence-safe-gate-v2.yml"

permissions:
  contents: write

jobs:
  validate-apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailer-intelligence-surfaces-2026-09-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: patch
        name: Validate all normalized anchors in virtual filesystem, then materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/physical-echo-safe-v2-patch.log
          import pathlib
          from textwrap import dedent

          helper = pathlib.Path('.github/workflows/apply-physical-echo-intelligence-lock.yml').read_text()
          marker = "python - <<'PY'\n"
          if marker not in helper or "\n          PY" not in helper:
              raise SystemExit('could not extract physical Echo patch script')
          code = dedent(helper.split(marker, 1)[1].split("\n          PY", 1)[0])

          # Make the one historically ambiguous evidence insertion anchor unique
          # before any patch logic runs. This changes only the patch plan text.
          ambiguous = '''replace_once(path,
          '      evidenceLevel,\\n      sourceType,',
          '      evidenceLevel,\\n      sourceType,\\n      alertChannel: "echo",\\n      availabilityScope: locationId ? "physical_branch" : "physical_retailer_chain",\\n      physicalEvidenceState,')'''
          specific = '''replace_once(path,
          '    evidence: {\\n      ...evidence,\\n      evidenceLevel,\\n      sourceType,',
          '    evidence: {\\n      ...evidence,\\n      evidenceLevel,\\n      sourceType,\\n      alertChannel: "echo",\\n      availabilityScope: locationId ? "physical_branch" : "physical_retailer_chain",\\n      physicalEvidenceState,')'''
          if code.count(ambiguous) != 1:
              raise SystemExit(f'ambiguous patch-plan transform matched {code.count(ambiguous)} times; expected exactly once')
          code = code.replace(ambiguous, specific, 1)

          vfs = {}
          touched = set()

          class VirtualPath:
              def __init__(self, value): self.value = str(value)
              def read_text(self):
                  if self.value in vfs: return vfs[self.value]
                  return pathlib.Path(self.value).read_text()
              def write_text(self, value):
                  vfs[self.value] = value
                  touched.add(self.value)
                  return len(value)
              def exists(self):
                  return self.value in vfs or pathlib.Path(self.value).exists()

          def normalized_spans(text, anchor):
              source = text.splitlines()
              target = anchor.splitlines()
              target_norm = [line.strip() for line in target]
              spans = []
              if not target:
                  return spans
              for start in range(0, len(source) - len(target) + 1):
                  if [line.strip() for line in source[start:start+len(target)]] == target_norm:
                      spans.append((start, start + len(target)))
              return spans

          code = code.replace('from pathlib import Path\n', '')
          old_helper = '''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))'''
          new_helper = '''patch_counter = 0
          def replace_once(path, old, new):
              global patch_counter
              patch_counter += 1
              p = Path(path)
              text = p.read_text()
              spans = normalized_spans(text, old)
              print(f"ANCHOR {patch_counter}: {path} normalized_matches={len(spans)}")
              if len(spans) != 1:
                  print(repr(old[:900]))
                  raise SystemExit(f"anchor {patch_counter} in {path} matched {len(spans)} normalized line sequences; expected exactly once")
              source = text.splitlines()
              start, end = spans[0]
              replacement_lines = dedent(new).strip("\\n").splitlines()
              rendered = source[:start] + replacement_lines + source[end:]
              p.write_text("\\n".join(rendered) + ("\\n" if text.endswith("\\n") else ""))'''
          if old_helper not in code:
              raise SystemExit('could not instrument replace_once helper')
          code = code.replace(old_helper, new_helper, 1)

          globals_dict = {
              '__name__': '__main__',
              'Path': VirtualPath,
              'dedent': dedent,
              'normalized_spans': normalized_spans,
          }
          exec(compile(code, 'physical-echo-safe-v2-patch.py', 'exec'), globals_dict)

          # Update the existing intelligence-surface test inside the same virtual
          # filesystem. The old assertion expected immediate publication; the
          # canonical rule now requires allocation Echoes to be held until exact
          # branch/radius targeting exists.
          test_path = VirtualPath('signal-engine/tests/retailer-intelligence-surfaces.test.mjs')
          test_text = test_path.read_text()
          old_test = '''  assert.equal(logs[0].kind, "echo");
          assert.equal(notifications[0].stage, "ECHO");
          assert.match(notifications[0].body, /not confirmed/i);
          assert.ok(result.changes.some((change) => change.reasons.includes("product_added")));'''
          new_test = '''  assert.equal(logs[0].kind, "echo");
          assert.equal(notifications.length, 0);
          assert.equal(result.notificationsPublished, 0);
          assert.equal(result.notificationsHeld, 1);
          assert.equal(result.notifications[0].held, true);
          assert.equal(result.notifications[0].reason, "radius_targeting_required");
          assert.ok(result.changes.some((change) => change.reasons.includes("product_added")));'''
          spans = normalized_spans(test_text, old_test)
          print(f"TEST_ANCHOR radius_hold normalized_matches={len(spans)}")
          if len(spans) != 1:
              raise SystemExit(f'radius-hold test anchor matched {len(spans)} times; expected exactly once')
          lines = test_text.splitlines()
          start, end = spans[0]
          test_path.write_text("\n".join(lines[:start] + dedent(new_test).strip("\n").splitlines() + lines[end:]) + ("\n" if test_text.endswith("\n") else ""))

          print(f"PREFLIGHT_OK anchors={globals_dict.get('patch_counter')} files={len(touched)}")
          for rel in sorted(touched):
              pathlib.Path(rel).parent.mkdir(parents=True, exist_ok=True)
          for rel in sorted(touched):
              pathlib.Path(rel).write_text(vfs[rel])
              print(f"MATERIALIZED {rel}")
          PY

      - name: Upload patch preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-safe-v2-patch
          path: /tmp/physical-echo-safe-v2-patch.log
          if-no-files-found: warn

      - name: Fail closed if preflight failed
        if: steps.patch.outcome != 'success'
        run: exit 1

      - name: Verify diff hygiene
        run: git diff --check

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - id: focused
        name: Run focused physical Echo and intelligence tests
        continue-on-error: true
        working-directory: signal-engine
        shell: bash
        run: |
          set -o pipefail
          node --test tests/physical-echo-contract.test.mjs tests/retailer-intelligence-surfaces.test.mjs 2>&1 | tee /tmp/physical-echo-focused-v2.log

      - name: Upload focused test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-focused-v2
          path: /tmp/physical-echo-focused-v2.log
          if-no-files-found: warn

      - name: Fail closed if focused tests failed
        if: steps.focused.outcome != 'success'
        run: exit 1

      - id: cloud
        name: Run full Signal Engine suite
        continue-on-error: true
        working-directory: signal-engine
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/physical-echo-cloud-v2.log

      - name: Upload full Cloud test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-cloud-v2
          path: /tmp/physical-echo-cloud-v2.log
          if-no-files-found: warn

      - name: Fail closed if full Cloud tests failed
        if: steps.cloud.outcome != 'success'
        run: exit 1

      - name: Install collector dependencies
        working-directory: collectors/pokemon-center-browser
        run: npm ci

      - id: collector
        name: Run collector suite
        continue-on-error: true
        working-directory: collectors/pokemon-center-browser
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/physical-echo-collector-v2.log

      - name: Upload collector test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-collector-v2
          path: /tmp/physical-echo-collector-v2.log
          if-no-files-found: warn

      - name: Fail closed if collector tests failed
        if: steps.collector.outcome != 'success'
        run: exit 1

      - name: Commit only after all gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add signal-engine collectors/pokemon-center-browser/src/index.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock physical stock to Echo intelligence"
          git push origin HEAD:feat/retailer-intelligence-surfaces-2026-09-01
