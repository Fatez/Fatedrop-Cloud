name: Verify Entertainer official directory live

on:
  push:
    branches:
      - verify/entertainer-official-directory-live-2026-09-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Parse exact official Entertainer branch pages
        run: |
          node --input-type=module <<'NODE'
          import { parseOfficialBranchPage } from './src/encounters/national-branch-directory-sync.mjs';

          const branches = [
            { label: 'York', url: 'https://www.thetoyshop.com/store/york' },
            { label: 'Yate', url: 'https://www.thetoyshop.com/store/yate' },
            { label: 'Yeovil', url: 'https://www.thetoyshop.com/store/yeovil' },
          ];

          const results = [];
          for (const branch of branches) {
            try {
              const parsed = await parseOfficialBranchPage({
                url: branch.url,
                retailerId: 'entertainer-uk',
                provider: 'entertainer_official_directory',
              });
              results.push({ label: branch.label, url: branch.url, ...parsed });
            } catch (error) {
              results.push({ label: branch.label, url: branch.url, location: null, reason: String(error?.message || error) });
            }
          }

          console.log(JSON.stringify(results, null, 2));
          const valid = results.filter((row) =>
            row.location
            && row.location.retailerId === 'entertainer-uk'
            && row.location.verification === 'official_retailer_branch'
            && row.location.postcode
            && Number.isFinite(row.location.latitude)
            && Number.isFinite(row.location.longitude)
          );

          if (valid.length !== branches.length) {
            throw new Error(`Exact official Entertainer branch parsing incomplete: ${valid.length}/${branches.length}`);
          }
          NODE
