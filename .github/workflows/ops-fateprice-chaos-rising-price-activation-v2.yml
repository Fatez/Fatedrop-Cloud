name: OPS FatePrice Chaos Rising Price Activation V2

on:
  push:
    branches:
      - ops/fateprice-chaos-rising-prices-2026-09-07
    paths:
      - '.github/workflows/ops-fateprice-chaos-rising-price-activation-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  activate-chaos-rising-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Download exact Cardmarket proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9989646893/zip" > "$RUNNER_TEMP/price-slice.zip"
          unzip -q -o "$RUNNER_TEMP/price-slice.zip" -d "$RUNNER_TEMP/price-slice"
          test -s "$RUNNER_TEMP/price-slice/fateprice-expanded-price-slice-v2.json"
      - name: Validate exact Chaos Rising mapping counts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const p=JSON.parse(await readFile(process.env.RUNNER_TEMP+'/price-slice/fateprice-expanded-price-slice-v2.json','utf8'));
          const rows=(p.mappings||[]).filter(m=>m.setId==='fdset_40b2ad368841bbd285a0df18'&&m.sourceName==='cardmarket');
          const normal=rows.filter(m=>m.sourceVariantKey==='normal').length;
          const holo=rows.filter(m=>m.sourceVariantKey==='holo').length;
          const reverse=rows.filter(m=>m.sourceVariantKey==='reverse').length;
          if(p.safety?.exactOnly!==true||p.safety?.fuzzyMatching!==false||rows.length!==200||normal!==68||holo!==59||reverse!==73) throw new Error('Chaos Rising mapping proof failed');
          console.log(JSON.stringify({rows:rows.length,normal,holo,reverse}));
          NODE
      - name: Publish ephemeral public key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/key.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/pub.pem" >/dev/null 2>&1
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/pub.pem")"
          API="repos/${GITHUB_REPOSITORY}/contents/.ops/chaos-rising-price-pub-v2.pem"
          SHA="$(gh api "$API?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message='ops: refresh Chaos Rising price key v2' -f branch="${GITHUB_REF_NAME}" -f content="$CONTENT" -f sha="$SHA" >/dev/null
          else
            gh api --method PUT "$API" -f message='ops: publish Chaos Rising price key v2' -f branch="${GITHUB_REF_NAME}" -f content="$CONTENT" >/dev/null
          fi
      - name: Wait for encrypted database handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/.ops/chaos-rising-price-url-v2.enc.b64?ref=${GITHUB_REF_NAME}" --jq '.content' > "$RUNNER_TEMP/github.b64" 2>/dev/null; then
              if tr -d '\n' < "$RUNNER_TEMP/github.b64" | base64 -d > "$RUNNER_TEMP/text.b64" 2>/dev/null && tr -d '\r\n' < "$RUNNER_TEMP/text.b64" | base64 -d > "$RUNNER_TEMP/cipher.bin" 2>/dev/null; then
                if openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cipher.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out "$RUNNER_TEMP/db.txt" 2>/dev/null; then
                  DATABASE_URL="$(cat "$RUNNER_TEMP/db.txt")"
                  if [ -n "$DATABASE_URL" ]; then
                    echo "::add-mask::$DATABASE_URL"
                    echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
                    exit 0
                  fi
                fi
              fi
            fi
            sleep 5
          done
          exit 31
      - name: Activate exact mappings and fresh observed prices
        shell: bash
        run: |
          node src/trader/value/chaos-rising-price-activation.mjs --artifact="$RUNNER_TEMP/price-slice/fateprice-expanded-price-slice-v2.json" | tee "$RUNNER_TEMP/chaos-rising-price-activation.log"
      - name: Verify prices are now persisted
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL});
          const {rows}=await pool.query(`SELECT COUNT(DISTINCT c.id) FILTER (WHERE c.verification_status='verified')::int verified_identities,COUNT(DISTINCT m.card_identity_id)::int mapped_identities,COUNT(DISTINCT o.card_identity_id)::int priced_identities,COUNT(o.*)::int observation_rows FROM fatedrop_card_identities c LEFT JOIN fatedrop_card_source_mappings m ON m.card_identity_id=c.id AND m.source_name='cardmarket' LEFT JOIN fatedrop_market_observations o ON o.card_identity_id=c.id WHERE c.set_id='fdset_40b2ad368841bbd285a0df18'`);
          console.log(JSON.stringify(rows[0]));
          if(rows[0].verified_identities!==203||rows[0].mapped_identities<127||rows[0].priced_identities<1) throw new Error('Chaos Rising price activation incomplete');
          await pool.end();
          NODE
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fateprice-chaos-rising-price-activation-v2-log
          path: ${{ runner.temp }}/chaos-rising-price-activation.log
          retention-days: 30
          if-no-files-found: ignore
