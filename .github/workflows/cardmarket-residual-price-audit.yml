name: Cardmarket Residual Price Audit

on:
  push:
    branches:
      - feat/cardmarket-residual-price-recovery-2026-09-12
    paths:
      - 'signal-engine/src/trader/value/cardmarket-residual-price-audit-cli.mjs'
      - '.github/workflows/cardmarket-residual-price-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit mapped English standard/holo residual prices
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-residual-price-audit-cli.mjs
      - name: Upload residual price audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-residual-price-audit
          path: ${{ runner.temp }}/cardmarket-residual-price-audit.json
          if-no-files-found: error
          retention-days: 14
