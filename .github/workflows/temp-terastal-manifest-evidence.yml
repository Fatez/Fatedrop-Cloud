name: TEMP Terastal Manifested Production Evidence

on:
  push:
    branches:
      - "diag/terastal-manifest-delivery-2026-08-30"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Terastal Grand Gathering production signals
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch('https://fatedrop-cloud-production.up.railway.app/api/signals?detail=alerts&limit=250', {
            headers: { 'user-agent': 'FateDrop-terastal-manifest-evidence/1.0' },
          });
          if (!response.ok) throw new Error(`Cloud HTTP ${response.status}`);
          const payload = await response.json();
          const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
          const rows = alerts
            .filter((alert) => /terastal grand gathering/i.test(String(alert?.product?.title || alert?.title || '')))
            .map((alert) => ({
              id: alert.id || null,
              state: alert.state || null,
              kind: alert.kind || null,
              detectedAt: alert.detectedAt || null,
              retailerId: alert.retailerId || alert?.retailer?.id || null,
              retailerName: alert.retailerName || alert?.retailer?.name || null,
              title: alert?.product?.title || alert?.title || null,
              pricePence: alert?.priceIntelligence?.pricePence ?? alert?.pricePence ?? null,
              rrpPence: alert?.priceIntelligence?.rrpPence ?? alert?.rrpPence ?? null,
              rrpDeltaPercent: alert?.priceIntelligence?.rrpDeltaPercent ?? alert?.markupPercent ?? null,
              stockStatus: alert.stockStatus || alert?.availability?.stockStatus || null,
              confidence: alert.confidence ?? null,
              reason: alert.reason || null,
              evidenceKinds: [...new Set((Array.isArray(alert.evidence) ? alert.evidence : []).map((entry) => entry?.kind).filter(Boolean))].sort(),
            }));
          console.log(JSON.stringify({ success: payload?.success === true, returnedAlerts: alerts.length, matchingSignals: rows.length, rows }));
          NODE
