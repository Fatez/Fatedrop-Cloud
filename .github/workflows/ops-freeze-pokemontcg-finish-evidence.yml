name: OPS Freeze PokemonTCG Finish Evidence

on:
  push:
    branches:
      - feat/pokemontcg-finish-evidence-audit-2026-09-12
    paths:
      - '.github/workflows/ops-freeze-pokemontcg-finish-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pokemontcg-finish-evidence-audit-2026-09-12
      - name: Download and verify reviewed audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10306019852'
          EXPECTED_ZIP_SHA256: 'a6e07a039e0989afc2c87d14873659947e19756bf91768f90d7c0f26518938b0'
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/evidence.zip"
          echo "$EXPECTED_ZIP_SHA256  $RUNNER_TEMP/evidence.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
          jq -e '.status == "audit_complete" and .productionWrites == false and .counts.safeExactMappings == 410 and .byVariant.standard == 359 and .byVariant.holo == 51 and .source.pokemonTcg.sha256 == "5be68733a889b743951d9c624ea0976f37d57aa7c14ace7fbc3b1d602f00e9fa"' \
            "$RUNNER_TEMP/evidence/pokemontcg-finish-evidence-audit.json" >/dev/null
      - name: Commit exact reviewed evidence
        run: |
          mkdir -p signal-engine/evidence
          cp "$RUNNER_TEMP/evidence/pokemontcg-finish-evidence-audit.json" \
            signal-engine/evidence/pokemontcg-finish-evidence-audit-34719433407.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signal-engine/evidence/pokemontcg-finish-evidence-audit-34719433407.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze reviewed 410-card finish evidence cohort'
          git push origin HEAD:feat/pokemontcg-finish-evidence-audit-2026-09-12
