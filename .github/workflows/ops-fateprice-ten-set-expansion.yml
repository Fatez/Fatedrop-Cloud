name: OPS FatePrice Pokemon Universe Expansion

on:
  push:
    branches:
      - ops/fateprice-ten-set-expansion-2026-09-06
    paths:
      - '.github/workflows/ops-fateprice-ten-set-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-verified-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      matched_count: ${{ steps.discover.outputs.matched_count }}
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - id: discover
        name: Discover every exact physical Pokemon set crosswalk
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildVerifiedPokemonSetCrosswalk } from './src/trader/catalogue/bulk-sync.mjs';
          import { createPokemonTcgClient, createTcgdexClient } from './src/trader/catalogue/source-clients.mjs';

          const tcgdex = createTcgdexClient({ languageCode: 'en', retryAttempts: 6 });
          const pokemon = createPokemonTcgClient({ apiKey: process.env.POKEMON_TCG_API_KEY || null, retryAttempts: 6 });
          const crosswalk = await buildVerifiedPokemonSetCrosswalk({ tcgdexClient: tcgdex, pokemonTcgClient: pokemon });
          const include = crosswalk.matched.map((pair) => ({
            tcgdex: pair.tcgdexSetId,
            pokemon: pair.pokemonTcgSetId,
            canonical: pair.setMatch.canonicalSetId,
            name: pair.setMatch.setName,
          }));
          const matrix = JSON.stringify({ include });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pokemon-universe-crosswalk.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            safety: { physicalOnly: true, pocketExcluded: true, exactTwoSourceSetMatch: true, fuzzyMatching: false, productionWrites: false },
            sourceCounts: crosswalk.sourceCounts,
            counts: crosswalk.counts,
            matched: include,
            ambiguous: crosswalk.ambiguous,
            rejected: crosswalk.rejected,
            sourceErrors: crosswalk.sourceErrors,
            unmatchedTcgdex: crosswalk.unmatchedTcgdex,
            unmatchedPokemon: crosswalk.unmatchedPokemon,
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${matrix}\nmatched_count=${include.length}\n`);
          console.log(`Exact verified set pairs discovered: ${include.length}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fateprice-pokemon-universe-crosswalk
          path: ${{ runner.temp }}/pokemon-universe-crosswalk.json
          retention-days: 14
          if-no-files-found: error

  compile-each-verified-set:
    needs: discover-verified-crosswalk
    if: ${{ needs.discover-verified-crosswalk.outputs.matched_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover-verified-crosswalk.outputs.matrix) }}
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Compile exact canonical card identities for this set
        shell: bash
        env:
          TCGDEX_SET: ${{ matrix.tcgdex }}
          POKEMON_SET: ${{ matrix.pokemon }}
          EXPECTED_CANONICAL: ${{ matrix.canonical }}
          SET_NAME: ${{ matrix.name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { adaptTcgdexSet } from './src/trader/catalogue/tcgdex-adapter.mjs';
          import { adaptPokemonTcgSet } from './src/trader/catalogue/pokemontcg-adapter.mjs';
          import { createPokemonTcgClient, createTcgdexClient } from './src/trader/catalogue/source-clients.mjs';
          import { reconcileSetEvidence } from './src/trader/catalogue/reconcile.mjs';
          import { reconcilePokemonCardCollections } from './src/trader/catalogue/pipeline.mjs';
          import { promoteMatchedCardEvidence } from './src/trader/catalogue/verification.mjs';
          import { buildVerifiedCatalogueBatch } from './src/trader/catalogue/persistence.mjs';

          const verifiedAt = Date.now();
          const tcgdex = createTcgdexClient({ languageCode: 'en', retryAttempts: 6 });
          const pokemon = createPokemonTcgClient({ apiKey: process.env.POKEMON_TCG_API_KEY || null, retryAttempts: 6 });
          const output = process.env.RUNNER_TEMP + '/set-result.json';
          const result = {
            format: 'fatedrop-pokemon-catalogue-set-v1',
            generatedAt: new Date(verifiedAt).toISOString(),
            requested: { tcgdexSetId: process.env.TCGDEX_SET, pokemonTcgSetId: process.env.POKEMON_SET, canonicalSetId: process.env.EXPECTED_CANONICAL, setName: process.env.SET_NAME },
            safety: { productionWrites: false, exactTwoSourceReconciliation: true, fuzzyMatching: false, rejectedSetsAreNotPromoted: true },
            status: 'rejected', reasons: [], rows: null,
          };
          try {
            const [rawTcgdexSet, rawPokemonSet] = await Promise.all([
              tcgdex.getSet(process.env.TCGDEX_SET),
              pokemon.getSet(process.env.POKEMON_SET),
            ]);
            const tcgdexEvidence = adaptTcgdexSet(rawTcgdexSet);
            const setMatch = reconcileSetEvidence(tcgdexEvidence, adaptPokemonTcgSet(rawPokemonSet));
            if (setMatch.status !== 'matched' || setMatch.canonicalSetId !== process.env.EXPECTED_CANONICAL) throw new Error('verified set crosswalk changed during compile');
            if (!Array.isArray(rawTcgdexSet.cards) || !rawTcgdexSet.cards.length) throw new Error('TCGdex set contains no cards');

            const refs = rawTcgdexSet.cards.map((row) => String(row?.id || '').trim()).filter(Boolean);
            const tcgdexCards = [];
            for (const id of refs) tcgdexCards.push(await tcgdex.getCard(id));
            const pokemonCards = await pokemon.listCardsBySet(process.env.POKEMON_SET);
            const cardResults = reconcilePokemonCardCollections({ tcgdexCards, pokemonTcgCards: pokemonCards, setMatch, sourceSeriesCode: tcgdexEvidence.sourceSeriesCode, languageCode: 'en' });

            if (tcgdexCards.length !== pokemonCards.length) result.reasons.push('source_card_count_mismatch');
            if (cardResults.matched.length !== tcgdexCards.length) result.reasons.push('not_all_source_cards_reconciled');
            if (cardResults.conflicts.length) result.reasons.push('card_conflicts_present');
            if (cardResults.quarantined.length) result.reasons.push('quarantined_cards_present');
            if (cardResults.unmatched.length) result.reasons.push('unmatched_cards_present');
            result.evidence = { sourceCards: tcgdexCards.length, independentCards: pokemonCards.length, matched: cardResults.matched.length, conflicts: cardResults.conflicts.length, quarantined: cardResults.quarantined.length, unmatched: cardResults.unmatched.length };

            if (result.reasons.length === 0) {
              const promotions = cardResults.matched.map((match) => promoteMatchedCardEvidence(match, { verifiedAt }));
              const rejectedPromotion = promotions.find((promotion) => promotion.status !== 'verified');
              if (rejectedPromotion) throw new Error(`promotion rejected: ${rejectedPromotion.reason || 'unknown'}`);
              const batch = buildVerifiedCatalogueBatch({ setMatch, promotions, verifiedAt });
              result.status = 'verified';
              result.rows = batch;
              result.counts = { printings: batch.printings.length, cardIdentities: batch.cardIdentities.length, sourceMappings: batch.cardSourceMappings.length, provenance: batch.cardProvenance.length };
            }
          } catch (error) {
            result.reasons.push('compiler_error');
            result.error = error?.message || String(error);
          }
          fs.writeFileSync(output, JSON.stringify(result));
          console.log(`${result.status === 'verified' ? 'VERIFIED' : 'REJECTED'} ${process.env.SET_NAME}: ${result.counts?.cardIdentities || 0} exact identities${result.reasons.length ? ` [${result.reasons.join(', ')}]` : ''}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fateprice-set-${{ matrix.tcgdex }}
          path: ${{ runner.temp }}/set-result.json
          retention-days: 14
          if-no-files-found: error

  aggregate-universe-evidence:
    needs: [discover-verified-crosswalk, compile-each-verified-set]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fateprice-set-*
          path: ${{ runner.temp }}/set-results
      - name: Aggregate verified and rejected sets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/set-results';
          const files = fs.existsSync(root) ? fs.readdirSync(root, { recursive: true }).filter((name) => String(name).endsWith('set-result.json')) : [];
          const rows = files.map((name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')));
          const verified = rows.filter((row) => row.status === 'verified');
          const rejected = rows.filter((row) => row.status !== 'verified');
          const report = {
            format: 'fatedrop-pokemon-universe-expansion-v1',
            generatedAt: new Date().toISOString(),
            safety: { productionWrites: false, exactOnly: true, fuzzyMatching: false },
            counts: {
              attemptedSets: rows.length,
              verifiedSets: verified.length,
              rejectedSets: rejected.length,
              verifiedPrintings: verified.reduce((n, row) => n + (row.counts?.printings || 0), 0),
              verifiedCardIdentities: verified.reduce((n, row) => n + (row.counts?.cardIdentities || 0), 0),
            },
            verified: verified.map((row) => ({ ...row.requested, counts: row.counts, evidence: row.evidence })),
            rejected: rejected.map((row) => ({ ...row.requested, reasons: row.reasons, error: row.error || null, evidence: row.evidence || null })),
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/fateprice-pokemon-universe-expansion.json', JSON.stringify(report));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# FatePrice Pokemon universe exact expansion\n\n- Attempted sets: **${report.counts.attemptedSets}**\n- Verified sets: **${report.counts.verifiedSets}**\n- Rejected/quarantined sets: **${report.counts.rejectedSets}**\n- Verified printings: **${report.counts.verifiedPrintings}**\n- Verified exact card identities: **${report.counts.verifiedCardIdentities}**\n- Fuzzy matching: **disabled**\n- Production writes: **0**\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fateprice-pokemon-universe-expansion-summary
          path: ${{ runner.temp }}/fateprice-pokemon-universe-expansion.json
          retention-days: 14
          if-no-files-found: error
