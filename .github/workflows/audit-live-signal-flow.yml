name: Audit Live Signal Flow

on:
  push:
    branches:
      - audit/live-signal-flow-2026-09-01

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production signal summary
        shell: bash
        run: |
          set -euo pipefail
          url="https://fatedrop-cloud-production.up.railway.app/api/signal-summary"
          status="$(curl --silent --show-error --max-time 20 --output /tmp/signal-summary.json --write-out '%{http_code}' -H 'Accept: application/json' "$url")"
          echo "HTTP_STATUS=$status"
          test "$status" = "200"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/signal-summary.json', 'utf8'));
          const source = payload.signalHealth || payload.health || payload;
          const diagnostics = source.diagnostics || payload.diagnostics || {};
          const selected = {
            available: payload.available ?? source.available ?? null,
            generatedAt: payload.generatedAt ?? source.generatedAt ?? null,
            lifecycle: source.lifecycle ?? payload.lifecycle ?? null,
            delivery: source.delivery ?? payload.delivery ?? null,
            monitors: diagnostics.monitors ?? null,
            reliability: diagnostics.reliability ?? null,
            discovery: diagnostics.discovery ?? null,
            localRadarOperator: payload.localRadarOperator ?? null,
          };
          console.log('FATEDROP_SIGNAL_FLOW=' + JSON.stringify(selected));
          NODE
      - name: Probe public catalogue freshness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://fatedrop-cloud-production.up.railway.app/api/catalogue';
          let cursor = null;
          let pages = 0;
          const products = [];
          while (pages < 100) {
            const url = new URL(base);
            url.searchParams.set('tcg', 'pokemon');
            url.searchParams.set('sort', 'recent');
            url.searchParams.set('limit', '100');
            if (cursor) url.searchParams.set('cursor', cursor);
            const response = await fetch(url, { headers: { accept: 'application/json' } });
            if (!response.ok) throw new Error(`catalogue_http_${response.status}`);
            const body = await response.json();
            if (!body?.success) throw new Error('catalogue_unavailable');
            products.push(...(Array.isArray(body.products) ? body.products : []));
            pages += 1;
            cursor = body.nextCursor || null;
            if (!cursor) break;
          }
          const byRetailer = new Map();
          for (const product of products) {
            const id = product.retailerKey || product.retailer || 'unknown';
            const row = byRetailer.get(id) || { retailerId: id, retailerName: product.retailer || id, offers: 0, inStock: 0, latestLastSeen: null };
            row.offers += 1;
            if (product.availability === 'IN_STOCK') row.inStock += 1;
            const lastSeen = product.lastSeen || null;
            if (lastSeen && (!row.latestLastSeen || lastSeen > row.latestLastSeen)) row.latestLastSeen = lastSeen;
            byRetailer.set(id, row);
          }
          console.log('FATEDROP_CATALOGUE=' + JSON.stringify({ pages, offers: products.length, retailers: [...byRetailer.values()].sort((a,b) => String(b.latestLastSeen||'').localeCompare(String(a.latestLastSeen||''))) }));
          NODE
