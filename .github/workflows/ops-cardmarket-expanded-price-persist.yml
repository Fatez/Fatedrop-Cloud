name: OPS Cardmarket Expanded Price Persist

on:
  push:
    branches:
      - ops/cardmarket-price-persist-expanded-2026-09-11
    paths:
      - '.github/workflows/ops-cardmarket-expanded-price-persist.yml'

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-expanded-price-persist
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Persist exact Cardmarket normal+holo observations
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: persist
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs
      - name: Upload cycle audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-expanded-price-persist-audit
          path: ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: error
          retention-days: 14
