name: OPS FatePrice Transient Recovery

on:
  push:
    branches:
      - ops/fateprice-ten-set-expansion-2026-09-06
    paths:
      - '.github/workflows/ops-fateprice-transient-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-transient-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { tcgdex: base2, pokemon: base2, canonical: fdset_7dd6dd0379aa92a9852ddf35, name: Jungle }
          - { tcgdex: cel25cc, pokemon: cel25c, canonical: fdset_b2691287e860786632039d1b, name: Celebrations Classic Collection }
          - { tcgdex: dv1, pokemon: dv1, canonical: fdset_7c307756310688b644c26e09, name: Dragon Vault }
          - { tcgdex: ex11, pokemon: ex11, canonical: fdset_0a7cad56a4a5b82a2745bb72, name: Delta Species }
          - { tcgdex: ex7, pokemon: ex7, canonical: fdset_659359881e9d0ef2d7ea5f05, name: Team Rocket Returns }
          - { tcgdex: pop5, pokemon: pop5, canonical: fdset_ad8ea06ef04ef6031fc6b2f1, name: POP Series 5 }
          - { tcgdex: pop8, pokemon: pop8, canonical: fdset_e4a0d6d0929ac3c4e7ad2af2, name: POP Series 8 }
          - { tcgdex: pop9, pokemon: pop9, canonical: fdset_43454652b68e0203806852a4, name: POP Series 9 }
          - { tcgdex: sm10, pokemon: sm10, canonical: fdset_b2252178f92598b6da58a964, name: Unbroken Bonds }
          - { tcgdex: sm115, pokemon: sm115, canonical: fdset_85dc6bfb94e86b5542ad5f87, name: Hidden Fates }
          - { tcgdex: sv04.5, pokemon: sv4pt5, canonical: fdset_358f437130d29e7d27248d68, name: Paldean Fates }
          - { tcgdex: sv07, pokemon: sv7, canonical: fdset_edba7af13aa1cd87711a75fe, name: Stellar Crown }
          - { tcgdex: sv08.5, pokemon: sv8pt5, canonical: fdset_7f936351f9758992234f103f, name: Prismatic Evolutions }
          - { tcgdex: sv09, pokemon: sv9, canonical: fdset_419d06c9a4aa8a2d4383b723, name: Journey Together }
          - { tcgdex: swsh2, pokemon: swsh2, canonical: fdset_d88ed220b794883174fe1a21, name: Rebel Clash }
          - { tcgdex: swsh4, pokemon: swsh4, canonical: fdset_a3a93600938b64ca3332876e, name: Vivid Voltage }
          - { tcgdex: swsh4.5sv, pokemon: swsh45sv, canonical: fdset_d28f82373ff221d9d5bcb151, name: Shining Fates Shiny Vault }
          - { tcgdex: xy1, pokemon: xy1, canonical: fdset_d4bf09278c1cc06507e25b5d, name: XY }
          - { tcgdex: xy2, pokemon: xy2, canonical: fdset_7752163f8b59bd59a186d98a, name: Flashfire }
          - { tcgdex: xy3, pokemon: xy3, canonical: fdset_c27dca469765609178bf61ee, name: Furious Fists }
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Retry exact catalogue compilation
        shell: bash
        env:
          TCGDEX_SET: ${{ matrix.tcgdex }}
          POKEMON_SET: ${{ matrix.pokemon }}
          EXPECTED_CANONICAL: ${{ matrix.canonical }}
          SET_NAME: ${{ matrix.name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { adaptTcgdexSet } from './src/trader/catalogue/tcgdex-adapter.mjs';
          import { adaptPokemonTcgSet } from './src/trader/catalogue/pokemontcg-adapter.mjs';
          import { createPokemonTcgClient, createTcgdexClient } from './src/trader/catalogue/source-clients.mjs';
          import { reconcileSetEvidence } from './src/trader/catalogue/reconcile.mjs';
          import { reconcilePokemonCardCollections } from './src/trader/catalogue/pipeline.mjs';
          import { promoteMatchedCardEvidence } from './src/trader/catalogue/verification.mjs';
          import { buildVerifiedCatalogueBatch } from './src/trader/catalogue/persistence.mjs';

          const verifiedAt = Date.now();
          const tcgdex = createTcgdexClient({ languageCode: 'en', retryAttempts: 6 });
          const pokemon = createPokemonTcgClient({ apiKey: process.env.POKEMON_TCG_API_KEY || null, retryAttempts: 6 });
          const result = {
            format: 'fatedrop-pokemon-catalogue-recovery-v1',
            generatedAt: new Date(verifiedAt).toISOString(),
            requested: { tcgdexSetId: process.env.TCGDEX_SET, pokemonTcgSetId: process.env.POKEMON_SET, canonicalSetId: process.env.EXPECTED_CANONICAL, setName: process.env.SET_NAME },
            safety: { productionWrites: false, exactTwoSourceReconciliation: true, fuzzyMatching: false, rejectedSetsAreNotPromoted: true },
            status: 'rejected', reasons: [], rows: null,
          };
          try {
            const [rawTcgdexSet, rawPokemonSet] = await Promise.all([
              tcgdex.getSet(process.env.TCGDEX_SET),
              pokemon.getSet(process.env.POKEMON_SET),
            ]);
            const tcgdexEvidence = adaptTcgdexSet(rawTcgdexSet);
            const setMatch = reconcileSetEvidence(tcgdexEvidence, adaptPokemonTcgSet(rawPokemonSet));
            if (setMatch.status !== 'matched' || setMatch.canonicalSetId !== process.env.EXPECTED_CANONICAL) throw new Error('verified set crosswalk changed during recovery');
            const refs = (rawTcgdexSet.cards || []).map((row) => String(row?.id || '').trim()).filter(Boolean);
            if (!refs.length) throw new Error('TCGdex set contains no cards');
            const tcgdexCards = [];
            for (const id of refs) tcgdexCards.push(await tcgdex.getCard(id));
            const pokemonCards = await pokemon.listCardsBySet(process.env.POKEMON_SET);
            const cardResults = reconcilePokemonCardCollections({ tcgdexCards, pokemonTcgCards: pokemonCards, setMatch, sourceSeriesCode: tcgdexEvidence.sourceSeriesCode, languageCode: 'en' });
            if (tcgdexCards.length !== pokemonCards.length) result.reasons.push('source_card_count_mismatch');
            if (cardResults.matched.length !== tcgdexCards.length) result.reasons.push('not_all_source_cards_reconciled');
            if (cardResults.conflicts.length) result.reasons.push('card_conflicts_present');
            if (cardResults.quarantined.length) result.reasons.push('quarantined_cards_present');
            if (cardResults.unmatched.length) result.reasons.push('unmatched_cards_present');
            result.evidence = { sourceCards: tcgdexCards.length, independentCards: pokemonCards.length, matched: cardResults.matched.length, conflicts: cardResults.conflicts.length, quarantined: cardResults.quarantined.length, unmatched: cardResults.unmatched.length };
            if (result.reasons.length === 0) {
              const promotions = cardResults.matched.map((match) => promoteMatchedCardEvidence(match, { verifiedAt }));
              const rejectedPromotion = promotions.find((promotion) => promotion.status !== 'verified');
              if (rejectedPromotion) throw new Error(`promotion rejected: ${rejectedPromotion.reason || 'unknown'}`);
              const batch = buildVerifiedCatalogueBatch({ setMatch, promotions, verifiedAt });
              result.status = 'verified';
              result.rows = batch;
              result.counts = { printings: batch.printings.length, cardIdentities: batch.cardIdentities.length, sourceMappings: batch.cardSourceMappings.length, provenance: batch.cardProvenance.length };
            }
          } catch (error) {
            result.reasons.push('compiler_error');
            result.error = error?.message || String(error);
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/recovery-result.json', JSON.stringify(result));
          console.log(`${result.status.toUpperCase()} ${process.env.SET_NAME}: ${result.counts?.cardIdentities || 0}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fateprice-recovery-${{ matrix.tcgdex }}
          path: ${{ runner.temp }}/recovery-result.json
          retention-days: 14
          if-no-files-found: error

  aggregate-recovery:
    needs: retry-transient-sets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fateprice-recovery-*
          path: ${{ runner.temp }}/recovery-results
      - name: Aggregate recovery evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/recovery-results';
          const files = fs.existsSync(root) ? fs.readdirSync(root, { recursive: true }).filter((name) => String(name).endsWith('recovery-result.json')) : [];
          const rows = files.map((name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')));
          const verified = rows.filter((row) => row.status === 'verified');
          const rejected = rows.filter((row) => row.status !== 'verified');
          const report = {
            format: 'fatedrop-pokemon-transient-recovery-v1',
            generatedAt: new Date().toISOString(),
            safety: { productionWrites: false, exactOnly: true, fuzzyMatching: false },
            baseline: { verifiedSets: 76, verifiedCardIdentities: 14835 },
            counts: {
              attemptedSets: rows.length,
              recoveredSets: verified.length,
              stillRejectedSets: rejected.length,
              recoveredPrintings: verified.reduce((n, row) => n + (row.counts?.printings || 0), 0),
              recoveredCardIdentities: verified.reduce((n, row) => n + (row.counts?.cardIdentities || 0), 0),
              projectedVerifiedSets: 76 + verified.length,
              projectedVerifiedCardIdentities: 14835 + verified.reduce((n, row) => n + (row.counts?.cardIdentities || 0), 0),
            },
            recovered: verified.map((row) => ({ ...row.requested, counts: row.counts, evidence: row.evidence })),
            rejected: rejected.map((row) => ({ ...row.requested, reasons: row.reasons, error: row.error || null, evidence: row.evidence || null })),
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/fateprice-transient-recovery-summary.json', JSON.stringify(report));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# FatePrice transient recovery\n\n- Attempted: **${report.counts.attemptedSets}**\n- Recovered clean sets: **${report.counts.recoveredSets}**\n- Still rejected: **${report.counts.stillRejectedSets}**\n- Recovered exact card identities: **${report.counts.recoveredCardIdentities}**\n- Projected verified sets: **${report.counts.projectedVerifiedSets}**\n- Projected exact card identities: **${report.counts.projectedVerifiedCardIdentities}**\n- Production writes: **0**\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: fateprice-transient-recovery-summary
          path: ${{ runner.temp }}/fateprice-transient-recovery-summary.json
          retention-days: 14
          if-no-files-found: error
