name: Cardmarket Fast Full Rehearsal 2026-09-15

on:
  push:
    branches:
      - ops/cardmarket-fast-full-rehearsal-2026-09-15
    paths:
      - '.github/workflows/cardmarket-fast-full-rehearsal-2026-09-15.yml'
      - 'signal-engine/src/trader/value/cardmarket-full-market-history-preservation-audit-cli.mjs'

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run full 26,691-card fast exact proof
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          TCGGO_FALLBACK_CONCURRENCY: '24'
          TCGGO_FALLBACK_DELAY_MS: '100'
          TCGGO_PROGRESS_EVERY: '250'
        run: node src/trader/value/cardmarket-full-market-exact-proof-cli.mjs
      - name: Strictly validate exact proof
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-url-first-tcggo-strict-validate.mjs
      - name: Build simple full-market recertification plan
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs
      - name: Audit history-preserving repair shape
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-full-market-history-preservation-audit-cli.mjs
      - name: Rehearse exact production mapping changes and roll back
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          MAPPING_WRITE: 'false'
        run: node src/trader/value/cardmarket-full-market-recertification-release-cli.mjs
      - name: Upload complete rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-fast-full-rehearsal-2026-09-15
          path: |
            ${{ runner.temp }}/cardmarket-url-first-tcggo-full.json
            ${{ runner.temp }}/cardmarket-full-market-exact-proof-progress.json
            ${{ runner.temp }}/cardmarket-url-first-tcggo-strict.json
            ${{ runner.temp }}/cardmarket-full-market-recertification.json
            ${{ runner.temp }}/cardmarket-full-market-history-preservation-audit.json
            ${{ runner.temp }}/cardmarket-full-market-recertification-release.json
          if-no-files-found: warn
          retention-days: 14
