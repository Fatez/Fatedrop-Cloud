name: Apply operator supersession patch

on:
  push:
    branches:
      - fix/operator-allocation-supersession-2026-09-02

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'chore: apply operator supersession patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operator-allocation-supersession-2026-09-02
          fetch-depth: 0
      - name: Apply narrow operator intake patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('signal-engine/src/encounters/operator-local-radar-intake.mjs')
          s = p.read_text()

          old = '''import {
            inspectCuratedIncomingIntelTargets,
            reconcileCuratedIncomingIntel,
          } from "./curated-incoming-intel-reconcile.mjs";
          '''.replace('          ', '')
          new = old + '''import {
            normalizeOperatorIssueSupersessionList,
            supersedeOperatorPhysicalEchoObservations,
          } from "./operator-allocation-supersession.mjs";
          '''.replace('          ', '')
          if old not in s:
            raise SystemExit('import target not found')
          s = s.replace(old, new, 1)

          old = '''  const issueNumber = Number(issue.number);
          if (!Number.isInteger(issueNumber) || issueNumber <= 0) throw new Error("Operator issue number is invalid");
          '''.replace('          ', '')
          new = old + '''  const supersedesOperatorIssues = normalizeOperatorIssueSupersessionList(payload.supersedesOperatorIssues, issueNumber);
            if (supersedesOperatorIssues.length && testOnly) throw new Error("TEST ONLY operator issues cannot supersede production allocation evidence");
            if (supersedesOperatorIssues.length && availabilityScope !== "physical_branch") throw new Error("Only physical-branch operator allocations may supersede earlier allocation issues");
          '''.replace('            ', '  ').replace('          ', '')
          if old not in s:
            raise SystemExit('issue-number target not found')
          s = s.replace(old, new, 1)

          old = '''  return {
            issueNumber,
            testOnly,
          '''.replace('          ', '')
          new = '''  return {
            issueNumber,
            supersedesOperatorIssues,
            testOnly,
          '''.replace('          ', '')
          if old not in s:
            raise SystemExit('parsed return target not found')
          s = s.replace(old, new, 1)

          old = '''  const reconciliation = parsed.testOnly
            ? await inspectCuratedIncomingIntelTargets({ store, entries: [parsed.entry], now })
            : await reconcileCuratedIncomingIntel({ store, entries: [parsed.entry], now });
          const notification = buildOperatorNotification(parsed, reconciliation);
          '''.replace('          ', '')
          new = '''  const reconciliation = parsed.testOnly
            ? await inspectCuratedIncomingIntelTargets({ store, entries: [parsed.entry], now })
            : await reconcileCuratedIncomingIntel({ store, entries: [parsed.entry], now });
            const supersessionRequested = !parsed.testOnly && parsed.supersedesOperatorIssues.length > 0;
            const newEvidenceAvailable = reconciliation.matchedBranches > 0
              && (Number(reconciliation.saved || 0) + Number(reconciliation.duplicates || 0)) > 0;
            if (supersessionRequested && !newEvidenceAvailable) {
              return {
                status: "held",
                testOnly: false,
                eventId: parsed.eventId,
                matchedBranches: reconciliation.matchedBranches,
                expectedBranches: parsed.entry.targetBranches.length,
                unmatchedTargets: reconciliation.unmatchedTargets,
                supersession: { superseded: 0, operatorIssueNumbers: parsed.supersedesOperatorIssues, reason: "replacement_evidence_not_persisted" },
                truthRule: `${reconciliation.truthRule} Earlier allocation evidence remains active because no replacement branch evidence was persisted.`,
              };
            }
            const supersession = supersessionRequested
              ? await supersedeOperatorPhysicalEchoObservations({
                  store,
                  retailerId: parsed.entry.retailerId,
                  operatorIssueNumbers: parsed.supersedesOperatorIssues,
                  supersededByOperatorIssue: parsed.issueNumber,
                  now,
                })
              : { superseded: 0, operatorIssueNumbers: [] };
            const notification = buildOperatorNotification(parsed, reconciliation);
          '''.replace('            ', '  ').replace('          ', '')
          if old not in s:
            raise SystemExit('reconciliation target not found')
          s = s.replace(old, new, 1)

          # Add supersession to the three physical-path result payloads only.
          old = '''      unmatchedTargets: reconciliation.unmatchedTargets,
                truthRule: reconciliation.truthRule,
          '''.replace('          ', '')
          new = '''      unmatchedTargets: reconciliation.unmatchedTargets,
                supersession,
                truthRule: reconciliation.truthRule,
          '''.replace('          ', '')
          if old not in s:
            raise SystemExit('held result target not found')
          s = s.replace(old, new, 1)

          old = '''      push: { published: false, reason: "radius_targeting_required" },
                truthRule: `${reconciliation.truthRule} Physical interrupt delivery is held until recipient radius targeting is proven.`,
          '''.replace('          ', '')
          new = '''      push: { published: false, reason: "radius_targeting_required" },
                supersession,
                truthRule: `${reconciliation.truthRule} Physical interrupt delivery is held until recipient radius targeting is proven.`,
          '''.replace('          ', '')
          if old not in s:
            raise SystemExit('ingested result target not found')
          s = s.replace(old, new, 1)

          old = '''    push,
              truthRule: reconciliation.truthRule,
          '''.replace('          ', '')
          new = '''    push,
              supersession,
              truthRule: reconciliation.truthRule,
          '''.replace('          ', '')
          if old not in s:
            raise SystemExit('published result target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name Fatez
          git config user.email cdotkeeley@gmail.com
          git add signal-engine/src/encounters/operator-local-radar-intake.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply operator supersession patch"
          git push origin HEAD:fix/operator-allocation-supersession-2026-09-02
