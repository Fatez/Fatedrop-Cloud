name: Probe retailer wave 1 feeds

on:
  push:
    branches:
      - feat/retailer-wave-1-live-2026-09-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Shiny Vault standard Shopify JSON fallback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const urls = [
            'https://shinyvault-theme-1w7qn.myshopify.com/products.json?limit=250',
            'https://shinyvault-theme-1w7qn.myshopify.com/collections/sealed/products.json?limit=250',
          ];
          let usable = false;
          for (const url of urls) {
            const r = await fetch(url, { headers: { 'user-agent': 'FateDrop qualification probe/1.0', accept: 'application/json' }, redirect: 'follow' });
            const text = await r.text();
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            const products = Array.isArray(payload?.products) ? payload.products : [];
            const stock = products.filter((p) => (p?.variants || []).some((v) => typeof v?.available === 'boolean')).length;
            const sealed = products.filter((p) => /booster|elite trainer|\betb\b|collection|tin\b|blister|bundle|box\b|pack\b|premium/i.test(String(p?.title || ''))).length;
            console.log(JSON.stringify({ url, status: r.status, finalUrl: r.url, contentType: r.headers.get('content-type'), products: products.length, sealed, stock, bodyPrefix: text.slice(0, 120) }));
            if (r.ok && products.length && stock) usable = true;
          }
          if (!usable) throw new Error('No standard Shopify JSON route usable');
          NODE
