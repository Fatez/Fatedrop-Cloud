name: Probe retailer wave 1 feeds

on:
  push:
    branches:
      - feat/retailer-wave-1-live-2026-09-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci
      - name: Dry run exact Wave 1 adapters
        working-directory: signal-engine
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { scanRetailerSource } from './src/adapters/index.mjs';
          import { retailerWave1LaunchRetailers } from './src/retailers/retailer-wave-1.mjs';

          const results = [];
          for (const retailer of retailerWave1LaunchRetailers()) {
            const scan = await scanRetailerSource(retailer);
            const expectedMinimum = Number(retailer.monitoring?.expectedMinimumProducts || 1);
            const result = {
              retailer: retailer.id,
              name: retailer.name,
              adapter: retailer.adapterType,
              products: scan.products?.length || 0,
              pages: scan.pages?.length || 0,
              complete: scan.complete === true,
              partialCatalogue: scan.partialCatalogue === true,
              expectedMinimum,
              inStock: (scan.products || []).filter((item) => item.stockStatus === 'in_stock').length,
              outOfStock: (scan.products || []).filter((item) => item.stockStatus === 'out_of_stock').length,
              unknownStock: (scan.products || []).filter((item) => item.stockStatus === 'unknown').length,
              sample: (scan.products || []).slice(0, 3).map((item) => ({ sku: item.retailerSku, title: item.title, stockStatus: item.stockStatus })),
            };
            console.log(JSON.stringify(result));
            if (result.partialCatalogue || !result.complete) throw new Error(`${retailer.id}: catalogue incomplete`);
            if (result.products < expectedMinimum) throw new Error(`${retailer.id}: below expected minimum (${result.products} < ${expectedMinimum})`);
            if (result.unknownStock > 0) throw new Error(`${retailer.id}: unknown stock mapping present`);
            results.push(result);
          }
          console.log('WAVE1_DRY_RUN=' + JSON.stringify(results));
          NODE
