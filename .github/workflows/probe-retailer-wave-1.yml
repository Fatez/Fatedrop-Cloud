name: Probe retailer wave 1 feeds

on:
  push:
    branches:
      - feat/retailer-wave-1-live-2026-09-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract Shiny Vault product hook
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://shinyvault.co.uk/';
          const candidates = [
            'assets/useShopifyProducts-CC4yLbTQ.js',
            'assets/ProductListing-DjI_PWGm.js',
            'assets/query-D1_lVyFO.js',
          ];
          for (const path of candidates) {
            const url = new URL(path, base).toString();
            const r = await fetch(url, { headers: { 'user-agent': 'FateDrop qualification probe/1.0' } });
            console.log(JSON.stringify({ url, status: r.status }));
            if (!r.ok) continue;
            const js = await r.text();
            console.log('FILE ' + path + ' BYTES=' + js.length);
            const clues = [...new Set(js.match(/.{0,180}(?:supabase|shopify|from\(|rpc\(|\/api\/|products?|collections?|inventory|available|stock).{0,260}/gi) || [])];
            console.log('CLUES ' + path + '=' + JSON.stringify(clues.slice(0, 60)));
            const urls = [...new Set(js.match(/https?:\\?\/\\?\/[A-Za-z0-9._~:/?#[\]@!$&'()*+,;=%\\-]+/g) || [])];
            console.log('URLS ' + path + '=' + JSON.stringify(urls.slice(0, 30)));
          }
          NODE
