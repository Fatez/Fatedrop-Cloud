name: Physical Echo intelligence safe gate v4

on:
  push:
    branches: [feat/retailer-intelligence-surfaces-2026-09-01]
    paths:
      - ".github/workflows/physical-echo-intelligence-safe-gate-v4.yml"

permissions:
  contents: write

jobs:
  validate-apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailer-intelligence-surfaces-2026-09-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate all anchors in VFS, then materialize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          safe = Path('.github/workflows/physical-echo-intelligence-safe-gate-v2.yml').read_text()
          marker = "python - <<'PY' 2>&1 | tee /tmp/physical-echo-safe-v2-patch.log\n"
          if marker not in safe or "\n          PY" not in safe:
              raise SystemExit('could not extract VFS preflight script')
          code = dedent(safe.split(marker, 1)[1].split("\n          PY", 1)[0])

          stale = '''          assert.equal(result.notifications[0].held, true);
          assert.equal(result.notifications[0].reason, "radius_targeting_required");'''
          corrected = '''          assert.equal(result.notificationResults[0].held, true);
          assert.equal(result.notificationResults[0].reason, "radius_targeting_required");'''
          if code.count(stale) != 1:
              raise SystemExit(f'stale held-result assertion matched {code.count(stale)} times; expected exactly once')
          code = code.replace(stale, corrected, 1)

          injection_anchor = 'print(f"PREFLIGHT_OK anchors={globals_dict.get(\'patch_counter\')} files={len(touched)}")'
          injection = """surface_path = VirtualPath('signal-engine/src/encounters/retailer-intelligence-surfaces.mjs')
          surface_text = surface_path.read_text()
          old_hold = 'notifications.push({ eventId: notification.eventId, productTitle: change.product.title, published: false, held: true, reason: "radius_targeting_required" });'
          hold_spans = normalized_spans(surface_text, old_hold)
          print(f"AUDIT_ANCHOR held_echo_card normalized_matches={len(hold_spans)}")
          if len(hold_spans) != 1:
              raise SystemExit(f'held Echo audit anchor matched {len(hold_spans)} times; expected exactly once')
          source_lines = surface_text.splitlines()
          hold_start, hold_end = hold_spans[0]
          new_hold = 'notifications.push({ ...notification, published: false, held: true, reason: "radius_targeting_required" });'
          surface_path.write_text("\\n".join(source_lines[:hold_start] + [new_hold] + source_lines[hold_end:]) + ("\\n" if surface_text.endswith("\\n") else ""))

          test_path = VirtualPath('signal-engine/tests/retailer-intelligence-surfaces.test.mjs')
          test_text = test_path.read_text()
          old_assert = '''assert.equal(result.notificationResults[0].reason, "radius_targeting_required");
          assert.ok(result.changes.some((change) => change.reasons.includes("product_added")));'''
          new_assert = '''assert.equal(result.notificationResults[0].reason, "radius_targeting_required");
          assert.equal(result.notificationResults[0].stage, "ECHO");
          assert.match(result.notificationResults[0].body, /not confirmed/i);
          assert.ok(result.changes.some((change) => change.reasons.includes("product_added")));'''
          assert_spans = normalized_spans(test_text, old_assert)
          print(f"AUDIT_ANCHOR held_echo_test normalized_matches={len(assert_spans)}")
          if len(assert_spans) != 1:
              raise SystemExit(f'held Echo test anchor matched {len(assert_spans)} times; expected exactly once')
          test_lines = test_text.splitlines()
          assert_start, assert_end = assert_spans[0]
          test_path.write_text("\\n".join(test_lines[:assert_start] + dedent(new_assert).strip("\\n").splitlines() + test_lines[assert_end:]) + ("\\n" if test_text.endswith("\\n") else ""))

          """ + injection_anchor
          if code.count(injection_anchor) != 1:
              raise SystemExit(f'VFS materialization anchor matched {code.count(injection_anchor)} times; expected exactly once')
          code = code.replace(injection_anchor, injection, 1)
          exec(compile(code, 'physical-echo-safe-v4.py', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Focused physical Echo and retailer-intelligence tests
        working-directory: signal-engine
        run: node --test tests/physical-echo-contract.test.mjs tests/retailer-intelligence-surfaces.test.mjs

      - name: Full Signal Engine suite
        working-directory: signal-engine
        run: npm test

      - name: Install collector dependencies
        working-directory: collectors/pokemon-center-browser
        run: npm ci

      - name: Collector suite
        working-directory: collectors/pokemon-center-browser
        run: npm test

      - name: Commit only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add signal-engine collectors/pokemon-center-browser/src/index.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock physical stock to Echo intelligence"
          git push origin HEAD:feat/retailer-intelligence-surfaces-2026-09-01
