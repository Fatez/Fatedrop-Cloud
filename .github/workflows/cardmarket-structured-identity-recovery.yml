name: Cardmarket Structured Identity Recovery

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Persist conflict-free exact mappings and run guarded Cardmarket price ingest'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/cardmarket-structured-section-b-recovery-2026-09-13
    paths:
      - '.github/workflows/cardmarket-structured-identity-recovery.yml'
      - 'signal-engine/src/trader/value/cardmarket-structured-identity-recovery-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-structured-expansion-audit-cli.mjs'
      - 'signal-engine/tests/cardmarket-structured-identity-recovery.test.mjs'

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-structured-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run focused structured-recovery regression tests
        run: node --test tests/cardmarket-structured-identity-recovery.test.mjs
      - name: Resolve Section B and derive missing Cardmarket set scopes
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          EXPECTED_SECTION_B: '1222'
        run: node src/trader/value/cardmarket-structured-expansion-audit-cli.mjs
      - name: Upload structured expansion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-structured-expansion-audit
          path: ${{ runner.temp }}/cardmarket-structured-expansion-audit.json
          if-no-files-found: error
          retention-days: 14
