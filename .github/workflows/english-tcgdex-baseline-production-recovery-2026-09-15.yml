name: English TCGdex Baseline Production Recovery 2026-09-15

on:
  push:
    branches:
      - ops/english-exact-production-recovery-2026-09-15
    paths:
      - '.github/workflows/english-tcgdex-baseline-production-recovery-2026-09-15.yml'

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: signal-engine
    env:
      DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
      TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
      TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Persist strict explicit baseline finish mappings
        env:
          MAPPING_WRITE: 'true'
        run: node src/trader/value/cardmarket-tcgdex-explicit-baseline-finish-recovery-cli.mjs
      - name: Ingest current Cardmarket prices
        env:
          CARDMARKET_MODE: persist
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs
      - name: Retain production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-tcgdex-baseline-production-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cardmarket-tcgdex-explicit-baseline-finish-recovery.json
            ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: warn
          retention-days: 14
