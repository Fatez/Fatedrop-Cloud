name: Cardmarket Full English Market Recertification Audit

on:
  push:
    branches:
      - audit/cardmarket-url-first-rebuild-2026-09-15
    paths:
      - '.github/workflows/cardmarket-url-first-rebuild-audit.yml'
      - 'signal-engine/evidence/cardmarket-url-first-rebuild-source-2026-09-15.json'
      - 'signal-engine/evidence/cardmarket-url-first-sample-crosswalk-2026-09-15.json'
      - 'signal-engine/src/trader/value/cardmarket-url-first-rebuild.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-rebuild-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-rebuild-validate.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-sample-validate-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-exact-proof-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-tcggo-strict-validate.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-release-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-verify-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-reverse-public-market.mjs'
      - 'signal-engine/src/trader/value/cardmarket-reverse-public-cycle-cli.mjs'
      - 'signal-engine/src/trader/value/provider-policy.mjs'
      - 'signal-engine/src/trader/value/tcgdex-repository-cardmarket-evidence.mjs'
      - 'signal-engine/src/trader/value/cardmarket-tcgdex-root-evidence.mjs'
      - 'signal-engine/tests/cardmarket-url-first-rebuild.test.mjs'
      - 'signal-engine/tests/cardmarket-reverse-public-market.test.mjs'

permissions:
  contents: read

concurrency:
  group: cardmarket-full-english-recertification-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci

      - name: Run deterministic mapping and reverse-offer tests
        run: |
          node --test tests/cardmarket-url-first-rebuild.test.mjs
          node --test tests/cardmarket-reverse-public-market.test.mjs

      - name: Run syntax gates for corrected full-market planner, exact proof, reverse lane and release
        run: |
          node --check src/trader/value/cardmarket-full-market-exact-proof-cli.mjs
          node --check src/trader/value/cardmarket-full-market-recertification-cli.mjs
          node --check src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs
          node --check src/trader/value/cardmarket-full-market-recertification-release-cli.mjs
          node --check src/trader/value/cardmarket-full-market-recertification-verify-cli.mjs
          node --check src/trader/value/cardmarket-reverse-public-market.mjs
          node --check src/trader/value/cardmarket-reverse-public-cycle-cli.mjs

      - name: Compare simple deterministic model with every eligible production mapping
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-url-first-rebuild-cli.mjs

      - name: Fail closed on simple-model source collisions
        run: node src/trader/value/cardmarket-url-first-rebuild-validate.mjs

      - name: Validate exact URL and collector-number sample crosswalk
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-url-first-sample-validate-cli.mjs

      - name: Prove every market identity from pinned TCGdex then network-fallback only the residual
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          TCGGO_FALLBACK_CONCURRENCY: '12'
          TCGGO_FALLBACK_DELAY_MS: '150'
          TCGGO_PROGRESS_EVERY: '100'
        run: node src/trader/value/cardmarket-full-market-exact-proof-cli.mjs

      - name: Require official Cardmarket product-name compatibility on exact-proof results
        run: node src/trader/value/cardmarket-url-first-tcggo-strict-validate.mjs

      - name: Build corrected full English-market reconciliation including reverse mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs

      - name: Rehearse the complete corrected recertification transaction with rollback
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          MAPPING_WRITE: 'false'
        run: node src/trader/value/cardmarket-full-market-recertification-release-cli.mjs

      - name: Upload full recertification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-full-market-recertification
          path: |
            ${{ runner.temp }}/cardmarket-url-first-rebuild.json
            ${{ runner.temp }}/cardmarket-url-first-sample-validation.json
            ${{ runner.temp }}/cardmarket-full-market-exact-proof-progress.json
            ${{ runner.temp }}/cardmarket-url-first-tcggo-full.json
            ${{ runner.temp }}/cardmarket-url-first-tcggo-strict.json
            ${{ runner.temp }}/cardmarket-full-market-recertification.json
            ${{ runner.temp }}/cardmarket-full-market-recertification-release.json
          if-no-files-found: warn
          retention-days: 30
