name: Local Radar canonical enrichment safe gate v2

on:
  push:
    branches:
      - feat/local-radar-location-quality-2026-09-01
    paths:
      - .github/workflows/local-radar-canonical-enrichment-safe-gate-v2.yml

permissions:
  contents: write

jobs:
  patch-test-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: feat/local-radar-location-quality-2026-09-01
      PINNED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - name: Pin isolated branch tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"

      - name: Reuse v1 source patch and correct provisional review fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'BOOT'
          from pathlib import Path

          source = Path('.github/workflows/local-radar-canonical-enrichment-safe-gate.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          exec(compile(script, 'canonical-enrichment-v1-patch.py', 'exec'), {})

          review = Path('signal-engine/tests/local-radar-location-quality-review.test.mjs')
          text = review.read_text()
          old_row = '{ id: "tesco-unknown-format", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-unknown", name: "Tesco Watford", address: "Watford", postcode: "WD18 0AA", latitude: 51.66, longitude: -0.40, storeFormat: "unknown" },'
          new_row = '{ id: "tesco-unknown-format", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-unknown", name: "Tesco Watford", address: "Watford", postcode: "WD18 0AA", latitude: 51.66, longitude: -0.40, storeFormat: "unknown", identityStatus: "provisional" },'
          if text.count(old_row) != 1:
              raise SystemExit(f'provisional fixture row matched {text.count(old_row)} times; expected once')
          text = text.replace(old_row, new_row, 1)
          old_assert = '    assert.equal(byId.get("tesco-unknown-format").visibilityClass, "directory-only");'
          new_assert = '    assert.equal(byId.get("tesco-unknown-format").visibilityClass, "unresolved");'
          if text.count(old_assert) != 1:
              raise SystemExit('provisional fixture assertion anchor mismatch')
          text = text.replace(old_assert, new_assert, 1)
          old_counts = '''    assert.equal(tesco.directoryOnly, 3);\n    assert.equal(tesco.excluded, 2);\n    assert.equal(tesco.unresolved, 0);'''
          new_counts = '''    assert.equal(tesco.directoryOnly, 2);\n    assert.equal(tesco.excluded, 2);\n    assert.equal(tesco.unresolved, 1);'''
          if text.count(old_counts) != 1:
              raise SystemExit('review count assertion anchor mismatch')
          review.write_text(text.replace(old_counts, new_counts, 1))
          BOOT

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Focused Local Radar proofs
        working-directory: signal-engine
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/local-radar-location-policy.test.mjs \
            tests/local-radar-branch-persistence.test.mjs \
            tests/local-radar-canonical-branches.test.mjs \
            tests/local-radar-location-quality-review.test.mjs \
            tests/curated-incoming-intel-reconcile.test.mjs \
            tests/operator-local-radar-intake.test.mjs

      - name: Full Signal Engine regression
        working-directory: signal-engine
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../local-radar-canonical-enrichment-v2-full-suite.log
          status=${PIPESTATUS[0]}
          echo "FULL_SUITE_EXIT=$status"
          tail -n 180 ../local-radar-canonical-enrichment-v2-full-suite.log
          exit "$status"

      - name: Run existing UK-wide public probe with patched classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/local-radar-public-impact-probe.yml').read_text()
          start_marker = "          node --input-type=module <<'NODE'\n"
          end_marker = "          NODE\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          Path('/tmp/local-radar-public-impact.mjs').write_text(script)
          PY
          node /tmp/local-radar-public-impact.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('local-radar-public-impact.json', 'utf8'));
          const before = Number(report?.totals?.uniqueCurrentPublicShopsObserved || 0);
          const after = Number(report?.totals?.afterStrictGate || 0);
          const removed = Number(report?.totals?.removedByStrictGate || 0);
          const noise = Number(report?.totals?.obviousServiceNoiseCurrentlyPublic || 0);
          const survivingNoise = (report.obviousNoiseSamples || []).filter((row) => row.visibilityClass === 'eligible');
          if (before < 2000) throw new Error(`UK mesh unexpectedly small: ${before}`);
          if (after < 2000) throw new Error(`canonical enrichment collapses useful map coverage: ${after}`);
          if (after / before < 0.85) throw new Error(`review removes too much public coverage: ${after}/${before}`);
          if (removed < 1 || noise < 1) throw new Error('review did not identify current public service noise');
          if (survivingNoise.length) throw new Error(`obvious service noise remains eligible: ${survivingNoise.length}`);
          console.log(JSON.stringify({ before, after, removed, noise, survivingNoise: survivingNoise.length }, null, 2));
          NODE

      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-radar-canonical-enrichment-v2-review
          path: |
            local-radar-canonical-enrichment-v2-full-suite.log
            local-radar-public-impact.json
          if-no-files-found: warn
          retention-days: 2

      - name: Inspect exact review diff
        shell: bash
        run: |
          set -euo pipefail
          git add \
            signal-engine/src/encounters/canonical-retailer-locations.mjs \
            signal-engine/src/encounters/local-radar-branch-persistence.mjs \
            signal-engine/src/encounters/local-radar-location-policy.mjs \
            signal-engine/src/encounters/local-radar.mjs \
            signal-engine/tests/local-radar-branch-persistence.test.mjs \
            signal-engine/tests/local-radar-location-policy.test.mjs \
            signal-engine/tests/local-radar-location-quality-review.test.mjs
          git diff --cached --check
          git diff --cached --stat
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'signal-engine/src/encounters/canonical-retailer-locations.mjs\nsignal-engine/src/encounters/local-radar-branch-persistence.mjs\nsignal-engine/src/encounters/local-radar-location-policy.mjs\nsignal-engine/src/encounters/local-radar.mjs\nsignal-engine/tests/local-radar-branch-persistence.test.mjs\nsignal-engine/tests/local-radar-location-policy.test.mjs\nsignal-engine/tests/local-radar-location-quality-review.test.mjs'
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"

      - name: Commit review checkpoint only after every proof passes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"
          git add \
            signal-engine/src/encounters/canonical-retailer-locations.mjs \
            signal-engine/src/encounters/local-radar-branch-persistence.mjs \
            signal-engine/src/encounters/local-radar-location-policy.mjs \
            signal-engine/src/encounters/local-radar.mjs \
            signal-engine/tests/local-radar-branch-persistence.test.mjs \
            signal-engine/tests/local-radar-location-policy.test.mjs \
            signal-engine/tests/local-radar-location-quality-review.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(local-radar): preserve canonical branches while filtering service noise"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "REVIEW_CHECKPOINT=$(git rev-parse HEAD)"
