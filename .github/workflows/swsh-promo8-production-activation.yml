name: SWSH Promo 8 Production Activation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ACTIVATE_SWSH_PROMO8 to persist exactly the reviewed 8 SWSH promo mappings and refresh Cardmarket prices'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ inputs.confirm == 'ACTIVATE_SWSH_PROMO8' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci

      - name: Verify frozen SWSH promo policy semantics
        run: node --test tests/cardmarket-reviewed-swsh-promo-base-lane.test.mjs

      - name: Revalidate reviewed 8 against current production and current Cardmarket evidence
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          EXPECTED_SWSH_PROMO8_COUNT: '8'
          EXPECTED_SWSH_PROMO8_EXPANSION: '2916'
          EXPECTED_SWSH_PROMO8_DIGEST: 0d088d21476cd066ac9e3a64d698f76a969225bf85360699421af2d3f1d96025
        run: node src/trader/value/swsh-promos-reviewed-8-release-cli.mjs

      - name: Persist exactly the reviewed 8 mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          EXPECTED_SWSH_PROMO8_COUNT: '8'
          EXPECTED_SWSH_PROMO8_EXPANSION: '2916'
          EXPECTED_SWSH_PROMO8_DIGEST: 0d088d21476cd066ac9e3a64d698f76a969225bf85360699421af2d3f1d96025
          MAPPING_WRITE: 'true'
        run: node src/trader/value/swsh-promos-reviewed-8-release-cli.mjs

      - name: Refresh exact Cardmarket observations once
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: persist
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs

      - name: Upload guarded activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swsh-promo8-production-activation
          path: |
            ${{ runner.temp }}/swsh-promos-reviewed-8-release.json
            ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: error
          retention-days: 14
