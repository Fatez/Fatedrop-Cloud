name: Retry physical Echo intelligence lock v2

on:
  push:
    branches: [feat/retailer-intelligence-surfaces-2026-09-01]
    paths:
      - ".github/workflows/retry-physical-echo-intelligence-lock-v2.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailer-intelligence-surfaces-2026-09-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: apply
        name: Apply physical Echo patch using structural anchors
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/physical-echo-patch-v2.log
          from pathlib import Path
          from textwrap import dedent
          import re

          helper = Path('.github/workflows/apply-physical-echo-intelligence-lock.yml').read_text()
          marker = "python - <<'PY'\n"
          code = helper.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = dedent(code)

          old = '''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))'''
          new = '''patch_counter = 0
          def replace_once(path, old, new):
              global patch_counter
              patch_counter += 1
              print(f"PATCH {patch_counter}: {path}")
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              lines = old.splitlines()
              pattern = "\\n".join(r"[ \\t]*" + re.escape(line.strip()) + r"[ \\t]*" for line in lines)
              match = re.search(pattern, text)
              if not match:
                  print(f"MISSING PATCH {patch_counter}: {path}")
                  print(repr(old[:600]))
                  raise SystemExit(f"structural patch anchor missing in {path}")
              print(f"STRUCTURAL MATCH {patch_counter}: {path}")
              p.write_text(text[:match.start()] + new + text[match.end():])'''
          if old not in code:
              raise SystemExit('could not instrument replace_once helper')
          code = code.replace(old, new, 1)
          exec(compile(code, 'physical-echo-patch-v2.py', 'exec'), {'__name__': '__main__', 're': re})
          PY

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-patch-v2-diagnostic
          path: /tmp/physical-echo-patch-v2.log
          if-no-files-found: warn

      - name: Fail closed if patch did not apply
        if: steps.apply.outcome != 'success'
        run: exit 1

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Run focused physical Echo and intelligence tests
        working-directory: signal-engine
        run: node --test tests/physical-echo-contract.test.mjs tests/retailer-intelligence-surfaces.test.mjs

      - name: Run full Signal Engine suite
        working-directory: signal-engine
        run: npm test

      - name: Install collector dependencies
        working-directory: collectors/pokemon-center-browser
        run: npm ci

      - name: Run collector suite
        working-directory: collectors/pokemon-center-browser
        run: npm test

      - name: Commit proven source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add signal-engine collectors/pokemon-center-browser/src/index.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock physical stock to Echo intelligence"
          git push origin HEAD:feat/retailer-intelligence-surfaces-2026-09-01
