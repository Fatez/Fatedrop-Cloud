name: Physical Echo intelligence safe gate

on:
  push:
    branches: [feat/retailer-intelligence-surfaces-2026-09-01]
    paths:
      - ".github/workflows/physical-echo-intelligence-safe-gate.yml"

permissions:
  contents: write

jobs:
  validate-apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailer-intelligence-surfaces-2026-09-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: patch
        name: Preflight every anchor in virtual filesystem, then materialize atomically
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/physical-echo-safe-patch.log
          import pathlib
          from textwrap import dedent

          helper_path = pathlib.Path('.github/workflows/apply-physical-echo-intelligence-lock.yml')
          helper = helper_path.read_text()
          marker = "python - <<'PY'\n"
          if marker not in helper or "\n          PY" not in helper:
              raise SystemExit('could not extract physical Echo patch script')
          code = dedent(helper.split(marker, 1)[1].split("\n          PY", 1)[0])

          # Run the entire patch against an in-memory copy first. No repository
          # file is written until every sequential anchor has matched exactly once.
          vfs = {}
          touched = set()

          class VirtualPath:
              def __init__(self, value):
                  self.value = str(value)
              def read_text(self):
                  if self.value in vfs:
                      return vfs[self.value]
                  return pathlib.Path(self.value).read_text()
              def write_text(self, value):
                  vfs[self.value] = value
                  touched.add(self.value)
                  return len(value)
              def exists(self):
                  return self.value in vfs or pathlib.Path(self.value).exists()

          code = code.replace('from pathlib import Path\n', '')
          old_helper = '''def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))'''
          new_helper = '''patch_counter = 0
          def replace_once(path, old, new):
              global patch_counter
              patch_counter += 1
              p = Path(path)
              text = p.read_text()
              expected = dedent(old)
              replacement = dedent(new)
              matches = text.count(expected)
              print(f"ANCHOR {patch_counter}: {path} matches={matches}")
              if matches != 1:
                  print(repr(expected[:800]))
                  raise SystemExit(f"anchor {patch_counter} in {path} matched {matches} times; expected exactly once")
              p.write_text(text.replace(expected, replacement, 1))'''
          if old_helper not in code:
              raise SystemExit('could not instrument replace_once helper')
          code = code.replace(old_helper, new_helper, 1)

          globals_dict = {
              '__name__': '__main__',
              'Path': VirtualPath,
              'dedent': dedent,
          }
          exec(compile(code, 'physical-echo-safe-patch.py', 'exec'), globals_dict)

          print(f"PREFLIGHT_OK anchors={globals_dict.get('patch_counter', 'unknown')} files={len(touched)}")
          for rel in sorted(touched):
              pathlib.Path(rel).parent.mkdir(parents=True, exist_ok=True)
          # Materialize only after complete virtual success.
          for rel in sorted(touched):
              pathlib.Path(rel).write_text(vfs[rel])
              print(f"MATERIALIZED {rel}")
          PY

      - name: Upload patch preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-safe-patch-diagnostic
          path: /tmp/physical-echo-safe-patch.log
          if-no-files-found: warn

      - name: Fail closed if preflight or materialization failed
        if: steps.patch.outcome != 'success'
        run: exit 1

      - name: Verify diff hygiene before any test
        run: git diff --check

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - id: focused
        name: Run focused physical Echo and retailer-intelligence tests
        continue-on-error: true
        working-directory: signal-engine
        shell: bash
        run: |
          set -o pipefail
          node --test tests/physical-echo-contract.test.mjs tests/retailer-intelligence-surfaces.test.mjs 2>&1 | tee /tmp/physical-echo-focused-tests.log

      - name: Upload focused test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-focused-tests
          path: /tmp/physical-echo-focused-tests.log
          if-no-files-found: warn

      - name: Fail closed if focused tests failed
        if: steps.focused.outcome != 'success'
        run: exit 1

      - id: cloud
        name: Run full Signal Engine suite
        continue-on-error: true
        working-directory: signal-engine
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/physical-echo-full-cloud-tests.log

      - name: Upload full Cloud test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-full-cloud-tests
          path: /tmp/physical-echo-full-cloud-tests.log
          if-no-files-found: warn

      - name: Fail closed if full Cloud tests failed
        if: steps.cloud.outcome != 'success'
        run: exit 1

      - name: Install collector dependencies
        working-directory: collectors/pokemon-center-browser
        run: npm ci

      - id: collector
        name: Run collector suite
        continue-on-error: true
        working-directory: collectors/pokemon-center-browser
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/physical-echo-collector-tests.log

      - name: Upload collector test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-echo-collector-tests
          path: /tmp/physical-echo-collector-tests.log
          if-no-files-found: warn

      - name: Fail closed if collector tests failed
        if: steps.collector.outcome != 'success'
        run: exit 1

      - name: Commit proven source changes only after all gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add signal-engine collectors/pokemon-center-browser/src/index.mjs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock physical stock to Echo intelligence"
          git push origin HEAD:feat/retailer-intelligence-surfaces-2026-09-01
