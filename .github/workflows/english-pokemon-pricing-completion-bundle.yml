name: English Pokemon Pricing Completion Bundle
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional earlier run ID to resume unchanged completed stages'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: english-pokemon-pricing-completion-bundle
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Restore completed stages if requested
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name english-pricing-bundle --dir "$RUNNER_TEMP/english-pricing-bundle"
      - name: Prepare all remaining English pricing evidence
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          BUNDLE_OUTPUT: ${{ runner.temp }}/english-pricing-bundle
          MAPPING_WRITE: 'false'
          PRICE_WRITE: 'false'
          CORRECTION_WRITE: 'false'
        run: node src/trader/value/english-pricing-bundle-cli.mjs
      - name: Retain bundle and resumable checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-pricing-bundle
          path: ${{ runner.temp }}/english-pricing-bundle
          if-no-files-found: error
          retention-days: 30
