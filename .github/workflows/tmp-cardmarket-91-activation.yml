name: TEMP Cardmarket 91 Activation

on:
  push:
    branches:
      - ops/cardmarket-91-activation-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify activation base
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b19313ad9bf725a3d6b9fae7b568cd8a6868af6b"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run production-connected dry cycle
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: dry-run
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs
      - name: Upload dry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-91-dry-audit
          path: ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: error
          retention-days: 14
