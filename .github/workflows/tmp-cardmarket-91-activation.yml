name: TEMP Cardmarket 91 Activation Diagnostic

on:
  push:
    branches:
      - ops/cardmarket-91-activation-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify diagnostic branch contains no application changes
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b19313ad9bf725a3d6b9fae7b568cd8a6868af6b HEAD
          test -z "$(git diff --name-only b19313ad9bf725a3d6b9fae7b568cd8a6868af6b..HEAD | grep -v '^.github/workflows/tmp-cardmarket-91-activation.yml$' || true)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Confirm holo-only frozen digest and competing owners
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          import {
            REVIEWED_EXPLICIT_HOLO_BASE_LANE_PRODUCT_IDS,
            REVIEWED_EXPLICIT_HOLO_BASE_LANE_MAPPING_DIGEST,
          } from './src/trader/value/cardmarket-reviewed-explicit-holo-base-lane.mjs';

          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2 });
          const line = (row) => [row.id,row.card_identity_id,String(row.source_record_id),row.source_variant_key,row.canonical_variant_code,row.language_code,row.verification_status].join('|');
          try {
            const { rows } = await pool.query(`SELECT m.id,m.card_identity_id,m.source_name,
                m.source_record_id,m.source_variant_key,c.variant_code AS canonical_variant_code,c.language_code,c.verification_status,
                p.name,p.collector_number,s.name AS set_name
              FROM fatedrop_card_source_mappings m
              JOIN fatedrop_card_identities c ON c.id=m.card_identity_id
              JOIN fatedrop_card_printings p ON p.id=c.printing_id
              JOIN fatedrop_card_sets s ON s.id=c.set_id
              WHERE m.source_name='cardmarket'
                AND m.source_record_id=ANY($1::text[])
                AND c.verification_status='verified'
              ORDER BY m.source_record_id,m.source_variant_key,m.id`, [REVIEWED_EXPLICIT_HOLO_BASE_LANE_PRODUCT_IDS]);
            const holoRows = rows.filter((row) => row.source_variant_key === 'holo');
            const canonical = [...holoRows]
              .sort((a,b) => String(a.source_record_id).localeCompare(String(b.source_record_id)))
              .map(line).join('\n');
            const holoOnlyDigest = createHash('sha256').update(canonical).digest('hex');
            const conflictIds = new Set(rows.filter((row) => row.source_variant_key === 'normal').map((row) => String(row.source_record_id)));
            const conflicts = rows.filter((row) => conflictIds.has(String(row.source_record_id))).map((row) => ({
              mappingId: row.id,
              cardIdentityId: row.card_identity_id,
              sourceRecordId: String(row.source_record_id),
              sourceVariantKey: row.source_variant_key,
              canonicalVariantCode: row.canonical_variant_code,
              setName: row.set_name,
              name: row.name,
              collectorNumber: row.collector_number,
            }));
            const report = {
              policyCount: REVIEWED_EXPLICIT_HOLO_BASE_LANE_PRODUCT_IDS.length,
              allRows: rows.length,
              holoRows: holoRows.length,
              uniqueHoloProducts: new Set(holoRows.map((row) => String(row.source_record_id))).size,
              expectedDigest: REVIEWED_EXPLICIT_HOLO_BASE_LANE_MAPPING_DIGEST,
              holoOnlyDigest,
              holoDigestMatches: holoOnlyDigest === REVIEWED_EXPLICIT_HOLO_BASE_LANE_MAPPING_DIGEST,
              competingNormalProductIds: [...conflictIds],
              conflicts,
            };
            await writeFile(`${process.env.RUNNER_TEMP}/cardmarket-91-holo-digest-diagnostic.json`, JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report));
          } finally {
            await pool.end();
          }
          NODE
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-91-holo-digest-diagnostic
          path: ${{ runner.temp }}/cardmarket-91-holo-digest-diagnostic.json
          if-no-files-found: error
          retention-days: 14
