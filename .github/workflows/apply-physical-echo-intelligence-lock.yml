name: Apply physical Echo intelligence lock

on:
  push:
    branches: [feat/retailer-intelligence-surfaces-2026-09-01]
    paths:
      - ".github/workflows/apply-physical-echo-intelligence-lock.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retailer-intelligence-surfaces-2026-09-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical physical Echo contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          contract = r'''const INPUT_LOCAL_KINDS = new Set(["whisper", "echo", "manifested", "vanished"]);
          const PHYSICAL_EVIDENCE_STATES = new Set(["expected", "reported", "verified", "expired"]);
          const OFFICIAL_EVIDENCE_LEVELS = new Set(["official_branch", "official_collection", "official_retailer_app"]);
          const VERIFIED_AVAILABILITY = new Set(["in_stock", "low_stock", "available", "collection_available", "on_shelf"]);
          const REPORTED_SOURCES = new Set(["retailer_staff_report", "official_store_social", "retailer_submission", "community_report", "verified_shelf_sighting"]);

          function text(value) {
            const result = String(value ?? "").trim();
            return result || null;
          }

          function validateVerified({ locationId, productIdentityId, evidenceLevel, stockStatus, evidence }) {
            if (!locationId) throw new Error("Physical verified Echo requires an exact retailer location");
            if (!productIdentityId) throw new Error("Physical verified Echo requires canonical product identity");
            if (!OFFICIAL_EVIDENCE_LEVELS.has(evidenceLevel)) throw new Error("Physical verified Echo requires official branch/collection/app evidence");
            if (evidence.availabilityVerified !== true && !VERIFIED_AVAILABILITY.has(stockStatus)) {
              throw new Error("Physical verified Echo requires fresh verified branch availability evidence");
            }
          }

          export function resolvePhysicalEchoEvidenceState({
            requestedKind,
            evidence = {},
            evidenceLevel = "unknown",
            sourceType = null,
            stockStatus = null,
            locationId = null,
            productIdentityId = null,
          } = {}) {
            const kind = text(requestedKind)?.toLowerCase();
            if (!INPUT_LOCAL_KINDS.has(kind)) throw new Error("Local stock observation requires a recognised legacy/local signal kind");
            const explicit = text(evidence.physicalEvidenceState ?? evidence.physical_evidence_state)?.toLowerCase();
            if (explicit && !PHYSICAL_EVIDENCE_STATES.has(explicit)) throw new Error("Invalid physical evidence state");

            const state = explicit
              || (kind === "manifested" ? "verified" : null)
              || (kind === "vanished" ? "expired" : null)
              || ((evidence.availabilityVerified === true || VERIFIED_AVAILABILITY.has(stockStatus)) ? "verified" : null)
              || (REPORTED_SOURCES.has(sourceType) ? "reported" : null)
              || "expected";

            if (state === "verified") validateVerified({ locationId, productIdentityId, evidenceLevel, stockStatus, evidence });
            if (state === "expired" && (!locationId || !productIdentityId)) {
              throw new Error("Physical expired Echo requires an exact branch and canonical product identity");
            }
            return state;
          }

          export const PHYSICAL_ECHO_CONTRACT = Object.freeze({
            alertChannel: "echo",
            availabilityScopes: ["physical_branch", "physical_retailer_chain"],
            evidenceStates: [...PHYSICAL_EVIDENCE_STATES],
            legacyInputs: [...INPUT_LOCAL_KINDS],
            rule: "All physical/in-store intelligence is canonical Echo. Physical evidence never creates Manifested or ordinary Vanished.",
          });
          '''
          Path("signal-engine/src/encounters/physical-echo-contract.mjs").write_text(contract)

          path = "signal-engine/src/encounters/local-stock-store.mjs"
          replace_once(path,
          'import { normalizeLocationPolicy } from "./local-radar-location-policy.mjs";\n\nconst LIFECYCLE = new Set(["whisper", "echo", "manifested", "vanished"]);\nconst OFFICIAL_EVIDENCE_LEVELS = new Set(["official_branch", "official_collection", "official_retailer_app"]);\nconst VERIFIED_AVAILABILITY = new Set(["in_stock", "low_stock", "available", "collection_available", "on_shelf"]);',
          'import { normalizeLocationPolicy } from "./local-radar-location-policy.mjs";\nimport { resolvePhysicalEchoEvidenceState } from "./physical-echo-contract.mjs";\n\nconst INPUT_LIFECYCLE = new Set(["whisper", "echo", "manifested", "vanished"]);')
          replace_once(path,
          '  if (!LIFECYCLE.has(requestedKind)) throw new Error("Local stock observation requires canonical whisper/echo/manifested/vanished kind");',
          '  if (!INPUT_LIFECYCLE.has(requestedKind)) throw new Error("Local stock observation requires a recognised legacy/local signal kind");')
          old = '''  if (requestedKind === "manifested") {
            if (!locationId) throw new Error("Local Manifested requires an exact retailer location");
            if (!productIdentityId) throw new Error("Local Manifested requires canonical product identity");
            if (!OFFICIAL_EVIDENCE_LEVELS.has(evidenceLevel)) throw new Error("Local Manifested requires official branch/collection/app evidence");
            if (evidence.availabilityVerified !== true && !VERIFIED_AVAILABILITY.has(stockStatus)) {
              throw new Error("Local Manifested requires verified physical or collection availability evidence");
            }
          }
          if (requestedKind === "vanished") {
            if (!locationId) throw new Error("Local Vanished requires an exact retailer location");
            if (!productIdentityId) throw new Error("Local Vanished requires canonical product identity");
            if (!OFFICIAL_EVIDENCE_LEVELS.has(evidenceLevel)) throw new Error("Local Vanished requires official branch/collection/app evidence");
          }

          const bucket = Math.floor(occurredAt / 60);'''
          new = '''  const physicalEvidenceState = resolvePhysicalEchoEvidenceState({
            requestedKind,
            evidence,
            evidenceLevel,
            sourceType,
            stockStatus,
            locationId,
            productIdentityId,
          });

          const bucket = Math.floor(occurredAt / 60);'''
          replace_once(path, old, new)
          replace_once(path,
          '    id: text(record.id) || hash("lse", `${requestedKind}|${retailerId}|${locationId || "retailer-chain"}|${productKey}|${sourceType}|${sourceId}|${bucket}`),\n    kind: requestedKind,',
          '    id: text(record.id) || hash("lse", `echo|${physicalEvidenceState}|${retailerId}|${locationId || "retailer-chain"}|${productKey}|${sourceType}|${sourceId}|${bucket}`),\n    kind: "echo",')
          replace_once(path,
          '      evidenceLevel,\n      sourceType,',
          '      evidenceLevel,\n      sourceType,\n      alertChannel: "echo",\n      availabilityScope: locationId ? "physical_branch" : "physical_retailer_chain",\n      physicalEvidenceState,')
          start = Path(path).read_text().find('async function hasPriorManifested(')
          end = Path(path).read_text().find('export async function upsertLocalStockObservationsIntoStore', start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate legacy local Manifested persistence helper")
          t = Path(path).read_text()
          Path(path).write_text(t[:start] + t[end:])
          old = '''  if (typeof store?.upsertLocalStockObservations === "function") {
            const accepted = [];
            const rejected = [];
            for (const observation of observations) {
              if (observation.kind === "vanished" && !(await hasPriorManifested(store, observation))) {
                rejected.push({ id: observation.id, reason: "Local Vanished requires prior Manifested history for the same branch and product" });
              } else {
                accepted.push(observation);
              }
            }
            const result = accepted.length ? await store.upsertLocalStockObservations(accepted) : { saved: 0 };
            return { ...result, rejected };
          }'''
          new = '''  if (typeof store?.upsertLocalStockObservations === "function") {
            const result = observations.length ? await store.upsertLocalStockObservations(observations) : { saved: 0 };
            return { ...result, rejected: [] };
          }'''
          replace_once(path, old, new)
          replace_once(path,
          '        const validChainIntel = ["whisper", "echo"].includes(observation.kind)',
          '        const validChainIntel = observation.kind === "echo"')
          replace_once(path,
          '        if (!validChainIntel) { rejected.push({ id: observation.id, reason: "Branchless local intelligence must be explicitly advisory retailer-chain Whisper/Echo evidence" }); continue; }',
          '        if (!validChainIntel) { rejected.push({ id: observation.id, reason: "Branchless local intelligence must be explicitly advisory retailer-chain Echo evidence" }); continue; }')
          old = '''      if (observation.kind === "vanished" && !(await hasPriorManifested(store, observation, client))) {
                rejected.push({ id: observation.id, reason: "Local Vanished requires prior Manifested history for the same branch and product" });
                continue;
              }
          '''
          replace_once(path, old, '')

          path = "signal-engine/src/encounters/local-stock-intelligence.mjs"
          replace_once(path,
          'const LOCAL_SIGNAL_KINDS = new Set([\n  "whisper",\n  "echo",\n  "manifested",\n  "vanished",\n]);',
          'const STORED_LOCAL_SIGNAL_KINDS = new Set(["whisper", "echo", "manifested", "vanished"]);\nconst PHYSICAL_EVIDENCE_STATES = new Set(["expected", "reported", "verified", "expired"]);')
          anchor = '''function hasVerifiedAvailabilityEvidence(observation) {
            return observation.evidence?.availabilityVerified === true
              || VERIFIED_AVAILABILITY_STATES.has(observation.stockStatus);
          }

          function statusFromObservation(observation) {
            if (["whisper", "echo"].includes(observation.kind)) return "incoming_watch";
            const official = OFFICIAL_EVIDENCE_LEVELS.has(observation.evidenceLevel);
            const canonicalIdentityKnown = Boolean(observation.productIdentityId);
            if (observation.kind === "manifested") {
              if (!official || !canonicalIdentityKnown || !hasVerifiedAvailabilityEvidence(observation)) return "incoming_watch";
              return observation.stockStatus === "low_stock" ? "low_stock" : "in_stock";
            }
            if (observation.kind === "vanished") {
              return official && canonicalIdentityKnown ? "out_of_stock" : "unknown";
            }
            return "unknown";
          }

          function statusRank(status) {
            return ({ in_stock: 5, low_stock: 4, incoming_watch: 3, out_of_stock: 2, unknown: 1 })[status] || 0;
          }

          function availabilityClass(status) {
            if (["in_stock", "low_stock"].includes(status)) return "available";
            if (status === "out_of_stock") return "unavailable";
            if (status === "incoming_watch") return "preparation";
            return "unknown";
          }'''
          replacement = '''function hasVerifiedAvailabilityEvidence(observation) {
            return observation.evidence?.availabilityVerified === true
              || VERIFIED_AVAILABILITY_STATES.has(observation.stockStatus);
          }

          function physicalEvidenceState(observation) {
            const explicit = text(observation.evidence?.physicalEvidenceState ?? observation.evidence?.physical_evidence_state)?.toLowerCase();
            if (explicit && PHYSICAL_EVIDENCE_STATES.has(explicit)) return explicit;
            if (observation.sourceLifecycleState === "manifested") return "verified";
            if (observation.sourceLifecycleState === "vanished") return "expired";
            if (["retailer_staff_report", "official_store_social", "retailer_submission", "community_report", "verified_shelf_sighting"].includes(observation.sourceType)) return "reported";
            return "expected";
          }

          function statusFromObservation(observation) {
            if (observation.physicalEvidenceState === "verified") {
              const official = OFFICIAL_EVIDENCE_LEVELS.has(observation.evidenceLevel);
              const canonicalIdentityKnown = Boolean(observation.productIdentityId);
              if (!official || !canonicalIdentityKnown || !hasVerifiedAvailabilityEvidence(observation)) return "unknown";
              return observation.stockStatus === "low_stock" ? "low_stock" : "in_stock";
            }
            if (observation.physicalEvidenceState === "reported") return "reported_watch";
            if (observation.physicalEvidenceState === "expected") return "incoming_watch";
            if (observation.physicalEvidenceState === "expired") return "no_longer_confirmed";
            return "unknown";
          }

          function statusRank(status) {
            return ({ in_stock: 6, low_stock: 5, reported_watch: 4, incoming_watch: 3, no_longer_confirmed: 2, unknown: 1 })[status] || 0;
          }

          function availabilityClass(status) {
            if (["in_stock", "low_stock"].includes(status)) return "available";
            if (status === "reported_watch") return "reported";
            if (status === "incoming_watch") return "preparation";
            if (status === "no_longer_confirmed") return "expired";
            return "unknown";
          }'''
          replace_once(path, anchor, replacement)
          replace_once(path,
          '    kind: text(row.kind)?.toLowerCase() || "unknown",',
          '    sourceLifecycleState: text(row.kind)?.toLowerCase() || "unknown",\n    kind: "echo",')
          replace_once(path,
          '  const expiresAt = asEpochMs(evidence.expiresAt ?? evidence.expires_at)\n    || asEpochMs(row.expiresAt ?? row.expires_at)\n    || occurredAt + ttlForEvidence({ kind: observation.kind, level, source });\n  return {\n    ...observation,\n    expiresAt,\n    localStockStatus: statusFromObservation(observation),\n  };',
          '  const expiresAt = asEpochMs(evidence.expiresAt ?? evidence.expires_at)\n    || asEpochMs(row.expiresAt ?? row.expires_at)\n    || occurredAt + ttlForEvidence({ kind: observation.sourceLifecycleState, level, source });\n  const normalized = { ...observation, physicalEvidenceState: physicalEvidenceState(observation), expiresAt };\n  return { ...normalized, localStockStatus: statusFromObservation(normalized) };')
          replace_once(path,
          '    return (rows || []).map(normalizeObservation).filter((item) => LOCAL_SIGNAL_KINDS.has(item.kind));',
          '    return (rows || []).map(normalizeObservation).filter((item) => STORED_LOCAL_SIGNAL_KINDS.has(item.sourceLifecycleState));')
          replace_once(path,
          '  `, [[...LOCAL_SIGNAL_KINDS], sinceSeconds, safeLimit]);',
          '  `, [[...STORED_LOCAL_SIGNAL_KINDS], sinceSeconds, safeLimit]);')
          old = '''    const latest = rows[0];
            const hadEarlierManifested = rows.some((item) => item.kind === "manifested" && item.occurredAt < latest.occurredAt && ["in_stock", "low_stock"].includes(item.localStockStatus));
            const orphanVanished = latest.kind === "vanished" && !hadEarlierManifested;
            const latestClass = availabilityClass(orphanVanished ? "unknown" : latest.localStockStatus);'''
          new = '''    const latest = rows[0];
            const orphanVanished = false;
            const latestClass = availabilityClass(latest.localStockStatus);'''
          replace_once(path, old, new)
          replace_once(path,
          '      localStockStatus: orphanVanished || conflictForcesUnknown ? "unknown" : latest.localStockStatus,',
          '      localStockStatus: conflictForcesUnknown ? "unknown" : latest.localStockStatus,')
          replace_once(path,
          'function isVerifiedBranchStock(item) {\n  return item.kind === "manifested"\n    && OFFICIAL_EVIDENCE_LEVELS.has(item.evidenceLevel)',
          'function isVerifiedBranchStock(item) {\n  return item.physicalEvidenceState === "verified"\n    && OFFICIAL_EVIDENCE_LEVELS.has(item.evidenceLevel)')
          replace_once(path,
          '  if (item.localStockStatus === "incoming_watch" && (expected.expectedFrom || expected.expectedTo || expected.expectedLabel)) return "expected";',
          '  if (["expected", "reported"].includes(item.physicalEvidenceState)) return "expected";')
          replace_once(path,
          '    .filter((item) => LOCAL_SIGNAL_KINDS.has(item.kind))',
          '    .filter((item) => STORED_LOCAL_SIGNAL_KINDS.has(item.sourceLifecycleState))')
          replace_once(path,
          '        lifecycleState: item.kind,\n        status: item.localStockStatus,',
          '        lifecycleState: "echo",\n        sourceLifecycleState: item.sourceLifecycleState,\n        alertChannel: "echo",\n        availabilityScope: item.locationId ? "physical_branch" : "physical_retailer_chain",\n        physicalEvidenceState: item.physicalEvidenceState,\n        status: item.localStockStatus,')
          replace_once(path,
          '        lifecycleState: strongest.kind,\n        evidenceLevel: strongest.evidenceLevel,',
          '        lifecycleState: "echo",\n        sourceLifecycleState: strongest.sourceLifecycleState,\n        alertChannel: "echo",\n        availabilityScope: strongest.locationId ? "physical_branch" : "physical_retailer_chain",\n        physicalEvidenceState: strongest.physicalEvidenceState,\n        evidenceLevel: strongest.evidenceLevel,')
          replace_once(path,
          '    else if (shop.localStockStatus === "incoming_watch") counts.incomingWatch += 1;',
          '    else if (["incoming_watch", "reported_watch"].includes(shop.localStockStatus)) counts.incomingWatch += 1;')
          policy_start = Path(path).read_text().find('export const LOCAL_STOCK_POLICY = Object.freeze({')
          if policy_start < 0:
              raise SystemExit("local stock policy anchor missing")
          t = Path(path).read_text()
          policy = '''export const LOCAL_STOCK_POLICY = Object.freeze({
            lifecycleStates: ["echo"],
            legacyStoredLifecycleStates: [...STORED_LOCAL_SIGNAL_KINDS],
            physicalEvidenceStates: [...PHYSICAL_EVIDENCE_STATES],
            officialEvidenceLevels: [...OFFICIAL_EVIDENCE_LEVELS],
            consumerStates: ["expected", "confirmed", "unknown"],
            expectedStockDisclaimer: EXPECTED_STOCK_DISCLAIMER,
            communityRule: "Community, staff, manual or social evidence is Echo · Reported and cannot become verified without fresh exact-branch retailer/API evidence.",
            chainIntelRule: "Retailer-chain allocation intelligence is Echo · Expected and remains advisory until exact-branch evidence exists.",
            identityRule: "Physical verified stock remains Echo · In-store confirmed; it requires canonical product identity and an exact branch match and never becomes Manifested.",
            rrpRule: "Local Radar uses the shared canonical RRP and price-intelligence engine; retailer selling price is never learned as RRP.",
            expiryRule: "Stale or explicitly unavailable physical evidence becomes Echo · No longer confirmed; it never creates ordinary Vanished.",
            contradictionRule: "Recent contradictory physical evidence reduces confidence and can force the current state to unknown.",
            shelfSightingTtlMinutes: EVIDENCE_TTL_MS.verified_shelf_sighting / 60_000,
            echoTtlHours: DEFAULT_TTL_MS.echo / 3_600_000,
          });
          '''
          Path(path).write_text(t[:policy_start] + policy)

          ranking = r'''function text(value) {
            return String(value ?? "").trim();
          }

          function finiteDistance(shop) {
            const value = Number(shop?.distanceMiles);
            return Number.isFinite(value) ? value : Number.POSITIVE_INFINITY;
          }

          function physicalEvidenceState(shop) {
            const candidates = [
              shop?.localStockEvidence?.physicalEvidenceState,
              shop?.localAvailability?.evidenceState,
              ...(Array.isArray(shop?.localStockProducts) ? shop.localStockProducts.map((item) => item?.physicalEvidenceState) : []),
            ];
            for (const candidate of candidates) {
              const value = String(candidate || "").toLowerCase();
              if (["verified", "reported", "expected", "expired"].includes(value)) return value;
            }
            if (shop?.localAvailability?.status === "confirmed") return "verified";
            if (shop?.localAvailability?.status === "expected") return "expected";
            return "unknown";
          }

          function priority(shop) {
            return ({ verified: 0, reported: 1, expected: 2, expired: 3, unknown: 4 })[physicalEvidenceState(shop)] ?? 4;
          }

          export function prioritizeLocalRadarShops(shops = []) {
            return [...(Array.isArray(shops) ? shops : [])].sort((a, b) => {
              const priorityDifference = priority(a) - priority(b);
              if (priorityDifference) return priorityDifference;
              const distanceDifference = finiteDistance(a) - finiteDistance(b);
              if (Number.isFinite(distanceDifference) && distanceDifference) return distanceDifference;
              const nameDifference = text(a?.name).localeCompare(text(b?.name), "en-GB", { sensitivity: "base" });
              if (nameDifference) return nameDifference;
              return text(a?.id).localeCompare(text(b?.id), "en-GB", { sensitivity: "base" });
            });
          }
          '''
          Path("signal-engine/src/encounters/local-radar-ranking.mjs").write_text(ranking)

          path = "signal-engine/src/encounters/local-radar.mjs"
          replace_once(path,
          'import { refreshSmythsLocalAvailability } from "./smyths-local-availability.mjs";',
          'import { refreshSmythsLocalAvailability } from "./smyths-local-availability.mjs";\nimport { prioritizeLocalRadarShops } from "./local-radar-ranking.mjs";')
          replace_once(path,
          '  const shops = enrichShopsWithLocalStock(radarShops, localStockObservations)\n    .filter((shop) => shop.distanceMiles == null || shop.distanceMiles <= safeRadius);',
          '  const shops = prioritizeLocalRadarShops(\n    enrichShopsWithLocalStock(radarShops, localStockObservations)\n      .filter((shop) => shop.distanceMiles == null || shop.distanceMiles <= safeRadius),\n  );')
          replace_once(path,
          '      "Verified local stock is only shown when branch-level official evidence is present and still fresh.",',
          '      "Physical stock intelligence always uses Echo: verified exact-branch evidence is Echo · In-store confirmed; allocation is Echo · Expected.",')
          replace_once(path,
          '      "Curated manual or community intelligence is advisory only: it may create a retailer-wide Incoming Watch, but never verified branch stock without exact official branch evidence.",',
          '      "Credible staff/community physical evidence is Echo · Reported; it cannot become In-store confirmed without exact retailer/API branch evidence.",')

          path = "signal-engine/src/encounters/curated-incoming-intel-reconcile.mjs"
          replace_once(path,
          '      availabilityVerified: false,',
          '      availabilityVerified: false,\n      alertChannel: "echo",\n      availabilityScope: "physical_branch",\n      physicalEvidenceState: "expected",')
          replace_once(path,
          '    truthRule: "Read-only exact-branch reconciliation only. No Local Radar observation, stock state or history is written.",',
          '    truthRule: "Read-only exact-branch reconciliation only. Physical intelligence is Echo-scoped and no stock state or history is written.",')
          replace_once(path,
          '    truthRule: "Curated incoming intelligence is advisory Whisper/Echo preparation evidence only and can never create Local Manifested without separate exact-branch verified availability evidence.",',
          '    truthRule: "Curated incoming intelligence is Echo · Expected only. Exact-branch verified physical availability remains Echo · In-store confirmed and can never create Manifested or ordinary Vanished.",')

          path = "signal-engine/src/encounters/retailer-intelligence-surfaces.mjs"
          replace_once(path,
          '    maxNotificationsPerChange: 5,',
          '    maxNotificationsPerChange: 5,\n    notificationMode: "observation_only_until_radius_targeted",')
          replace_once(path,
          'function stableProduct(product) {\n  return {\n    title: product.title,\n    releaseLabel: product.releaseLabel || null,\n    purchaseLimit: product.purchaseLimit || null,\n    allocationLimited: product.allocationLimited === true,\n    branches: [...product.branches],\n  };\n}',
          'function stableProduct(product) {\n  return {\n    title: product.title,\n    releaseLabel: product.releaseLabel || null,\n    allocationGroup: product.allocationGroup || null,\n    purchaseLimit: product.purchaseLimit || null,\n    allocationLimited: product.allocationLimited === true,\n    branchTargets: (product.branchTargets || []).map((branch) => ({ name: branch.name, storeUrl: branch.storeUrl || null })),\n    assetReferenceHints: [...(product.assetReferenceHints || [])],\n  };\n}')
          old = '''    const branches = uniqueSorted(raw?.branches, policy.maxBranchesPerProduct, 180);
            if (!branches.length) continue;
            seen.add(productKey);
            products.push({
              productKey,
              title,
              releaseLabel: cleanText(raw?.releaseLabel, 160),
              purchaseLimit: cleanText(raw?.purchaseLimit, 120),
              allocationLimited: raw?.allocationLimited === true,
              branches,
            });'''
          new = '''    const rawTargets = Array.isArray(raw?.branchTargets) ? raw.branchTargets : [];
            const targetsByName = new Map();
            for (const target of rawTargets) {
              const name = cleanText(target?.name, 180);
              if (!name) continue;
              const storeUrl = canonicalUrl(target?.storeUrl);
              targetsByName.set(normalizeKey(name), { name, storeUrl });
            }
            for (const name of uniqueSorted(raw?.branches, policy.maxBranchesPerProduct, 180)) {
              const key = normalizeKey(name);
              if (!targetsByName.has(key)) targetsByName.set(key, { name, storeUrl: null });
            }
            const branchTargets = [...targetsByName.values()].sort((a, b) => a.name.localeCompare(b.name)).slice(0, policy.maxBranchesPerProduct);
            const branches = branchTargets.map((target) => target.name);
            if (!branches.length) continue;
            seen.add(productKey);
            products.push({
              productKey,
              title,
              releaseLabel: cleanText(raw?.releaseLabel, 160),
              allocationGroup: cleanText(raw?.allocationGroup, 140),
              purchaseLimit: cleanText(raw?.purchaseLimit, 120),
              allocationLimited: raw?.allocationLimited === true,
              branches,
              branchTargets,
              assetReferenceHints: uniqueSorted(raw?.assetReferenceHints, 10, 80),
            });'''
          replace_once(path, old, new)
          replace_once(path,
          '    pageTitle: cleanText(input.pageTitle, 240),\n    fingerprint,\n    products,',
          '    pageTitle: cleanText(input.pageTitle, 240),\n    campaignTitle: cleanText(input.campaignTitle, 240),\n    availabilityDisclaimerPresent: input.availabilityDisclaimerPresent === true,\n    storeSearchSemantics: cleanText(input.storeSearchSemantics, 120),\n    warnings: uniqueSorted(input.warnings, 30, 160),\n    publicHttp: input.publicHttp && typeof input.publicHttp === "object" ? {\n      status: Number(input.publicHttp.status) || null,\n      etag: cleanText(input.publicHttp.etag, 300),\n      lastModified: cleanText(input.publicHttp.lastModified, 300),\n      bodySha256: cleanText(input.publicHttp.bodySha256, 80),\n      body: typeof input.publicHttp.body === "string" ? input.publicHttp.body.slice(0, 750000) : null,\n    } : null,\n    fingerprint,\n    products,')
          replace_once(path,
          '        CREATE TABLE IF NOT EXISTS fatedrop_retailer_intelligence_surfaces (',
          '        CREATE TABLE IF NOT EXISTS fatedrop_retailer_intelligence_surfaces (')
          replace_once(path,
          '        )\n      `);\n      return true;',
