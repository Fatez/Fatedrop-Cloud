name: SWSH Promos Phase 3 Descriptor Audit
on:
  push:
    branches: [audit/swsh-promos-set-recovery-2026-09-14]
    paths:
      - 'signal-engine/src/trader/value/swsh-promos-phase3-descriptor-audit-cli.mjs'
      - '.github/workflows/swsh-promos-phase3-descriptor-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run descriptor disambiguation audit
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/swsh-promos-phase3-descriptor-audit-cli.mjs
      - name: Upload descriptor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swsh-promos-phase3-descriptor-audit
          path: ${{ runner.temp }}/swsh-promos-phase3-descriptor-audit.json
          if-no-files-found: error
          retention-days: 14
