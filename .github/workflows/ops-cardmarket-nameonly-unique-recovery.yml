name: OPS Cardmarket Unique Name Recovery

on:
  push:
    branches:
      - feat/cardmarket-nameonly-unique-recovery-2026-09-11
    paths:
      - '.github/workflows/ops-cardmarket-nameonly-unique-recovery.yml'
      - 'signal-engine/src/trader/value/cardmarket-nameonly-unique-recovery-cli.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit unique scoped name-only mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-nameonly-unique-recovery-cli.mjs
      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-nameonly-unique-recovery
          path: ${{ runner.temp }}/cardmarket-nameonly-unique-recovery.json
          if-no-files-found: error
          retention-days: 14
