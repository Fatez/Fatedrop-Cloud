name: Cardmarket Baseline Root Finish Audit

on:
  push:
    branches:
      - audit/cardmarket-baseline-root-finish-2026-09-14
    paths:
      - 'signal-engine/src/trader/value/cardmarket-baseline-root-finish-audit-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-baseline-root-unpriced-mapping-audit-cli.mjs'
      - '.github/workflows/cardmarket-baseline-root-finish-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run exact baseline root finish audit read-only
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-baseline-root-finish-audit-cli.mjs
      - name: Audit exact mappings whose numeric central lane is unavailable
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-baseline-root-unpriced-mapping-audit-cli.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-baseline-root-finish-audit
          path: |
            ${{ runner.temp }}/cardmarket-baseline-root-finish-audit.json
            ${{ runner.temp }}/cardmarket-baseline-root-unpriced-mapping-audit.json
          if-no-files-found: error
          retention-days: 14
