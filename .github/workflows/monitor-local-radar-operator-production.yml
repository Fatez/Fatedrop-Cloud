name: Monitor FateDrop Local Radar Operator Production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-local-radar-operator-production.yml"
      - "signal-engine/src/encounters/operator-local-radar-intake.mjs"
      - "signal-engine/src/encounters/operator-local-radar-bridge-health.mjs"
      - "signal-engine/src/telemetry/public-signal-contract.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live operator intake and Web bridge readiness
        shell: bash
        run: |
          set -euo pipefail
          url="https://fatedrop-cloud-production.up.railway.app/api/signal-summary"

          for attempt in $(seq 1 18); do
            http_status="$(curl --silent --show-error --max-time 10 \
              --output /tmp/signal-summary.json \
              --write-out '%{http_code}' \
              -H 'Accept: application/json' \
              "$url" || true)"

            if [ "$http_status" = "200" ] && node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/signal-summary.json', 'utf8'));
          const health = payload?.localRadarOperator || {};
          const ageSeconds = Number(health.ageSeconds);
          const healthy = payload?.available === true
            && health.available === true
            && health.started === true
            && health.status === 'ok'
            && health.canonicalStoreConfigured === true
            && health.webBridgeConfigured === true
            && Number.isFinite(ageSeconds)
            && ageSeconds >= 0
            && ageSeconds <= 360;
          process.exit(healthy ? 0 : 1);
          NODE
            then
              node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/signal-summary.json', 'utf8'));
          const health = payload.localRadarOperator;
          console.log(JSON.stringify({
            available: health.available,
            started: health.started,
            status: health.status,
            ageSeconds: health.ageSeconds,
            intervalSeconds: health.intervalSeconds,
            canonicalStoreConfigured: health.canonicalStoreConfigured,
            webBridgeConfigured: health.webBridgeConfigured,
            issuesSeen: health.issuesSeen,
            published: health.published,
            held: health.held,
            retry: health.retry,
            invalid: health.invalid,
            lastErrorCode: health.lastErrorCode,
          }));
          NODE
              exit 0
            fi

            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done

          echo "Local Radar operator production readiness did not become healthy within the bounded verification window."
          if [ -s /tmp/signal-summary.json ]; then
            node <<'NODE'
          const fs = require('fs');
          try {
            const payload = JSON.parse(fs.readFileSync('/tmp/signal-summary.json', 'utf8'));
            const health = payload?.localRadarOperator || null;
            console.error(JSON.stringify({
              available: health?.available ?? null,
              started: health?.started ?? null,
              status: health?.status ?? 'missing',
              ageSeconds: health?.ageSeconds ?? null,
              canonicalStoreConfigured: health?.canonicalStoreConfigured ?? null,
              webBridgeConfigured: health?.webBridgeConfigured ?? null,
              lastErrorCode: health?.lastErrorCode ?? null,
            }));
          } catch {
            console.error('Signal summary response was not valid JSON.');
          }
          NODE
          fi
          exit 1
