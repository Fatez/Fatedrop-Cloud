name: OPS Cardmarket Post-Crosswalk Exact Recovery

on:
  push:
    branches:
      - ops/cardmarket-post-crosswalk-exact-recovery-2026-09-11
    paths:
      - '.github/workflows/ops-cardmarket-post-crosswalk-exact-recovery.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit exact recovery after set crosswalk activation
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          MAPPING_WRITE: 'false'
        run: node src/trader/value/cardmarket-live-exact-recovery-cli.mjs
      - name: Upload exact recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-post-crosswalk-exact-recovery
          path: ${{ runner.temp }}/cardmarket-live-exact-recovery.json
          if-no-files-found: error
          retention-days: 14
