name: TEMP International MSRP Production Evidence

on:
  push:
    branches:
      - "diag/rrp-production-evidence-2026-08-30"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect natural international alerts created after authority merge
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const mergedAt = Date.parse('2026-08-30T16:18:21Z');
          const url = 'https://fatedrop-cloud-production.up.railway.app/api/signals?detail=alerts&limit=100';
          const numeric = (value) => value != null && Number.isFinite(Number(value));
          const marketFor = (title) => {
            const text = String(title || '').toLowerCase();
            if (/\b(?:japanese|japan|jpn)\b/.test(text)) return 'JP';
            if (/\b(?:korean|korea)\b/.test(text)) return 'KR';
            if (/\b(?:simplified chinese|chinese simplified)\b/.test(text)) return 'CN';
            if (/\btraditional chinese\b/.test(text) && /\b(?:taiwan|tw)\b/.test(text)) return 'TW';
            if (/\btraditional chinese\b/.test(text) && /\b(?:hong kong|hk)\b/.test(text)) return 'HK';
            return null;
          };
          const countBy = (rows, keyFn) => Object.fromEntries([...rows.reduce((map, row) => {
            const key = String(keyFn(row) || 'unknown');
            map.set(key, (map.get(key) || 0) + 1);
            return map;
          }, new Map()).entries()].sort(([a], [b]) => a.localeCompare(b)));

          const response = await fetch(url, { headers: { 'user-agent': 'FateDrop-international-post-merge-evidence/1.0' } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
          const postMerge = alerts.filter((alert) => {
            const at = Date.parse(String(alert?.detectedAt || ''));
            return Number.isFinite(at) && at >= mergedAt;
          });
          const imports = postMerge.map((alert) => ({
            alert,
            title: String(alert?.product?.title || alert?.title || ''),
          })).map((row) => ({ ...row, market: marketFor(row.title) })).filter((row) => row.market);
          const resolved = imports.filter(({ alert }) => numeric(alert?.priceIntelligence?.rrpPence) && numeric(alert?.priceIntelligence?.rrpDeltaPercent));
          const opened = imports.filter(({ title }) => /\bopened live(?: on stream)?\b/i.test(title));
          console.log(JSON.stringify({
            success: payload?.success === true,
            returnedAlerts: alerts.length,
            postMergeAlerts: postMerge.length,
            postMergeImportAlerts: imports.length,
            postMergeResolvedImports: resolved.length,
            postMergeResolvedByMarket: countBy(resolved, (row) => row.market),
            postMergeUnresolvedByMarket: countBy(imports.filter((row) => !resolved.includes(row)), (row) => row.market),
            postMergeOpenedLiveImports: opened.length,
            postMergeOpenedLiveResolved: opened.filter(({ alert }) => numeric(alert?.priceIntelligence?.rrpPence)).length
          }));
          NODE