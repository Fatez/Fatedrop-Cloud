name: TEMP International MSRP Production Evidence

on:
  push:
    branches:
      - "diag/rrp-production-evidence-2026-08-30"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect unresolved JP KR CN source-market references
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { resolveInternationalMsrp } from './signal-engine/src/rrp/international-msrp-authority.mjs';

          const response = await fetch('https://fatedrop-cloud-production.up.railway.app/api/signals?detail=alerts&limit=100', {
            headers: { 'user-agent': 'FateDrop-international-msrp-evidence/1.0' },
          });
          if (!response.ok) throw new Error(`Cloud HTTP ${response.status}`);
          const payload = await response.json();
          const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
          const imports = alerts.filter((alert) => /\b(?:japanese|japan|jpn|korean|korea|simplified chinese|chinese simplified|traditional chinese|taiwan|hong kong)\b/i.test(String(alert?.product?.title || alert?.title || '')));
          const rows = imports.map((alert) => {
            const title = String(alert?.product?.title || alert?.title || '');
            const result = resolveInternationalMsrp({ title, productType: alert?.product?.productType || null });
            return {
              title,
              productType: alert?.product?.productType || null,
              resolved: result.resolved === true,
              market: result.sourceMarket || null,
              reason: result.reason || null,
              kind: result.kind || null,
              sourceCurrency: result.sourceCurrency || null,
              sourceMsrp: result.sourceMsrp || null,
              unitCount: result.unitCount || null,
            };
          });

          const unique = [...new Map(rows.map((row) => [row.title, row])).values()];
          const unresolved = unique.filter((row) => !row.resolved);
          const resolved = unique.filter((row) => row.resolved);
          const counts = (list, key) => Object.fromEntries([...list.reduce((map, row) => {
            const value = String(row[key] ?? 'unknown');
            map.set(value, (map.get(value) || 0) + 1);
            return map;
          }, new Map()).entries()].sort(([a], [b]) => a.localeCompare(b)));

          console.log(JSON.stringify({
            success: payload?.success === true,
            returnedAlerts: alerts.length,
            importAlerts: imports.length,
            uniqueImportProducts: unique.length,
            resolvedImportProducts: resolved.length,
            unresolvedImportProducts: unresolved.length,
            resolvedByMarket: counts(resolved, 'market'),
            unresolvedByReason: counts(unresolved, 'reason'),
            unresolvedProducts: unresolved.map((row) => ({ title: row.title, productType: row.productType, market: row.market, reason: row.reason })),
          }));
          NODE