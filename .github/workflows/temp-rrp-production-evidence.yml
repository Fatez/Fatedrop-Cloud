name: TEMP International MSRP Production Evidence

on:
  push:
    branches:
      - "diag/rrp-production-evidence-2026-08-30"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Sample live JP KR CN reference coverage
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://fatedrop-cloud-production.up.railway.app/api/signals?detail=alerts&limit=100';
          const numeric = (value) => value != null && Number.isFinite(Number(value));
          const marketFor = (title) => {
            const text = String(title || '').toLowerCase();
            if (/\b(?:japanese|japan|jpn)\b/.test(text)) return 'JP';
            if (/\b(?:korean|korea)\b/.test(text)) return 'KR';
            if (/\b(?:simplified chinese|chinese simplified)\b/.test(text)) return 'CN';
            if (/\btraditional chinese\b/.test(text) && /\b(?:taiwan|tw)\b/.test(text)) return 'TW';
            if (/\btraditional chinese\b/.test(text) && /\b(?:hong kong|hk)\b/.test(text)) return 'HK';
            return null;
          };
          const countBy = (rows, keyFn) => Object.fromEntries([...rows.reduce((map, row) => {
            const key = String(keyFn(row) || 'unknown');
            map.set(key, (map.get(key) || 0) + 1);
            return map;
          }, new Map()).entries()].sort(([a], [b]) => a.localeCompare(b)));

          const response = await fetch(url, { headers: { 'user-agent': 'FateDrop-international-live-verification/1.0' } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          const alerts = Array.isArray(payload.alerts) ? payload.alerts : [];
          const imports = alerts.map((alert) => ({
            alert,
            title: String(alert?.product?.title || alert?.title || ''),
          })).map((row) => ({ ...row, market: marketFor(row.title) })).filter((row) => row.market);
          const unique = [...new Map(imports.map((row) => [row.title, row])).values()];
          const resolved = unique.filter(({ alert }) => numeric(alert?.priceIntelligence?.rrpPence) && numeric(alert?.priceIntelligence?.rrpDeltaPercent));
          const unresolved = unique.filter(({ alert }) => !(numeric(alert?.priceIntelligence?.rrpPence) && numeric(alert?.priceIntelligence?.rrpDeltaPercent)));
          const opened = unique.filter(({ title }) => /\bopened live(?: on stream)?\b/i.test(title));
          const openedResolved = opened.filter(({ alert }) => numeric(alert?.priceIntelligence?.rrpPence));
          const terastal = unique.filter(({ title }) => /terastal grand gathering/i.test(title));
          const terastalResolved = terastal.filter(({ alert }) => numeric(alert?.priceIntelligence?.rrpPence) && numeric(alert?.priceIntelligence?.rrpDeltaPercent));
          console.log(JSON.stringify({
            success: payload?.success === true,
            returnedAlerts: alerts.length,
            uniqueImportProducts: unique.length,
            resolvedImportProducts: resolved.length,
            unresolvedImportProducts: unresolved.length,
            resolvedByMarket: countBy(resolved, (row) => row.market),
            unresolvedByMarket: countBy(unresolved, (row) => row.market),
            openedLiveProducts: opened.length,
            openedLiveResolved: openedResolved.length,
            terastalGrandGatheringProducts: terastal.length,
            terastalGrandGatheringResolved: terastalResolved.length,
          }));
          NODE