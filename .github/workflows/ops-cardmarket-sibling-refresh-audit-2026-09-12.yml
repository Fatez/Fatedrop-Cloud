name: OPS Cardmarket Sibling Finish Refresh Audit 2026-09-12

on:
  push:
    branches:
      - audit/cardmarket-sibling-refresh-2026-09-12
    paths:
      - '.github/workflows/ops-cardmarket-sibling-refresh-audit-2026-09-12.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit newly unlocked exact sibling-finish mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          MAPPING_WRITE: 'false'
        run: node src/trader/value/cardmarket-sibling-finish-exact-recovery-cli.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-sibling-refresh-audit
          path: ${{ runner.temp }}/cardmarket-sibling-finish-exact-recovery.json
          if-no-files-found: error
          retention-days: 14
