name: Cardmarket Inherent Holo Base-Lane Audit

on:
  push:
    branches:
      - audit/cardmarket-inherent-holo-base-lane-2026-09-12
    paths:
      - 'signal-engine/src/trader/value/cardmarket-inherent-holo-base-lane-audit-cli.mjs'
      - '.github/workflows/cardmarket-inherent-holo-base-lane-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit inherent-holo base-lane candidates
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          MAPPING_WRITE: 'false'
          PRICE_WRITE: 'false'
        run: node src/trader/value/cardmarket-inherent-holo-base-lane-audit-cli.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-inherent-holo-base-lane-audit
          path: ${{ runner.temp }}/cardmarket-inherent-holo-base-lane-audit.json
          if-no-files-found: error
          retention-days: 14
