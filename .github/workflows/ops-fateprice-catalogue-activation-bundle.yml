name: OPS FatePrice Catalogue Activation Bundle

on:
  push:
    branches:
      - ops/fateprice-catalogue-activation-2026-09-07
    paths:
      - '.github/workflows/ops-fateprice-catalogue-activation-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-activation-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci

      - name: Download retained exact set evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/activation-evidence"
          mkdir -p "$ROOT"

          download_run_artifacts() {
            local run_id="$1"
            local prefix="$2"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id,.name] | @tsv' | \
            while IFS=$'\t' read -r id name; do
              case "$name" in
                fateprice-set-*|fateprice-recovery-*)
                  mkdir -p "$ROOT/${prefix}/${name}"
                  gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$ROOT/${prefix}/${name}.zip"
                  unzip -q -o "$ROOT/${prefix}/${name}.zip" -d "$ROOT/${prefix}/${name}"
                  ;;
              esac
            done
          }

          download_run_artifacts 34017737476 base
          download_run_artifacts 34030526577 recovery

          # Prismatic Evolutions already passed the exact two-source card audit in run 33939136991.
          # Reuse that retained proof so a transient live API response cannot block activation.
          mkdir -p "$ROOT/prismatic-retained"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9961202202/zip" > "$ROOT/prismatic-retained.zip"
          unzip -q -o "$ROOT/prismatic-retained.zip" -d "$ROOT/prismatic-retained"

      - name: Build Prismatic batch from retained verified proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildVerifiedCatalogueBatch } from './src/trader/catalogue/persistence.mjs';

          const root = process.env.RUNNER_TEMP + '/activation-evidence/prismatic-retained';
          const auditPath = root + '/prismatic-evolutions-card-audit.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));

          if (audit?.set?.tcgdexSetId !== 'sv08.5'
            || audit?.set?.pokemonTcgSetId !== 'sv8pt5'
            || audit?.set?.canonicalSetId !== 'fdset_20b6a6dcfa52bbe0cc54b919') {
            throw new Error('Retained Prismatic set proof is not the expected canonical set');
          }
          if (audit?.sourceCounts?.tcgdexCardsFetched !== 180
            || audit?.sourceCounts?.pokemonTcgCardsFetched !== 180
            || audit?.reconciliation?.matchedCardRecords !== 180
            || audit?.reconciliation?.conflicts !== 0
            || audit?.reconciliation?.quarantined !== 0
            || audit?.reconciliation?.unmatched !== 0
            || audit?.verification?.verifiedIdentityRows !== 281
            || audit?.verification?.rejectedPromotions !== 0
            || !Array.isArray(audit.identities)
            || audit.identities.length !== 281) {
            throw new Error('Retained Prismatic exact-card proof is incomplete or no longer clean');
          }

          const first = audit.identities[0];
          const seriesId = first?.seriesCode;
          if (!seriesId || audit.identities.some((identity) => identity.verificationStatus !== 'verified'
            || identity.setCode !== audit.set.canonicalSetId
            || identity.seriesCode !== seriesId
            || identity.tcgCode !== 'pokemon')) {
            throw new Error('Retained Prismatic identities do not form one verified canonical set');
          }

          const verifiedAt = Math.max(...audit.identities.map((identity) => Number(identity.verifiedAt) || 0));
          if (!verifiedAt) throw new Error('Retained Prismatic proof has no verification timestamp');

          const setMatch = {
            status: 'matched',
            tcgCode: 'pokemon',
            canonicalSeriesId: seriesId,
            canonicalSetId: audit.set.canonicalSetId,
            seriesName: audit.set.seriesName,
            setName: audit.set.setName,
            printedTotal: audit.set.printedTotal,
            total: audit.set.total,
            releasedAt: Date.parse('2025-01-17T00:00:00Z'),
            evidence: [
              {
                sourceName: 'tcgdex',
                sourceRecordId: audit.set.tcgdexSetId,
                sourceSeriesCode: 'sv',
                sourceUrl: `https://api.tcgdex.net/v2/en/sets/${audit.set.tcgdexSetId}`,
              },
              {
                sourceName: 'pokemontcg-api',
                sourceRecordId: audit.set.pokemonTcgSetId,
                sourceSeriesCode: audit.set.pokemonTcgSetCode || null,
                sourceUrl: `https://api.pokemontcg.io/v2/sets/${audit.set.pokemonTcgSetId}`,
              },
            ],
          };

          const promotions = audit.identities.map((identity) => ({ status: 'verified', identities: [identity] }));
          const batch = buildVerifiedCatalogueBatch({ setMatch, promotions, verifiedAt });
          if (batch.cardIdentities.length !== 281) throw new Error('Prismatic retained batch identity count changed');

          const out = process.env.RUNNER_TEMP + '/activation-evidence/prismatic';
          fs.mkdirSync(out, { recursive: true });
          fs.writeFileSync(out + '/set-result.json', JSON.stringify({ status: 'verified', rows: batch }));
          NODE

      - name: Build exact catalogue activation bundle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/activation-evidence';
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name === 'set-result.json') files.push(full);
            }
          };
          walk(root);

          const bySet = new Map();
          for (const file of files.sort()) {
            const row = JSON.parse(fs.readFileSync(file,'utf8'));
            if (row.status !== 'verified' || !row.rows?.set?.id) continue;
            bySet.set(row.rows.set.id,row.rows);
          }

          const selected = [...bySet.values()];
          const dedupe = (rows) => [...new Map(rows.map((row)=>[row.id,row])).values()];
          const bundle = {
            format:'fatedrop-catalogue-activation-bundle-v1',
            generatedAt:new Date().toISOString(),
            safety:{exactOnly:true,fuzzyMatching:false,productionWrites:false,verifiedSetsOnly:true},
            provenance:{baseUniverseRunId:34017737476,recoveryRunId:34030526577,prismaticProofRunId:33939136991},
            tcgs:dedupe(selected.map((x)=>x.tcg).filter(Boolean)),
            series:dedupe(selected.map((x)=>x.series).filter(Boolean)),
            sets:dedupe(selected.map((x)=>x.set).filter(Boolean)),
            setSourceMappings:dedupe(selected.flatMap((x)=>x.setSourceMappings||[])),
            printings:dedupe(selected.flatMap((x)=>x.printings||[])),
            cardIdentities:dedupe(selected.flatMap((x)=>x.cardIdentities||[])),
            cardSourceMappings:dedupe(selected.flatMap((x)=>x.cardSourceMappings||[])),
            cardProvenance:dedupe(selected.flatMap((x)=>x.cardProvenance||[])),
          };
          bundle.counts = {
            sets:bundle.sets.length,
            printings:bundle.printings.length,
            cardIdentities:bundle.cardIdentities.length,
            cardSourceMappings:bundle.cardSourceMappings.length,
            cardProvenance:bundle.cardProvenance.length,
          };

          if (bundle.counts.sets !== 91) throw new Error(`Expected 91 sets, got ${bundle.counts.sets}`);
          if (bundle.counts.cardIdentities !== 17312) throw new Error(`Expected 17312 identities, got ${bundle.counts.cardIdentities}`);

          const setIds = new Set(bundle.sets.map((row) => row.id));
          const printingIds = new Set(bundle.printings.map((row) => row.id));
          const cardIds = new Set(bundle.cardIdentities.map((row) => row.id));
          for (const printing of bundle.printings) if (!setIds.has(printing.setId)) throw new Error(`Orphan printing ${printing.id}`);
          for (const card of bundle.cardIdentities) {
            if (!setIds.has(card.setId)) throw new Error(`Orphan card set ${card.id}`);
            if (!printingIds.has(card.printingId)) throw new Error(`Orphan card printing ${card.id}`);
          }

          const sourceKeys = new Map();
          for (const row of bundle.cardSourceMappings) {
            if (!cardIds.has(row.cardIdentityId)) throw new Error(`Orphan source mapping ${row.id}`);
            const key = `${row.sourceName}|${row.sourceRecordId}|${row.sourceVariantKey}`;
            const prior = sourceKeys.get(key);
            if (prior && prior !== row.cardIdentityId) throw new Error(`Source collision ${key}`);
            sourceKeys.set(key,row.cardIdentityId);
          }

          fs.writeFileSync(process.env.RUNNER_TEMP + '/fateprice-catalogue-activation-bundle.json', JSON.stringify(bundle));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# FatePrice catalogue activation bundle\n\n- Sets: **${bundle.counts.sets}**\n- Identities: **${bundle.counts.cardIdentities}**\n- Fuzzy matching: **disabled**\n- Production writes: **0**\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: fateprice-catalogue-activation-bundle
          path: ${{ runner.temp }}/fateprice-catalogue-activation-bundle.json
          retention-days: 14
          if-no-files-found: error
