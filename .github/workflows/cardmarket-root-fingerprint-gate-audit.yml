name: Cardmarket Root Fingerprint Gate Audit
on:
  push:
    branches: [audit/cardmarket-root-fingerprint-gate-2026-09-12]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit fingerprint gate
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          MAPPING_WRITE: 'false'
          CORRECTION_WRITE: 'false'
        run: node src/trader/value/cardmarket-root-fingerprint-gate-audit-cli.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-root-fingerprint-gate-audit
          path: ${{ runner.temp }}/cardmarket-root-fingerprint-gate-audit.json
          if-no-files-found: error
          retention-days: 14
