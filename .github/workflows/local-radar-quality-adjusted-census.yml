name: Local Radar quality-adjusted census

on:
  push:
    branches:
      - feat/local-radar-location-quality-2026-09-01
    paths:
      - "signal-engine/src/encounters/local-radar-location-policy.mjs"
      - "signal-engine/src/encounters/local-radar-quality-adjusted-census.mjs"
      - "signal-engine/tests/local-radar-quality-adjusted-census.test.mjs"
      - "signal-engine/tests/local-radar-provider-identity-precedence.test.mjs"
      - ".github/workflows/local-radar-quality-adjusted-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-adjusted-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Focused Phase 1 proofs
        working-directory: signal-engine
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/local-radar-location-policy.test.mjs \
            tests/local-radar-canonical-branches.test.mjs \
            tests/local-radar-location-quality-review.test.mjs \
            tests/local-radar-quality-adjusted-census.test.mjs \
            tests/local-radar-provider-identity-precedence.test.mjs

      - name: Read-only UK public census with raw, adjusted and authority-path metrics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            buildQualityAdjustedLocalRadarCensus,
            hasTrustedCanonicalParentEvidence,
          } from './signal-engine/src/encounters/local-radar-quality-adjusted-census.mjs';
          import {
            classifyLocationQuality,
            normalizeLocationPolicy,
          } from './signal-engine/src/encounters/local-radar-location-policy.mjs';

          const endpoint = 'https://fatedrop-cloud-production.up.railway.app/api/local-radar';
          const probes = [
            ['London', 51.5074, -0.1278],
            ['Birmingham', 52.4862, -1.8904],
            ['Manchester', 53.4808, -2.2426],
            ['Leeds', 53.8008, -1.5491],
            ['Newcastle', 54.9783, -1.6178],
            ['Bristol', 51.4545, -2.5879],
            ['Plymouth', 50.3755, -4.1427],
            ['Cardiff', 51.4816, -3.1791],
            ['Glasgow', 55.8642, -4.2518],
            ['Edinburgh', 55.9533, -3.1883],
            ['Aberdeen', 57.1497, -2.0943],
            ['Inverness', 57.4778, -4.2247],
            ['Belfast', 54.5973, -5.9301],
          ];

          const shops = new Map();
          const probeResults = [];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const shopKey = (shop) => String(shop?.id || [shop?.retailerId || 'unknown', shop?.name || '', shop?.postcode || '', shop?.address || ''].join('|'));

          for (const [label, lat, lng] of probes) {
            const url = new URL(endpoint);
            url.searchParams.set('lat', String(lat));
            url.searchParams.set('lng', String(lng));
            url.searchParams.set('radiusMiles', '100');
            url.searchParams.set('types', 'shops');
            url.searchParams.set('tcg', 'pokemon');
            const response = await fetch(url, {
              headers: { 'user-agent': 'FateDrop-Local-Radar-Quality-Census/1.0' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`${label} Local Radar HTTP ${response.status}`);
            const body = await response.json();
            const rows = Array.isArray(body.shops) ? body.shops : [];
            for (const shop of rows) shops.set(shopKey(shop), shop);
            probeResults.push({ label, shops: rows.length, branchIdentity: body?.providers?.branchIdentity || null });
            await sleep(300);
          }

          const rawRows = [...shops.values()];
          const census = buildQualityAdjustedLocalRadarCensus(rawRows);

          function auditRow(shop) {
            const locationEvidence = shop?.locationEvidence || {};
            return {
              ...shop,
              visibilityClass: undefined,
              visibilityReason: undefined,
              identityStatus: shop?.identityStatus ?? locationEvidence?.branchIdentity,
              tcgSellerStatus: shop?.tcgSellerStatus ?? locationEvidence?.pokemonSeller,
              tcgSellerConfidence: shop?.tcgSellerConfidence ?? locationEvidence?.confidence,
              evidenceSourceCount: shop?.evidenceSourceCount ?? locationEvidence?.sourceCount,
              lastVerifiedAt: shop?.lastVerifiedAt ?? locationEvidence?.lastVerifiedAt,
            };
          }

          function authorityPath(shop) {
            const row = auditRow(shop);
            const quality = classifyLocationQuality(row);
            if (quality.visibilityClass !== 'eligible') return null;
            if (hasTrustedCanonicalParentEvidence(row)) return 'trusted_canonical_parent_evidence';
            const policy = normalizeLocationPolicy(row);
            if (policy.identityStatus === 'canonical' && quality.reason === 'branch_tcg_verified') {
              return 'canonical_identity_plus_verified_tcg_policy';
            }
            if (policy.identityStatus === 'canonical' && quality.reason === 'canonical_retail_branch') {
              return 'legacy_canonical_identity_plus_retailer_policy';
            }
            return 'unexplained_eligible_authority';
          }

          const eligibleAuthorityRows = rawRows
            .map((shop) => ({ shop, authorityPath: authorityPath(shop) }))
            .filter((row) => row.authorityPath)
            .map(({ shop, authorityPath }) => ({
              id: shop?.id || null,
              retailer: shop?.retailerId || null,
              provider: shop?.provider || null,
              name: shop?.name || null,
              postcode: shop?.postcode || null,
              verification: shop?.verificationStatus ?? shop?.verification ?? null,
              identityStatus: shop?.identityStatus ?? shop?.locationEvidence?.branchIdentity ?? null,
              authorityPath,
            }));

          const authorityCounts = {};
          const authorityByRetailer = {};
          for (const row of eligibleAuthorityRows) {
            authorityCounts[row.authorityPath] = (authorityCounts[row.authorityPath] || 0) + 1;
            const retailer = row.retailer || '(unknown)';
            authorityByRetailer[retailer] ||= {};
            authorityByRetailer[retailer][row.authorityPath] = (authorityByRetailer[retailer][row.authorityPath] || 0) + 1;
          }

          const report = {
            generatedAt: new Date().toISOString(),
            source: endpoint,
            mode: 'READ_ONLY_PUBLIC_UK_MESH',
            databaseAccess: 'NONE',
            caveat: 'The original raw before/after diagnostic is preserved. The quality-adjusted denominator is independently derived from branch-level canonical evidence carried on the public rows and never from the new classifier eligible output. The authority-path reconciliation explains every post-fix eligible row separately. Direct Neon census remains a separate read-only verification path when connector access permits.',
            probes: probeResults,
            ...census,
            eligibleAuthority: {
              counts: authorityCounts,
              byRetailer: authorityByRetailer,
              rows: eligibleAuthorityRows,
            },
          };

          fs.writeFileSync('local-radar-quality-adjusted-census.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({
            totals: report.totals,
            authorityCounts,
            findingCounts: report.findingCounts,
          }, null, 2));

          const explainedEligible = Object.values(authorityCounts).reduce((sum, value) => sum + Number(value || 0), 0);
          if (report.totals.publicBefore < 1) throw new Error('raw public census unexpectedly empty');
          if (report.totals.uniqueCanonicalParentTotal < 1) throw new Error('trusted canonical-parent denominator unexpectedly empty');
          if (explainedEligible !== report.totals.eligibleAfter) throw new Error(`eligible authority reconciliation mismatch: ${explainedEligible}/${report.totals.eligibleAfter}`);
          if (authorityCounts.unexplained_eligible_authority) throw new Error(`unexplained eligible authority rows: ${authorityCounts.unexplained_eligible_authority}`);
          if (report.findingCounts.obviousNoiseEligible) throw new Error(`obvious service noise remains eligible: ${report.findingCounts.obviousNoiseEligible}`);
          if (report.findingCounts.provisionalEligible) throw new Error(`provisional locations remain eligible: ${report.findingCounts.provisionalEligible}`);
          if (report.findingCounts.weakDiscoveryEligible) throw new Error(`weak provider discoveries remain eligible: ${report.findingCounts.weakDiscoveryEligible}`);
          if (report.findingCounts.lostCanonicalParents) throw new Error(`trusted canonical parent branches were lost: ${report.findingCounts.lostCanonicalParents}`);
          if (report.totals.qualityAdjustedSurvivalPct !== 1) {
            throw new Error(`quality-adjusted canonical-parent survival is not complete: ${report.totals.qualityAdjustedSurvivalPct}`);
          }
          NODE

      - name: Upload Phase 1 census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-radar-quality-adjusted-census
          path: local-radar-quality-adjusted-census.json
          if-no-files-found: warn
          retention-days: 3
