name: Verify FateDrop Signal Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'signal-engine/**'
      - '.github/workflows/signal-engine.yml'
  push:
    branches: [main]
    paths:
      - 'signal-engine/**'
      - '.github/workflows/signal-engine.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run Signal Engine tests
        run: npm test
