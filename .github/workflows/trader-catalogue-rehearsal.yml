name: Rehearse Fate Trader Catalogue

on:
  push:
    branches:
      - verify/trader-catalogue-rehearsal-20260826

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Pin upstream catalogue snapshots
        run: |
          git clone --depth=1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          git clone --depth=1 https://github.com/PokemonTCG/pokemon-tcg-data.git /tmp/pokemontcg
          echo "TCGDEX_COMMIT=$(git -C /tmp/tcgdex rev-parse HEAD)"
          echo "POKEMONTCG_COMMIT=$(git -C /tmp/pokemontcg rev-parse HEAD)"

      - name: Extract pinned English snapshots
        working-directory: signal-engine
        run: |
          bun scripts/extract-tcgdex-snapshot.mjs --repo=/tmp/tcgdex --out=/tmp/tcgdex-en.json
          node scripts/extract-pokemontcg-snapshot.mjs --repo=/tmp/pokemontcg --out=/tmp/pokemontcg-en.json

      - name: Compile fail-closed verified catalogue
        working-directory: signal-engine
        run: |
          npm run trader:catalogue:compile -- \
            --tcgdex=/tmp/tcgdex-en.json \
            --pokemon=/tmp/pokemontcg-en.json \
            --out=/tmp/fatedrop-pokemon-catalogue.json

      - name: Validate compiled catalogue read-only
        working-directory: signal-engine
        run: npm run trader:catalogue:load -- --artifact=/tmp/fatedrop-pokemon-catalogue.json

      - name: Upload frozen rehearsal artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fate-trader-catalogue-rehearsal
          path: /tmp/fatedrop-pokemon-catalogue.json
          retention-days: 1

      - name: Derive isolated Neon URL from existing repository DB secret
        id: rehearsal_auth
        env:
          PARENT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${PARENT_DATABASE_URL:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No repository DATABASE_URL secret is available; isolated DB write rehearsal will be skipped."
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.PARENT_DATABASE_URL);
          url.hostname = 'ep-flat-flower-axfp09hs.c-4.us-east-2.aws.neon.tech';
          url.searchParams.set('sslmode', 'require');
          const value = url.toString();
          if (url.password) console.log(`::add-mask::${url.password}`);
          console.log(`::add-mask::${value}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `REHEARSAL_DATABASE_URL=${value}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'available=true\n');
          NODE

      - name: Install PostgreSQL client if needed
        if: steps.rehearsal_auth.outputs.available == 'true'
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)

      - name: Prove isolated rehearsal connection
        if: steps.rehearsal_auth.outputs.available == 'true'
        run: |
          psql "$REHEARSAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_user;"
          psql "$REHEARSAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM fatedrop_card_identities WHERE verification_status='verified') AS verified_identities, (SELECT count(*) FROM fatedrop_collection_items) AS collection_items, (SELECT count(*) FROM fatedrop_trade_binder_items) AS binder_items, (SELECT count(*) FROM fatedrop_card_wants) AS wants;"

      - name: Load frozen artefact into isolated Neon branch
        if: steps.rehearsal_auth.outputs.available == 'true'
        working-directory: signal-engine
        env:
          DATABASE_URL: ${{ env.REHEARSAL_DATABASE_URL }}
          FATE_TRADER_CATALOGUE_BULK_WRITE_ENABLED: 'true'
        run: npm run trader:catalogue:load -- --artifact=/tmp/fatedrop-pokemon-catalogue.json --write --chunk-size=2000

      - name: Verify catalogue and user-data invariants
        if: steps.rehearsal_auth.outputs.available == 'true'
        run: |
          psql "$REHEARSAL_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'series' AS metric, count(*) AS value FROM fatedrop_card_series WHERE verification_status='verified'
          UNION ALL SELECT 'sets', count(*) FROM fatedrop_card_sets WHERE verification_status='verified'
          UNION ALL SELECT 'printings', count(*) FROM fatedrop_card_printings WHERE verification_status='verified'
          UNION ALL SELECT 'identities', count(*) FROM fatedrop_card_identities WHERE verification_status='verified'
          UNION ALL SELECT 'set_conflicts', count(*) FROM fatedrop_card_set_conflicts
          UNION ALL SELECT 'identity_conflicts', count(*) FROM fatedrop_card_identity_conflicts
          UNION ALL SELECT 'collection_items', count(*) FROM fatedrop_collection_items
          UNION ALL SELECT 'binder_items', count(*) FROM fatedrop_trade_binder_items
          UNION ALL SELECT 'wants', count(*) FROM fatedrop_card_wants;
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM fatedrop_collection_items) OR EXISTS (SELECT 1 FROM fatedrop_trade_binder_items) OR EXISTS (SELECT 1 FROM fatedrop_card_wants) THEN
              RAISE EXCEPTION 'Catalogue rehearsal modified user trade state';
            END IF;
          END $$;
          SQL

      - name: Prove bulk-load idempotency
        if: steps.rehearsal_auth.outputs.available == 'true'
        working-directory: signal-engine
        env:
          DATABASE_URL: ${{ env.REHEARSAL_DATABASE_URL }}
          FATE_TRADER_CATALOGUE_BULK_WRITE_ENABLED: 'true'
        run: |
          npm run trader:catalogue:load -- --artifact=/tmp/fatedrop-pokemon-catalogue.json --write --chunk-size=2000
          psql "$REHEARSAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS verified_identities_after_second_load FROM fatedrop_card_identities WHERE verification_status='verified';"

      - name: Record DB rehearsal skip when no secret is available
        if: steps.rehearsal_auth.outputs.available != 'true'
        run: echo "Catalogue compile/validation passed; isolated Neon write rehearsal skipped because no repository DATABASE_URL secret is configured."
