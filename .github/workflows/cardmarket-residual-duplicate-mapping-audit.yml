name: Cardmarket Residual Duplicate Mapping Audit

on:
  push:
    branches:
      - feat/cardmarket-residual-price-recovery-2026-09-12
    paths:
      - 'signal-engine/src/trader/value/cardmarket-residual-duplicate-mapping-audit-cli.mjs'
      - '.github/workflows/cardmarket-residual-duplicate-mapping-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Audit duplicate Cardmarket mappings with exact target-finish variant evidence
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-residual-duplicate-mapping-audit-cli.mjs
      - name: Upload duplicate mapping audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-residual-duplicate-mapping-audit
          path: ${{ runner.temp }}/cardmarket-residual-duplicate-mapping-audit.json
          if-no-files-found: error
          retention-days: 14
