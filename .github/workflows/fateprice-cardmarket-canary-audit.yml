name: Audit FatePrice Cardmarket Canary

on:
  pull_request:
    paths:
      - '.github/workflows/fateprice-cardmarket-canary-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-cardmarket-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - name: Check out FateDrop repository
        uses: actions/checkout@v4

      - name: Build exact live canary through production Cardmarket adapter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { fetchCardmarketPokemonPriceGuide } from './src/trader/value/cardmarket-source-client.mjs';
          import { buildCardmarketPriceGuideBatch } from './src/trader/value/cardmarket-adapter.mjs';

          // These are Cardmarket source lanes, not FateDrop canonical finish labels.
          // Bill's Transfer #194 and Daisy's Help #195 are holo canonical cards,
          // but their public Cardmarket guide evidence lives in the standard fields.
          const mappings = new Map([
            ['733750', { id:'fdcardmap_9561b8d88d9a2048ee2b2b3e', cardIdentityId:'fdcard_c060a3892f8667401ac92d58' }],
            ['733751', { id:'fdcardmap_dad86f331caa79a27d229dea', cardIdentityId:'fdcard_529acd08d47301c3c54e47c5' }],
            ['733752', { id:'fdcardmap_85946a33eb7a6172030dbd36', cardIdentityId:'fdcard_5e127e2425b4ebefb8826322' }],
            ['733753', { id:'fdcardmap_b4b98a29a0c16e5aae8f9c8c', cardIdentityId:'fdcard_fc4cf35780cf99ddee310a78' }],
            ['733754', { id:'fdcardmap_4c7c4cbffc52987f50882863', cardIdentityId:'fdcard_6f5771d257fbc502d3fcd663' }],
            ['733755', { id:'fdcardmap_ba590c61ec6be821dafd0759', cardIdentityId:'fdcard_17acd1443cb2dc994db90816' }],
            ['733756', { id:'fdcardmap_f3a7c7038c3410bd79263c7d', cardIdentityId:'fdcard_a70acfbc5566c6888fc4bf0f' }],
            ['733757', { id:'fdcardmap_2e60f307494c93e3b88f05b5', cardIdentityId:'fdcard_f26c24361118f2c8777435a3' }],
            ['733758', { id:'fdcardmap_c5c10c4efb11268306ea28f9', cardIdentityId:'fdcard_1aa5056042c2e5cdc826c2fa' }],
            ['733759', { id:'fdcardmap_4a7df945d04ade1042465bf4', cardIdentityId:'fdcard_72f1eae2932839a7636d605f' }],
            ['733760', { id:'fdcardmap_9a4a19385d1f1d007a69dedb', cardIdentityId:'fdcard_f55999e95b96a3f5488af6ff' }],
            ['733789', { id:'fdcardmap_3eec2ca535d46a26622afafc', cardIdentityId:'fdcard_b6b81815dc853957b2e54d3b' }],
            ['733790', { id:'fdcardmap_1a99710bfa7cfcc0a358f486', cardIdentityId:'fdcard_05516a494469468f58c1e5c8' }],
          ]);

          const observedAt = Date.now();
          const source = await fetchCardmarketPokemonPriceGuide({ fetchedAt: observedAt });
          const allRows = source.snapshot.priceGuides;
          const rows = allRows.filter((row) => mappings.has(String(row.idProduct)));
          const seen = new Set(rows.map((row) => String(row.idProduct)));
          const missing = [...mappings.keys()].filter((id) => !seen.has(id));
          if (missing.length) throw new Error(`Canary products missing from current price-guide: ${missing.join(',')}`);

          const scopedPayload = { ...source.artifact.payload, priceGuides: rows };
          const batch = await buildCardmarketPriceGuideBatch(scopedPayload, {
            observedAt,
            lanes: ['standard'],
            resolveMapping: async ({ sourceName, sourceRecordId, priceGuideLane }) => {
              if (sourceName !== 'cardmarket' || priceGuideLane !== 'standard') return null;
              const mapping = mappings.get(String(sourceRecordId));
              return mapping ? {
                ...mapping,
                sourceName: 'cardmarket',
                sourceRecordId: String(sourceRecordId),
                sourceVariantKey: 'normal',
              } : null;
            },
          });
          if (batch.observations.length !== mappings.size || batch.rejections.length !== 0) {
            throw new Error(`Expected 13 accepted / 0 rejected; got ${batch.observations.length} / ${batch.rejections.length}`);
          }

          const result = {
            generatedAt: new Date(observedAt).toISOString(),
            source: {
              url: source.artifact.url,
              version: Number(source.artifact.payload.version),
              createdAt: new Date(source.snapshot.sourceEffectiveAt).toISOString(),
              sha256: source.artifact.sha256,
              totalRows: allRows.length,
              currencyCode: source.snapshot.currencyCode,
            },
            mode: 'read_only_canary',
            writesPerformed: false,
            batch,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/fateprice-cardmarket-canary.json', JSON.stringify(result, null, 2));
          console.log(`Production adapter accepted ${batch.observations.length}/13 exact mapped products with ${batch.rejections.length} rejects.`);
          NODE

      - name: Summarise canary
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/fateprice-cardmarket-canary.json','utf8'));
          console.log('# FatePrice Cardmarket live canary');
          console.log('');
          console.log(`- Snapshot: **${report.source.createdAt}**`);
          console.log(`- Full price-guide rows: **${report.source.totalRows}**`);
          console.log(`- Exact canary accepted: **${report.batch.observations.length}/13**`);
          console.log(`- Rejected: **${report.batch.rejections.length}**`);
          console.log(`- Currency: **${report.source.currencyCode}**`);
          console.log(`- Writes performed: **${report.writesPerformed}**`);
          console.log('');
          for (const row of report.batch.observations.filter((row) => ['733789','733790'].includes(row.sourceRecordId))) {
            console.log(`- ${row.sourceRecordId}: trend=${row.trendPrice ?? '—'} avg7=${row.avg7d ?? '—'} low=${row.lowPrice ?? '—'}`);
          }
          NODE

      - name: Upload exact normalized canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fateprice-cardmarket-canary
          path: ${{ runner.temp }}/fateprice-cardmarket-canary.json
          if-no-files-found: error
          retention-days: 7
