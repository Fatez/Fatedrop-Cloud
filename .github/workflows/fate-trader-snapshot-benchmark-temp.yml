name: Fate Trader Snapshot Compiler Benchmark (Temporary)

on:
  push:
    branches:
      - feature/fate-trader-snapshot-compiler-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install FateDrop dependencies
        working-directory: signal-engine
        run: npm ci
      - name: Clone pinned source snapshots
        run: |
          git clone --depth=1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          git clone --depth=1 https://github.com/PokemonTCG/pokemon-tcg-data.git /tmp/pokemontcg
          echo "TCGDEX_COMMIT=$(git -C /tmp/tcgdex rev-parse HEAD)"
          echo "POKEMONTCG_COMMIT=$(git -C /tmp/pokemontcg rev-parse HEAD)"
      - name: Extract local English snapshots
        working-directory: signal-engine
        run: |
          time bun scripts/extract-tcgdex-snapshot.mjs --repo=/tmp/tcgdex --out=/tmp/tcgdex-en.json
          time node scripts/extract-pokemontcg-snapshot.mjs --repo=/tmp/pokemontcg --out=/tmp/pokemontcg-en.json
          ls -lh /tmp/tcgdex-en.json /tmp/pokemontcg-en.json
      - name: Prove 151 equivalence from snapshots
        working-directory: signal-engine
        run: |
          time npm run trader:catalogue:compile -- --tcgdex=/tmp/tcgdex-en.json --pokemon=/tmp/pokemontcg-en.json --sets=sv03.5 --out=/tmp/fatedrop-151.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('/tmp/fatedrop-151.json', 'utf8'));
          console.log(JSON.stringify({ compilation: data.compilation, counts: data.counts }, null, 2));
          if (data.compilation.verifiedSetCount !== 1) throw new Error(`Expected one verified 151 set, got ${data.compilation.verifiedSetCount}`);
          if (data.counts.printings !== 207) throw new Error(`Expected 207 printings, got ${data.counts.printings}`);
          if (data.counts.cardIdentities !== 362) throw new Error(`Expected 362 card identities, got ${data.counts.cardIdentities}`);
          NODE
      - name: Compile all currently verified sets from snapshots
        working-directory: signal-engine
        run: |
          time npm run trader:catalogue:compile -- --tcgdex=/tmp/tcgdex-en.json --pokemon=/tmp/pokemontcg-en.json --out=/tmp/fatedrop-pokemon-catalogue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('/tmp/fatedrop-pokemon-catalogue.json', 'utf8'));
          console.log(JSON.stringify({
            sources: data.sources,
            crosswalk: data.crosswalk,
            compilation: {
              requestedSetCount: data.compilation.requestedSetCount,
              verifiedSetCount: data.compilation.verifiedSetCount,
              rejectedSetCount: data.compilation.rejectedSetCount,
              rejectedExamples: data.compilation.rejectedSets.slice(0, 15),
            },
            counts: data.counts,
          }, null, 2));
          NODE
      - name: Upload compiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fate-trader-snapshot-compiler-benchmark
          path: |
            /tmp/fatedrop-151.json
            /tmp/fatedrop-pokemon-catalogue.json
          if-no-files-found: warn
          retention-days: 1
