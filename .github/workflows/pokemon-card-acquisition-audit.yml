name: Audit Pokemon Canonical Card Acquisition

on:
  pull_request:
    paths:
      - 'signal-engine/src/trader/catalogue/pokemon-card-acquisition-audit-cli.mjs'
      - 'signal-engine/src/trader/catalogue/source-clients.mjs'
      - 'signal-engine/src/trader/catalogue/pipeline.mjs'
      - 'signal-engine/src/trader/catalogue/reconcile.mjs'
      - 'signal-engine/src/trader/catalogue/verification.mjs'
      - 'signal-engine/src/trader/value/cardmarket-crosswalk.mjs'
      - 'signal-engine/src/trader/value/cardmarket-mapping-audit.mjs'
      - 'signal-engine/src/trader/value/cardmarket-set-expansion-evidence-cli.mjs'
      - 'signal-engine/tests/cardmarket-mapping-audit.test.mjs'
      - 'signal-engine/package.json'
      - '.github/workflows/pokemon-card-acquisition-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pokemon-prismatic-evolutions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Cardmarket expansion evidence logic
        run: node --test tests/cardmarket-mapping-audit.test.mjs

      - name: Audit exact canonical acquisition for Prismatic Evolutions
        run: npm --silent run trader:catalogue:card-audit -- --tcgdex-set=sv08.5 --pokemon-set=sv8pt5 --verified-at=2026-09-05T00:00:00Z > "$RUNNER_TEMP/prismatic-evolutions-card-audit.json"

      - name: Rank Cardmarket expansion evidence for Prismatic Evolutions
        run: npm --silent run market:cardmarket:set-evidence -- --cards-file="$RUNNER_TEMP/prismatic-evolutions-card-audit.json" --limit=10 > "$RUNNER_TEMP/prismatic-evolutions-cardmarket-expansion-evidence.json"

      - name: Summarise card and Cardmarket expansion audit
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const cards = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prismatic-evolutions-card-audit.json', 'utf8'));
          const market = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prismatic-evolutions-cardmarket-expansion-evidence.json', 'utf8'));
          console.log('# Prismatic Evolutions canonical card acquisition');
          console.log('');
          console.log(`- Pokémon source set code: **${cards.set.pokemonTcgSetCode || 'unknown'}**`);
          console.log(`- TCGdex cards fetched: **${cards.sourceCounts.tcgdexCardsFetched}**`);
          console.log(`- Pokémon TCG API cards fetched: **${cards.sourceCounts.pokemonTcgCardsFetched}**`);
          console.log(`- Reconciled card records: **${cards.reconciliation.matchedCardRecords}**`);
          console.log(`- Verified identity rows: **${cards.verification.verifiedIdentityRows}**`);
          console.log(`- Conflicts: **${cards.reconciliation.conflicts}**`);
          console.log(`- Quarantined: **${cards.reconciliation.quarantined}**`);
          console.log(`- Unmatched: **${cards.reconciliation.unmatched}**`);
          console.log('');
          console.log('# Cardmarket expansion evidence');
          console.log('');
          if (!market.candidates.length) {
            console.log('- **No Cardmarket expansion candidate found**');
          } else {
            const top = market.candidates[0];
            console.log(`- Expected Cardmarket set code: **${top.expectedSourceSetCode || 'none'}**`);
            console.log(`- Top expansion ID: **${top.sourceExpansionId}**`);
            console.log(`- Exact printing coverage: **${(top.canonicalExactPrintingCoverage * 100).toFixed(2)}%**`);
            console.log(`- Source printing precision: **${(top.sourceExactPrintingPrecision * 100).toFixed(2)}%**`);
            console.log(`- Exact printing overlap: **${top.exactPrintingKeyOverlap}/${top.canonicalDistinctPrintingKeyCount}**`);
            console.log(`- Cardmarket products in candidate: **${top.sourceProductCount}**`);
            console.log(`- Structured products with expected code: **${top.expectedSourceSetCodeProducts}**`);
          }
          console.log('- Status: **evidence only — not approved or auto-mapped**');
          NODE

      - name: Upload canonical card audit
        uses: actions/upload-artifact@v4
        with:
          name: prismatic-evolutions-canonical-card-audit
          path: ${{ runner.temp }}/prismatic-evolutions-card-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Cardmarket expansion evidence
        uses: actions/upload-artifact@v4
        with:
          name: prismatic-evolutions-cardmarket-expansion-evidence
          path: ${{ runner.temp }}/prismatic-evolutions-cardmarket-expansion-evidence.json
          if-no-files-found: error
          retention-days: 7
