name: Local Radar location quality safe gate

on:
  push:
    branches:
      - feat/local-radar-location-quality-2026-09-01
    paths:
      - .github/workflows/local-radar-location-quality-safe-gate.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feat/local-radar-location-quality-2026-09-01
      PINNED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - name: Pin branch tip before work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"
          echo "PINNED_TIP=$PINNED_SHA"

      - name: Apply duplicate-first parent reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('signal-engine/src/encounters/canonical-retailer-locations.mjs')
          text = path.read_text()
          anchor = '''  return reconciled;\n}\n\nfunction oldPublicEligible(location = {}) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'reconciliation return anchor matched {text.count(anchor)} times; expected exactly once')

          second_pass = '''  // Duplicate identity is resolved before a child service is allowed to choose its parent.\n  // This prevents a pharmacy/locker at the same postcode from seeing both the canonical\n  // supermarket and its duplicate as two parents and becoming falsely unresolved.\n  for (let index = 0; index < reconciled.length; index += 1) {\n    const current = reconciled[index];\n    const serviceKind = locationServiceKind(current);\n    if (!serviceKind || current.relationshipType !== "child_service") continue;\n    if (current.visibilityClass !== "unresolved" || !String(current.visibilityReason || "").endsWith("_parent_ambiguous")) continue;\n    const parents = reconciled.filter((candidate) => plausibleParent(current, candidate));\n    if (parents.length === 1) {\n      reconciled[index] = attachQuality(current, {\n        visibilityClass: "directory-only",\n        visibilityReason: serviceKind,\n        serviceKind,\n        parentLocationId: parents[0].id,\n        relationshipType: "child_service",\n      });\n    }\n  }\n\n'''
          text = text.replace(anchor, second_pass + anchor, 1)
          path.write_text(text)
          PY

      - name: Carry explicit branch TCG authority through operator intake
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('signal-engine/src/encounters/operator-local-radar-intake.mjs')
          text = source.read_text()
          anchor = '  const sourceLabel = text(payload.sourceLabel, 180) || "FateDrop operator intelligence";\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'operator sourceLabel anchor matched {text.count(anchor)} times; expected exactly once')
          text = text.replace(anchor, anchor + '  const explicitTcgRelevance = payload.explicitTcgRelevance === true;\n', 1)
          entry_anchor = '      sourceLabel,\n      observedAt:'
          if text.count(entry_anchor) != 1:
              raise SystemExit(f'operator entry anchor matched {text.count(entry_anchor)} times; expected exactly once')
          text = text.replace(entry_anchor, '      sourceLabel,\n      explicitTcgRelevance,\n      observedAt:', 1)
          source.write_text(text)

          test_path = Path('signal-engine/tests/operator-local-radar-intake.test.mjs')
          test_text = test_path.read_text()
          body_anchor = '    sourceLabel: "The Entertainer official Pokémon TCG page",\n'
          if test_text.count(body_anchor) != 1:
              raise SystemExit(f'operator fixture sourceLabel anchor matched {test_text.count(body_anchor)} times; expected exactly once')
          test_text = test_text.replace(body_anchor, body_anchor + '    explicitTcgRelevance: true,\n', 1)
          confidence_anchor = '  assert.equal(parsed.entry.confidence, 0.68);\n'
          if test_text.count(confidence_anchor) != 1:
              raise SystemExit(f'operator fixture confidence anchor matched {test_text.count(confidence_anchor)} times; expected exactly once')
          test_text = test_text.replace(confidence_anchor, confidence_anchor + '  assert.equal(parsed.entry.explicitTcgRelevance, true);\n', 1)
          bromley = '{ id: "loc-bromley", retailerId: "entertainer-uk", name: "The Entertainer Bromley Lower Mall", address: "Bromley", postcode: "BR1 1DN" }'
          watford = '{ id: "loc-watford", retailerId: "entertainer-uk", name: "The Entertainer Watford", address: "Watford", postcode: "WD17 2UB" }'
          if test_text.count(bromley) != 1 or test_text.count(watford) != 1:
              raise SystemExit('operator canonical branch fixture anchors did not match exactly once')
          test_text = test_text.replace(bromley, '{ id: "loc-bromley", retailerId: "entertainer-uk", name: "The Entertainer Bromley Lower Mall", address: "Bromley", postcode: "BR1 1DN", storeFormat: "toy_store" }', 1)
          test_text = test_text.replace(watford, '{ id: "loc-watford", retailerId: "entertainer-uk", name: "The Entertainer Watford", address: "Watford", postcode: "WD17 2UB", storeFormat: "toy_store" }', 1)
          test_path.write_text(test_text)
          PY

      - name: Add review-only quality proof
        shell: bash
        run: |
          set -euo pipefail
          cat > signal-engine/tests/local-radar-location-quality-review.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import {
            buildCanonicalRetailerLocationQualityReview,
            reconcileLocationQuality,
          } from "../src/encounters/canonical-retailer-locations.mjs";

          const NOW = Date.parse("2026-09-01T12:00:00Z");

          const rows = [
            { id: "tesco-parent", retailerId: "tesco-uk", provider: "official_retailer_directory", providerId: "watford-extra", name: "Tesco Extra Watford", address: "Watford", postcode: "WD17 1AA", latitude: 51.656, longitude: -0.395, storeFormat: "superstore", verification: "official_retailer_branch", updatedAt: 2000 },
            { id: "tesco-duplicate", retailerId: "tesco-uk", provider: "google_places", providerId: "duplicate-watford", name: "Tesco Extra Watford", address: "Watford", postcode: "WD17 1AA", latitude: 51.65601, longitude: -0.39501, storeFormat: "superstore", updatedAt: 1000 },
            { id: "tesco-pharmacy", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-pharmacy", name: "Tesco Watford Pharmacy", address: "Tesco Extra Watford", postcode: "WD17 1AA", latitude: 51.65602, longitude: -0.39502, storeFormat: "pharmacy" },
            { id: "tesco-petrol", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-petrol", name: "Tesco Watford Petrol Station", address: "Watford", postcode: "WD17 1AA", latitude: 51.6564, longitude: -0.3954, storeFormat: "petrol_station" },
            { id: "tesco-unknown-format", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-unknown", name: "Tesco Watford", address: "Watford", postcode: "WD18 0AA", latitude: 51.66, longitude: -0.40, storeFormat: "unknown" },
            { id: "tesco-closed", retailerId: "tesco-uk", provider: "official_retailer_directory", providerId: "closed", name: "Tesco Old Watford", address: "Watford", postcode: "WD19 0AA", latitude: 51.67, longitude: -0.41, storeFormat: "superstore", operationalStatus: "closed" },
          ];

          test("duplicate branches are resolved before child services choose a canonical parent", () => {
            const reconciled = reconcileLocationQuality(rows);
            const byId = new Map(reconciled.map((row) => [row.id, row]));
            assert.equal(byId.get("tesco-parent").visibilityClass, "eligible");
            assert.equal(byId.get("tesco-duplicate").visibilityClass, "excluded");
            assert.equal(byId.get("tesco-duplicate").visibilityReason, "duplicate");
            assert.equal(byId.get("tesco-duplicate").parentLocationId, "tesco-parent");
            assert.equal(byId.get("tesco-pharmacy").visibilityClass, "directory-only");
            assert.equal(byId.get("tesco-pharmacy").relationshipType, "child_service");
            assert.equal(byId.get("tesco-pharmacy").parentLocationId, "tesco-parent");
            assert.equal(byId.get("tesco-petrol").visibilityClass, "directory-only");
            assert.equal(byId.get("tesco-petrol").parentLocationId, "tesco-parent");
            assert.equal(byId.get("tesco-unknown-format").visibilityClass, "directory-only");
            assert.equal(byId.get("tesco-closed").visibilityClass, "excluded");
          });

          test("review report contains before/after counts, reasons, reconciliations, removed samples and fresh event-scoped Echo authority", async () => {
            const store = { async listRetailerLocations() { return rows; } };
            const review = await buildCanonicalRetailerLocationQualityReview(store, {
              now: NOW,
              echoEvents: [
                { locationId: "tesco-parent", sourceType: "official_retailer_page", exactBranch: true, chainWide: false, explicitTcgRelevance: true, productRelevant: true, productIdentityId: "pokemon:test-product", expiresAt: "2026-09-02T12:00:00Z" },
                { locationId: "tesco-unknown-format", sourceType: "official_retailer_page", exactBranch: true, explicitTcgRelevance: true, productRelevant: true, productIdentityId: "pokemon:test-product", expiresAt: "2026-09-02T12:00:00Z" },
                { locationId: "tesco-parent", sourceType: "official_retailer_page", exactBranch: true, explicitTcgRelevance: true, productRelevant: true, productIdentityId: "pokemon:expired", expiresAt: "2026-08-31T12:00:00Z" },
              ],
            });
            assert.equal(review.retailers.length, 1);
            const tesco = review.retailers[0];
            assert.equal(tesco.retailerId, "tesco-uk");
            assert.equal(tesco.rawTotal, 6);
            assert.equal(tesco.beforePublic, 5);
            assert.equal(tesco.afterPublic, 1);
            assert.equal(tesco.eligible, 1);
            assert.equal(tesco.directoryOnly, 3);
            assert.equal(tesco.excluded, 2);
            assert.equal(tesco.unresolved, 0);
            assert.equal(tesco.echoEligible, 1);
            assert.equal(tesco.deltaPublic, -4);
            assert.equal(review.echoEligibleBranchCount, 1);
            assert.ok(review.removedSamples.some((row) => row.id === "tesco-pharmacy"));
            assert.ok(review.reconciliations.some((row) => row.id === "tesco-duplicate" && row.relationshipType === "duplicate_of"));
            assert.ok(review.reconciliations.some((row) => row.id === "tesco-pharmacy" && row.parentLocationId === "tesco-parent"));
            assert.match(review.truthRule, /Raw locations, stock observations and lifecycle history remain unchanged/i);
            assert.match(review.truthRule, /without creating Vanished/i);
          });
          EOF

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Focused Local Radar quality proofs
        working-directory: signal-engine
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/local-radar-location-policy.test.mjs \
            tests/local-radar-canonical-branches.test.mjs \
            tests/local-radar-location-quality-review.test.mjs \
            tests/curated-incoming-intel-reconcile.test.mjs \
            tests/operator-local-radar-intake.test.mjs

      - name: Full Signal Engine suite
        working-directory: signal-engine
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../local-radar-full-suite.log
          status=${PIPESTATUS[0]}
          echo "FULL_SUITE_EXIT=$status"
          tail -n 160 ../local-radar-full-suite.log
          exit "$status"

      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-radar-full-suite-diagnostics
          path: local-radar-full-suite.log
          if-no-files-found: error
          retention-days: 1

      - name: Inspect and pin final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = $'signal-engine/src/encounters/canonical-retailer-locations.mjs\nsignal-engine/src/encounters/operator-local-radar-intake.mjs\nsignal-engine/tests/local-radar-location-quality-review.test.mjs\nsignal-engine/tests/operator-local-radar-intake.test.mjs'

      - name: Commit only after every proof passes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PINNED_SHA"
          git add \
            signal-engine/src/encounters/canonical-retailer-locations.mjs \
            signal-engine/src/encounters/operator-local-radar-intake.mjs \
            signal-engine/tests/local-radar-location-quality-review.test.mjs \
            signal-engine/tests/operator-local-radar-intake.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(local-radar): reconcile location quality for review"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
