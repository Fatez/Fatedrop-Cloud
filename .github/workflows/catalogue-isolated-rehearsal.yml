name: Rehearse full catalogue in isolated PostgreSQL

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/catalogue-isolated-rehearsal.yml'
      - 'signal-engine/src/trader/catalogue/rehearse-live-catalogue.mjs'
      - 'signal-engine/src/trader/catalogue/rehearsal-guard.mjs'
      - 'signal-engine/src/trader/catalogue/reconcile.mjs'
      - 'signal-engine/src/trader/catalogue/pipeline.mjs'
      - 'signal-engine/src/trader/catalogue/sync.mjs'
      - 'signal-engine/src/trader/catalogue/bulk-sync.mjs'

permissions:
  contents: read

concurrency:
  group: catalogue-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fatedrop_catalogue_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fatedrop_catalogue_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Pokemon TCG publisher data
        uses: actions/checkout@v4
        with:
          repository: PokemonTCG/pokemon-tcg-data
          ref: 8b4e387930ead7be6595b4d4c59b7ba7a3a79f08
          path: _evidence/pokemon-tcg-data
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Verify isolation guard
        run: node --test tests/catalogue-rehearsal-guard.test.mjs
      - name: Import and replay exact catalogue in disposable PostgreSQL
        env:
          POKEMON_TCG_DATA_ROOT: ${{ github.workspace }}/_evidence/pokemon-tcg-data
          POKEMON_TCG_DATA_REVISION: 8b4e387930ead7be6595b4d4c59b7ba7a3a79f08
          CATALOGUE_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fatedrop_catalogue_rehearsal
        run: node src/trader/catalogue/rehearse-live-catalogue.mjs
      - name: Retain rehearsal progress and saved counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-isolated-rehearsal
          path: ${{ runner.temp }}/catalogue-rehearsal.json
          if-no-files-found: warn
          retention-days: 14
