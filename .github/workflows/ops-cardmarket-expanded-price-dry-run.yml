name: OPS Cardmarket Expanded Price Dry Run

on:
  push:
    branches:
      - ops/cardmarket-price-dry-run-expanded-2026-09-11
    paths:
      - '.github/workflows/ops-cardmarket-expanded-price-dry-run.yml'

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Dry-run exact Cardmarket normal+holo cycle
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: dry-run
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs
      - name: Upload cycle audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-expanded-price-dry-run-audit
          path: ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: error
          retention-days: 14
