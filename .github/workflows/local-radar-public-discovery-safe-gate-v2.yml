name: Local Radar public discovery safe gate v2

on:
  push:
    branches:
      - fix/local-radar-public-discovery-gate-2026-09-01
    paths:
      - .github/workflows/local-radar-public-discovery-safe-gate-v2.yml

permissions:
  contents: write

jobs:
  safe-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - name: Verify pinned branch tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/fix/local-radar-public-discovery-gate-2026-09-01)" = "${GITHUB_SHA}"

      - name: Apply public discovery and canonical-format hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          policy = "signal-engine/src/encounters/local-radar-location-policy.mjs"
          replace_once(policy,
          '''const STRONG_BRANCH_TCG_SOURCES = new Set([\n  "official_retailer_page",\n  "retailer_staff_report",''',
          '''const STRONG_BRANCH_TCG_SOURCES = new Set([\n  "official_retailer_page",\n  "official_store_social",\n  "retailer_staff_report",''')

          replace_once(policy,
          '''  ["petrol_station", /\\b(petrol|fuel|filling)\\s+(station|forecourt)\\b|\\bpetrol\\s+station\\b|\\bfilling\\s+station\\b/i],''',
          '''  ["petrol_station", /\\b(?:petrol|fuel)(?:[\\s_-]+(?:station|forecourt|express))?\\b|\\bfilling[\\s_-]+station\\b|\\bgas[\\s_-]*station\\b/i],''')

          replace_once(policy,
          '''    openingDetails?.storeFormat,\n    openingDetails?.locationType,\n    openingDetails?.category,''',
          '''    openingDetails?.storeFormat,\n    openingDetails?.locationType,\n    openingDetails?.category,\n    openingDetails?.providerPrimaryType,\n    ...(Array.isArray(openingDetails?.providerTypes) ? openingDetails.providerTypes : []),\n    record.primaryType,\n    ...(Array.isArray(record.types) ? record.types : []),''')

          replace_once(policy,
          '''export function locationPolicyForRetailer(retailerId) {\n  return RETAILER_LOCATION_POLICY[String(retailerId || "").trim()] || {\n    retailerCategory: "other",\n    tcgSellerStatus: "candidate",\n    tcgSellerConfidence: 0,\n  };\n}\n\nexport function normalizeLocationPolicy(record = {}) {''',
          '''export function locationPolicyForRetailer(retailerId) {\n  return RETAILER_LOCATION_POLICY[String(retailerId || "").trim()] || {\n    retailerCategory: "other",\n    tcgSellerStatus: "candidate",\n    tcgSellerConfidence: 0,\n  };\n}\n\nfunction inferredCanonicalStoreFormat(record = {}, { retailerCategory, identityStatus } = {}) {\n  const openingDetails = record.openingDetails ?? record.opening_details_json ?? {};\n  const explicit = String(record.storeFormat ?? record.store_format ?? openingDetails?.storeFormat ?? "").trim();\n  if (explicit && text(explicit) !== "unknown") return explicit;\n  if (identityStatus !== "canonical") return "unknown";\n  const retailerId = String(record.retailerId ?? record.retailer_id ?? "").trim();\n  if (!retailerId || !RETAILER_LOCATION_POLICY[retailerId] || retailerCategory === "other") return "unknown";\n  return ({\n    supermarket: "supermarket_branch",\n    warehouse_club: "warehouse_club",\n    toy_store: "toy_store",\n    specialist_tcg: "specialist_tcg",\n    entertainment: "entertainment_store",\n    hobby_store: "hobby_store",\n    book_stationery: "book_stationery",\n    general_retail: "general_retail_branch",\n    value_retail: "value_retail_branch",\n  })[retailerCategory] || "retail_branch";\n}\n\nfunction providerTypeValues(record = {}) {\n  const openingDetails = record.openingDetails ?? record.opening_details_json ?? {};\n  return [\n    record.primaryType,\n    ...(Array.isArray(record.types) ? record.types : []),\n    openingDetails?.providerPrimaryType,\n    ...(Array.isArray(openingDetails?.providerTypes) ? openingDetails.providerTypes : []),\n  ].map((value) => text(value)).filter(Boolean);\n}\n\nexport function normalizeLocationPolicy(record = {}) {''')

          replace_once(policy,
          '''  const sellerStatus = identityStatus === "conflicted"\n    ? "conflicted"\n    : enumValue(record.tcgSellerStatus ?? record.tcg_seller_status, SELLER_STATES, fallback.tcgSellerStatus);\n\n  const retailerCategory = enumValue(\n    record.retailerCategory ?? record.retailer_category,\n    RETAILER_CATEGORIES,\n    fallback.retailerCategory,\n  );''',
          '''  const evidenceSourceCount = Math.max(0, Number(record.evidenceSourceCount ?? record.evidence_source_count) || 0);\n  const rawSellerStatus = enumValue(record.tcgSellerStatus ?? record.tcg_seller_status, SELLER_STATES, null);\n  const rawSellerConfidence = confidence(record.tcgSellerConfidence ?? record.tcg_seller_confidence, 0);\n  const legacyDefaultCandidate = identityStatus === "canonical"\n    && rawSellerStatus === "candidate"\n    && rawSellerConfidence === 0\n    && evidenceSourceCount === 0\n    && fallback.tcgSellerStatus !== "candidate";\n  const sellerStatus = identityStatus === "conflicted"\n    ? "conflicted"\n    : legacyDefaultCandidate\n      ? fallback.tcgSellerStatus\n      : rawSellerStatus || fallback.tcgSellerStatus;\n\n  const rawRetailerCategory = enumValue(record.retailerCategory ?? record.retailer_category, RETAILER_CATEGORIES, null);\n  const retailerCategory = identityStatus === "canonical"\n    && rawRetailerCategory === "other"\n    && fallback.retailerCategory !== "other"\n      ? fallback.retailerCategory\n      : rawRetailerCategory || fallback.retailerCategory;''')

          replace_once(policy,
          '''    storeFormat: String(record.storeFormat ?? record.store_format ?? openingDetails?.storeFormat ?? "unknown").trim() || "unknown",''',
          '''    storeFormat: inferredCanonicalStoreFormat(record, { retailerCategory, identityStatus }),''')

          replace_once(policy,
          '''    tcgSellerConfidence: sellerStatus === "conflicted"\n      ? 0\n      : confidence(record.tcgSellerConfidence ?? record.tcg_seller_confidence, fallback.tcgSellerConfidence),\n    identityStatus,\n    lastVerifiedAt: epochSeconds(record.lastVerifiedAt ?? record.last_verified_at),\n    evidenceSourceCount: Math.max(0, Number(record.evidenceSourceCount ?? record.evidence_source_count) || 0),''',
          '''    tcgSellerConfidence: sellerStatus === "conflicted"\n      ? 0\n      : legacyDefaultCandidate\n        ? fallback.tcgSellerConfidence\n        : confidence(record.tcgSellerConfidence ?? record.tcg_seller_confidence, fallback.tcgSellerConfidence),\n    identityStatus,\n    lastVerifiedAt: epochSeconds(record.lastVerifiedAt ?? record.last_verified_at),\n    evidenceSourceCount,''')

          replace_once(policy,
          '''export function isRadarEligibleLocation(location = {}) {\n  return classifyLocationQuality(location).visibilityClass === "eligible";\n}\n\nexport function hasExplicitTcgRelevance''',
          '''export function isRadarEligibleLocation(location = {}) {\n  return classifyLocationQuality(location).visibilityClass === "eligible";\n}\n\nexport function isPublicDiscoveryEligibleLocation(location = {}) {\n  const policy = normalizeLocationPolicy(location);\n  if (policy.operationalStatus === "closed") return false;\n  if (policy.identityStatus === "conflicted" || policy.tcgSellerStatus === "conflicted") return false;\n  if (policy.tcgSellerStatus === "excluded" || locationServiceKind(location)) return false;\n\n  const retailerId = String(location.retailerId ?? location.retailer_id ?? "").trim();\n  if (retailerId && RETAILER_LOCATION_POLICY[retailerId]) return true;\n\n  const specialistTypes = new Set(["game_store", "hobby_store", "toy_store", "comic_book_store", "collectibles_store"]);\n  if (providerTypeValues(location).some((value) => specialistTypes.has(value))) return true;\n\n  const haystack = qualityHaystack(location);\n  return /\\b(?:tcg|trading cards?|collectible cards?|pokemon|pokémon|magic the gathering|lorcana|yu[\\s-]?gi[\\s-]?oh)\\b/i.test(haystack);\n}\n\nexport function hasExplicitTcgRelevance''')

          canonical = "signal-engine/src/encounters/canonical-retailer-locations.mjs"
          replace_once(canonical,
          '''  isEchoEligibleLocation,\n  isRadarEligibleLocation,\n  locationServiceKind,''',
          '''  isEchoEligibleLocation,\n  isPublicDiscoveryEligibleLocation,\n  isRadarEligibleLocation,\n  locationServiceKind,''')
          replace_once(canonical,
          '''export function mergeCanonicalRetailerShops(discoveredShops = [], canonicalShops = []) {\n  const result = [...(Array.isArray(discoveredShops) ? discoveredShops : [])];''',
          '''export function mergeCanonicalRetailerShops(discoveredShops = [], canonicalShops = []) {\n  const result = [...(Array.isArray(discoveredShops) ? discoveredShops : [])]\n    .filter(isPublicDiscoveryEligibleLocation);''')

          radar = "signal-engine/src/encounters/local-radar.mjs"
          replace_once(radar,
          '''  LOCATION_POLICY_ENUMS,\n  normalizeLocationPolicy,\n  publicLocationEvidence,''',
          '''  LOCATION_POLICY_ENUMS,\n  isPublicDiscoveryEligibleLocation,\n  normalizeLocationPolicy,\n  publicLocationEvidence,''')
          replace_once(radar,
          '''    sourceAttribution: "Google Places",\n    retailerCategory: locationPolicy.retailerCategory,''',
          '''    sourceAttribution: "Google Places",\n    openingDetails: {\n      providerPrimaryType: text(place.primaryType),\n      providerTypes: array(place.types),\n    },\n    retailerCategory: locationPolicy.retailerCategory,''')
          replace_once(radar,
          '''  const branchIdentityResult = requested.has("shops")\n    ? await persistMatchedRetailerLocations(store, discoveredShops)''',
          '''  const publicDiscoveredShops = discoveredShops.filter(isPublicDiscoveryEligibleLocation);\n\n  const branchIdentityResult = requested.has("shops")\n    ? await persistMatchedRetailerLocations(store, publicDiscoveredShops)''')
          replace_once(radar,
          '''  const radarShops = mergeCanonicalRetailerShops(discoveredShops, canonicalBranchResult.shops);''',
          '''  const radarShops = mergeCanonicalRetailerShops(publicDiscoveredShops, canonicalBranchResult.shops);''')

          persistence = "signal-engine/src/encounters/local-radar-branch-persistence.mjs"
          replace_once(persistence,
          '''    openingDetails: {\n      sourceAttribution: shop.sourceAttribution || "Live location discovery",\n      stockStatus: "unknown",\n      stockClaim: false,\n    },''',
          '''    openingDetails: {\n      ...(shop.openingDetails && typeof shop.openingDetails === "object" ? shop.openingDetails : {}),\n      sourceAttribution: shop.sourceAttribution || "Live location discovery",\n      stockStatus: "unknown",\n      stockClaim: false,\n    },''')

          policy_test = "signal-engine/tests/local-radar-location-policy.test.mjs"
          replace_once(policy_test,
          '''  isEchoEligibleLocation,\n  isRadarEligibleLocation,''',
          '''  isEchoEligibleLocation,\n  isPublicDiscoveryEligibleLocation,\n  isRadarEligibleLocation,''')
          replace_once(policy_test,
          '''test("unknown formats and unknown retailers fail closed to directory-only", () => {\n  const knownRetailerUnknownFormat = { retailerId: "smyths-uk", name: "Smyths Stevenage" };\n  assert.equal(classifyLocationQuality(knownRetailerUnknownFormat).visibilityClass, "directory-only");\n  assert.equal(classifyLocationQuality(knownRetailerUnknownFormat).reason, "store_format_unknown");\n\n  const location = {''',
          '''test("canonical known retailers derive a generic retail format while provisional unknowns fail closed", () => {\n  const canonical = { retailerId: "smyths-uk", name: "Smyths Stevenage", identityStatus: "canonical" };\n  assert.equal(normalizeLocationPolicy(canonical).storeFormat, "toy_store");\n  assert.equal(classifyLocationQuality(canonical).visibilityClass, "eligible");\n\n  const provisional = { retailerId: "smyths-uk", name: "Smyths Stevenage", identityStatus: "provisional" };\n  assert.equal(classifyLocationQuality(provisional).visibilityClass, "unresolved");\n  assert.equal(isRadarEligibleLocation(provisional), false);\n\n  const location = {''')
          replace_once(policy_test,
          '''    ["Tesco Extra Petrol Station", "petrol_station"],\n    ["Tesco Parcel Locker", "locker"],''',
          '''    ["Tesco Extra Petrol Station", "petrol_station"],\n    ["Tesco Fuel Express", "petrol_station"],\n    ["Tesco Fuel Chineham", "petrol_station"],\n    ["Tesco Parcel Locker", "locker"],''')
          replace_once(policy_test,
          '''test("chain-level likely status can support a clean public branch but cannot create Echo by itself", () => {''',
          '''test("fresh discovery gate keeps real retail candidates but blocks services and vague results", () => {\n  assert.equal(isPublicDiscoveryEligibleLocation({ retailerId: "tesco-uk", name: "Tesco Extra Watford", identityStatus: "provisional" }), true);\n  assert.equal(isPublicDiscoveryEligibleLocation({ retailerId: "tesco-uk", name: "Tesco Pharmacy", identityStatus: "provisional" }), false);\n  assert.equal(isPublicDiscoveryEligibleLocation({ retailerId: "tesco-uk", name: "Tesco Fuel Express", identityStatus: "provisional" }), false);\n  assert.equal(isPublicDiscoveryEligibleLocation({ name: "North Star TCG", identityStatus: "provisional" }), true);\n  assert.equal(isPublicDiscoveryEligibleLocation({ name: "Generic Convenience Shop", identityStatus: "provisional" }), false);\n});\n\ntest("chain-level likely status can support a clean public branch but cannot create Echo by itself", () => {''')
          replace_once(policy_test,
          '''  assert.equal(isEchoEligibleLocation(branch, activeEchoEvidence(), NOW), true);\n});\n\ntest("explicit TCG evidence cannot make a child service Echo eligible",''',
          '''  assert.equal(isEchoEligibleLocation(branch, activeEchoEvidence(), NOW), true);\n  assert.equal(isEchoEligibleLocation(branch, activeEchoEvidence({ sourceType: "official_store_social" }), NOW), true);\n});\n\ntest("explicit TCG evidence cannot make a child service Echo eligible",''')

          review_test = "signal-engine/tests/local-radar-location-quality-review.test.mjs"
          replace_once(review_test,
          '''{ id: "tesco-unknown-format", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-unknown", name: "Tesco Watford", address: "Watford", postcode: "WD18 0AA", latitude: 51.66, longitude: -0.40, storeFormat: "unknown" },''',
          '''{ id: "tesco-unknown-format", retailerId: "tesco-uk", provider: "google_places", providerId: "watford-unknown", name: "Tesco Watford", address: "Watford", postcode: "WD18 0AA", latitude: 51.66, longitude: -0.40, storeFormat: "unknown", identityStatus: "provisional" },''')
          replace_once(review_test,
          '''assert.equal(byId.get("tesco-unknown-format").visibilityClass, "directory-only");''',
          '''assert.equal(byId.get("tesco-unknown-format").visibilityClass, "unresolved");''')
          replace_once(review_test,
          '''  assert.equal(tesco.directoryOnly, 3);\n  assert.equal(tesco.excluded, 2);\n  assert.equal(tesco.unresolved, 0);''',
          '''  assert.equal(tesco.directoryOnly, 2);\n  assert.equal(tesco.excluded, 2);\n  assert.equal(tesco.unresolved, 1);''')

          canonical_test = "signal-engine/tests/local-radar-canonical-branches.test.mjs"
          with open(canonical_test, "a") as f:
              f.write('''

test("fresh discovery gate blocks service noise before map merge and persistence", async () => {
  const persisted = [];
  const store = {
    async listRetailerLocations() { return []; },
    async listOffers() { return []; },
    async listLocalStockObservations() { return []; },
    async upsertRetailerLocations(locations) { persisted.push(...locations); return { saved: locations.length }; },
  };
  const placesSearch = async () => ({
    provider: "google_places",
    status: "ok",
    shops: [
      {
        id: "google:tesco-real", provider: "google_places", providerPlaceId: "tesco-real",
        name: "Tesco Extra Watford", latitude: 51.66, longitude: -0.40, retailerId: null,
        websiteUrl: "https://www.tesco.com", operationalStatus: "open", sourceAttribution: "Google Places",
      },
      {
        id: "google:tesco-pharmacy", provider: "google_places", providerPlaceId: "tesco-pharmacy",
        name: "Tesco Pharmacy", latitude: 51.661, longitude: -0.401, retailerId: null,
        websiteUrl: "https://www.tesco.com", operationalStatus: "open", sourceAttribution: "Google Places",
      },
      {
        id: "google:tesco-fuel", provider: "google_places", providerPlaceId: "tesco-fuel",
        name: "Tesco Fuel Express", latitude: 51.662, longitude: -0.402, retailerId: null,
        websiteUrl: "https://www.tesco.com", operationalStatus: "open", sourceAttribution: "Google Places",
      },
    ],
  });

  const result = await buildLocalRadar({
    store,
    retailers: [{ id: "tesco-uk", name: "Tesco", baseUrl: "https://www.tesco.com" }],
    placesSearch,
    smythsAvailabilityRefresh: async () => ({ provider: "smyths_official_store_availability", status: "skipped", productsChecked: 0, observationsSaved: 0, rejected: 0 }),
    latitude: 51.66, longitude: -0.40, radiusMiles: 5, tcg: "pokemon", types: ["shops"],
  });

  assert.deepEqual(result.shops.map((shop) => shop.name), ["Tesco Extra Watford"]);
  assert.deepEqual(persisted.map((location) => location.name), ["Tesco Extra Watford"]);
});
''')
          PY

      - name: Install Signal Engine dependencies
        working-directory: signal-engine
        run: npm ci

      - name: Run focused Local Radar proofs
        working-directory: signal-engine
        run: |
          node --test \
            tests/local-radar-location-policy.test.mjs \
            tests/local-radar-canonical-branches.test.mjs \
            tests/local-radar-location-quality-review.test.mjs \
            tests/curated-incoming-intel-reconcile.test.mjs \
            tests/operator-local-radar-intake.test.mjs

      - name: Run full Signal Engine regression
        working-directory: signal-engine
        run: npm test

      - name: Verify real UK public-map impact read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { classifyLocationQuality, isRadarEligibleLocation } from './signal-engine/src/encounters/local-radar-location-policy.mjs';
          const endpoint = 'https://fatedrop-cloud-production.up.railway.app/api/local-radar';
          const probes = [
            ['Watford/London',51.6565,-0.3903],['Birmingham',52.4862,-1.8904],['Manchester',53.4808,-2.2426],
            ['Leeds',53.8008,-1.5491],['Bristol',51.4545,-2.5879],['Glasgow',55.8642,-4.2518],
            ['Newcastle',54.9783,-1.6178],['Nottingham',52.9548,-1.1581],['Sheffield',53.3811,-1.4701],
            ['Liverpool',53.4084,-2.9916],['Cardiff',51.4816,-3.1791],['Southampton',50.9097,-1.4044],['Edinburgh',55.9533,-3.1883],
          ];
          const all = new Map();
          const key = (shop) => String(shop.id || [shop.retailerId||'',shop.name||'',shop.address||'',shop.postcode||''].join('|'));
          for (const [label,lat,lng] of probes) {
            const url = new URL(endpoint);
            url.searchParams.set('lat', String(lat)); url.searchParams.set('lng', String(lng));
            url.searchParams.set('radiusMiles','25'); url.searchParams.set('types','shops'); url.searchParams.set('tcg','pokemon');
            const response = await fetch(url, { headers: { 'user-agent':'FateDrop-Local-Radar-Public-Gate-Proof/2.0' }, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`${label}: HTTP ${response.status}`);
            const body = await response.json();
            for (const shop of body.shops || []) all.set(key(shop), shop);
          }
          const shops = [...all.values()];
          const kept = shops.filter(isRadarEligibleLocation);
          const removed = shops.filter((shop) => !isRadarEligibleLocation(shop));
          const noisePattern = /\b(pharmacy|chemist|petrol|fuel|filling[\s_-]+station|gas[\s_-]*station|forecourt|locker|inpost|service[\s_-]+counter|customer[\s_-]+service|click\s*(?:&|and)\s*collect)\b/i;
          const remainingNoise = kept.filter((shop) => noisePattern.test(`${shop.name||''} ${shop.address||''}`));
          const reasons = removed.reduce((acc, shop) => { const reason = classifyLocationQuality(shop).reason; acc[reason]=(acc[reason]||0)+1; return acc; }, {});
          const byRetailer = {};
          for (const shop of shops) {
            const id = shop.retailerId || '(unmatched)';
            byRetailer[id] ||= { before: 0, after: 0, removed: 0 };
            byRetailer[id].before += 1;
            if (isRadarEligibleLocation(shop)) byRetailer[id].after += 1;
            else byRetailer[id].removed += 1;
          }
          const report = { before: shops.length, after: kept.length, removed: removed.length, remainingObviousNoise: remainingNoise.length, reasons, retailers: byRetailer };
          console.log(JSON.stringify(report, null, 2));
          if (shops.length < 2000) throw new Error(`UK mesh unexpectedly small: ${shops.length}`);
          if (kept.length < 2000) throw new Error(`Strict public gate still over-removes genuine branches: ${kept.length}/${shops.length}`);
          if (removed.length < 90) throw new Error(`Expected obvious map noise to be removed; only ${removed.length} rows excluded`);
          if (remainingNoise.length !== 0) throw new Error(`Obvious service noise remains after gate: ${remainingNoise.length}`);
          NODE

      - name: Inspect deterministic diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          for required in \
            signal-engine/src/encounters/local-radar-location-policy.mjs \
            signal-engine/src/encounters/canonical-retailer-locations.mjs \
            signal-engine/src/encounters/local-radar.mjs \
            signal-engine/src/encounters/local-radar-branch-persistence.mjs \
            signal-engine/tests/local-radar-location-policy.test.mjs \
            signal-engine/tests/local-radar-canonical-branches.test.mjs \
            signal-engine/tests/local-radar-location-quality-review.test.mjs; do
            printf '%s\n' "$changed" | grep -Fx "$required" >/dev/null
          done

      - name: Commit review checkpoint only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fatez"
          git config user.email "cdotkeeley@gmail.com"
          git add \
            signal-engine/src/encounters/local-radar-location-policy.mjs \
            signal-engine/src/encounters/canonical-retailer-locations.mjs \
            signal-engine/src/encounters/local-radar.mjs \
            signal-engine/src/encounters/local-radar-branch-persistence.mjs \
            signal-engine/tests/local-radar-location-policy.test.mjs \
            signal-engine/tests/local-radar-canonical-branches.test.mjs \
            signal-engine/tests/local-radar-location-quality-review.test.mjs
          git commit -m "fix(local-radar): gate fresh discovery without hiding real branches"
          git push origin HEAD:fix/local-radar-public-discovery-gate-2026-09-01
