name: OPS Cardmarket Derived Expansion Name Shape Diagnostic

on:
  push:
    branches:
      - feat/cardmarket-derived-expansion-exact-recovery-2026-09-12
    paths:
      - '.github/workflows/ops-cardmarket-derived-expansion-name-shape-diagnostic.yml'
      - 'signal-engine/src/trader/value/cardmarket-derived-expansion-name-shape-diagnostic-cli.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Diagnose Cardmarket name shapes
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          MAPPING_WRITE: 'false'
        run: node src/trader/value/cardmarket-derived-expansion-name-shape-diagnostic-cli.mjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-derived-expansion-name-shape-diagnostic
          path: ${{ runner.temp }}/cardmarket-derived-expansion-name-shape-diagnostic.json
          if-no-files-found: error
          retention-days: 14
