name: Cardmarket URL-First 361 Production Activation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cardmarket-url-first-361-production-activation.yml'
      - 'signal-engine/src/trader/value/cardmarket-url-first-mapping-release-cli.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cardmarket-url-first-361-production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json

      - run: npm ci

      - name: Download exact green rehearsal artifact
        uses: actions/download-artifact@v4
        with:
          name: cardmarket-url-first-rebuild
          path: ${{ runner.temp }}/url-first-rehearsal
          github-token: ${{ github.token }}
          repository: Fatez/Fatedrop-Cloud
          run-id: 34950577563

      - name: Install frozen strict cohort report
        working-directory: .
        run: |
          test -f "${{ runner.temp }}/url-first-rehearsal/cardmarket-url-first-tcggo-strict.json"
          cp "${{ runner.temp }}/url-first-rehearsal/cardmarket-url-first-tcggo-strict.json" "${{ runner.temp }}/cardmarket-url-first-tcggo-strict.json"

      - name: Persist exact 361 mapping cohort
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          EXPECTED_MAPPING_COUNT: '361'
          EXPECTED_MAPPING_DIGEST: 8e8e073eb17002c9b2f1357bfbed527e23a7188c0331634b6fb080506c16d3ec
          MAPPING_WRITE: 'true'
        run: node src/trader/value/cardmarket-url-first-mapping-release-cli.mjs

      - name: Ingest current Cardmarket prices for exact mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: persist
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs

      - name: Verify production residual and cohort pricing
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { Pool } from 'pg';

          const report = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cardmarket-url-first-tcggo-strict.json`, 'utf8'));
          const ids = report.safeMappings.map((row) => row.cardIdentityId);
          if (ids.length !== 361) throw new Error(`Frozen cohort count drifted: ${ids.length}`);

          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2 });
          try {
            const { rows: [residual] } = await pool.query(`
              SELECT
                COUNT(*)::int AS eligible,
                COUNT(*) FILTER (WHERE NOT EXISTS (
                  SELECT 1 FROM fatedrop_card_source_mappings m
                  WHERE m.source_name='cardmarket' AND m.card_identity_id=i.id
                ))::int AS unmapped
              FROM fatedrop_card_identities i
              JOIN fatedrop_card_printings p ON p.id=i.printing_id
              LEFT JOIN fatedrop_variant_resolution_state rs ON rs.card_identity_id=i.id
              WHERE i.verification_status='verified'
                AND i.language_code='en'
                AND i.variant_code IN ('standard','holo')
                AND COALESCE(rs.classifier_state,'ACTIVE_UNPRICED') NOT IN ('INVALID_CATALOGUE_ENTRY','UNRESOLVED_EVIDENCE')`);

            const { rows: [cohort] } = await pool.query(`
              SELECT
                COUNT(DISTINCT m.card_identity_id)::int AS mapped,
                COUNT(DISTINCT o.card_identity_id) FILTER (WHERE GREATEST(
                  COALESCE(o.market_price,0),COALESCE(o.trend_price,0),COALESCE(o.avg_1d,0),COALESCE(o.avg_7d,0),COALESCE(o.avg_30d,0)
                ) > 0)::int AS positively_priced
              FROM unnest($1::text[]) c(card_identity_id)
              LEFT JOIN fatedrop_card_source_mappings m
                ON m.card_identity_id=c.card_identity_id AND m.source_name='cardmarket'
              LEFT JOIN fatedrop_market_observations o
                ON o.card_identity_id=c.card_identity_id AND o.source_name='cardmarket'`, [ids]);

            if (Number(cohort.mapped) !== 361) throw new Error(`Cohort mapping verification failed: ${cohort.mapped}/361`);
            if (Number(residual.unmapped) !== 29) throw new Error(`Expected 29 unmapped residual identities, found ${residual.unmapped}`);
            if (Number(cohort.positively_priced) < 312) throw new Error(`Expected at least 312 priced cohort identities, found ${cohort.positively_priced}`);

            console.log(JSON.stringify({
              status: 'production_verified',
              eligible: Number(residual.eligible),
              unmappedResidual: Number(residual.unmapped),
              cohortMapped: Number(cohort.mapped),
              cohortPositivelyPriced: Number(cohort.positively_priced),
            }, null, 2));
          } finally {
            await pool.end();
          }
          NODE

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-url-first-361-production-activation
          path: |
            ${{ runner.temp }}/cardmarket-url-first-mapping-release.json
            ${{ runner.temp }}/cardmarket-production-cycle.json
          if-no-files-found: warn
          retention-days: 30
