name: Probe Entertainer Mega intel

on:
  push:
    branches:
      - intel/entertainer-mega-2026-09-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract embedded Entertainer Mega allocation data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://www.thetoyshop.com/pokemon-at-the-entertainer';
          const response = await fetch(url, { headers: { 'user-agent': 'FateDrop operator-intel verification/1.0', accept: 'text/html' } });
          const html = await response.text();
          console.log(JSON.stringify({status: response.status, finalUrl: response.url, bytes: html.length, fetchedAt: new Date().toISOString()}));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const probes = [
            /ascended.{0,2500}/gi,
            /mega\s+forces.{0,2500}/gi,
            /mega.{0,1200}/gi,
            /pokemon-at-the-entertainer.{0,1200}/gi,
          ];
          let hits = 0;
          for (const pattern of probes) {
            const values = [...new Set(html.match(pattern) || [])].slice(0, 30);
            hits += values.length;
            console.log(`PATTERN_${pattern}=` + JSON.stringify(values));
          }
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          console.log('SCRIPT_COUNT=' + scripts.length);
          for (let i = 0; i < scripts.length; i += 1) {
            if (/ascended|mega\s+forces|pokemon-at-the-entertainer/i.test(scripts[i])) {
              console.log(`SCRIPT_${i}=` + JSON.stringify(scripts[i].slice(0, 30000)));
              hits += 1;
            }
          }
          if (!hits) throw new Error('No Mega allocation evidence found in live response');
          NODE
