name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read
  statuses: write

jobs:
  runtime-local-radar-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed runtime, Local Radar and easy branch sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://fatedrop-cloud-production.up.railway.app"
          FATE_JSON="$(curl --fail --silent --show-error --max-time 20 -X POST "$BASE/api/fatefind/matches" -H 'content-type: application/json' --data '{"mode":"verdict","query":"Mega Dream Japanese"}')"
          RUNTIME_SHA="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(String(d?.runtime?.gitCommitSha||"unknown"))' "$FATE_JSON")"
          RADAR_JSON="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/local-radar?lat=51.761&lng=-0.010&radiusMiles=25&tcg=pokemon&types=shops")"
          SHOPS="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(String(d?.counts?.shops??d?.shops?.length??0))' "$RADAR_JSON")"
          BRANCH_STATUS="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(String(d?.providers?.branchIdentity?.status||"unknown"))' "$RADAR_JSON")"
          PLACES_STATUS="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(String(d?.providers?.shops?.status||"unknown"))' "$RADAR_JSON")"
          TOY_FILE="$(mktemp)"
          TOY_HTTP="$(curl --silent --show-error --max-time 20 -L -o "$TOY_FILE" -w '%{http_code}' 'https://www.thetoyshop.com/sitemap/media/Store-en-GBP' || true)"
          TOY_BYTES="$(wc -c < "$TOY_FILE" | tr -d ' ')"
          TOY_LOCS="$(grep -o '<loc>' "$TOY_FILE" | wc -l | tr -d ' ')"
          ARGOS_FILE="$(mktemp)"
          ARGOS_HTTP="$(curl --silent --show-error --max-time 20 -L -o "$ARGOS_FILE" -w '%{http_code}' 'https://www.argos.co.uk/stores/' || true)"
          ARGOS_BYTES="$(wc -c < "$ARGOS_FILE" | tr -d ' ')"
          post_status() {
            local context="$1" description="$2"
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"success\",\"context\":\"${context}\",\"description\":\"${description}\"}" >/dev/null
          }
          post_status "local-radar-runtime-proof/runtime" "runtime=${RUNTIME_SHA:0:12}"
          post_status "local-radar-runtime-proof/radar" "shops=${SHOPS};branch=${BRANCH_STATUS};places=${PLACES_STATUS}"
          post_status "local-radar-runtime-proof/sources" "toy=${TOY_HTTP}/${TOY_BYTES}b/${TOY_LOCS}loc;argos=${ARGOS_HTTP}/${ARGOS_BYTES}b"

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
