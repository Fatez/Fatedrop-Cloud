name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read
  statuses: write

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test

  local-radar-production-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production Local Radar provider status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          url='https://fatedrop-cloud-production.up.railway.app/api/local-radar?lat=51.5074&lng=-0.1278&radiusMiles=10&types=shops&tcg=pokemon'
          http_status="$(curl --silent --show-error --max-time 25 --output response.json --write-out '%{http_code}' "$url" || true)"

          if jq -e . response.json >/dev/null 2>&1; then
            places="$(jq -r '.providers.shops.status // "missing"' response.json)"
            branch="$(jq -r '(.providers.branchIdentity.status // "missing") + ":saved=" + ((.providers.branchIdentity.saved // 0)|tostring)' response.json)"
            smyths="$(jq -r '(.providers.smythsLocalStock.status // "missing") + ":branches=" + ((.providers.smythsLocalStock.branchesDiscovered // 0)|tostring) + ":obs=" + ((.providers.smythsLocalStock.observationsSaved // 0)|tostring)' response.json)"
            localstock="$(jq -r '.providers.localStock.status // "missing"' response.json)"
            counts="$(jq -r '"shops=" + ((.counts.shops // 0)|tostring) + ":in=" + ((.counts.localInStockBranches // 0)|tostring) + ":incoming=" + ((.counts.incomingWatchBranches // 0)|tostring)' response.json)"
          else
            places="no-json"
            branch="no-json"
            smyths="no-json"
            localstock="no-json"
            counts="no-json"
          fi

          post_status () {
            local context="$1"
            local description="$2"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="local-radar-probe/${context}" \
              -f description="${description:0:140}" >/dev/null
          }

          post_status http "HTTP ${http_status}"
          post_status places "$places"
          post_status branch "$branch"
          post_status smyths "$smyths"
          post_status localstock "$localstock"
          post_status counts "$counts"
