name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test

  local-radar-production-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production Local Radar provider status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://fatedrop-cloud-production.up.railway.app/api/local-radar?lat=51.5074&lng=-0.1278&radiusMiles=10&types=shops&tcg=pokemon'
          http_status="$(curl --silent --show-error --max-time 25 --output response.json --write-out '%{http_code}' "$url" || true)"
          {
            echo '### Disposable Local Radar production source probe'
            echo
            echo "HTTP: ${http_status}"
            echo
            echo '```json'
            head -c 30000 response.json 2>/dev/null || true
            echo
            echo '```'
          } > probe.md
          gh pr comment "$PR_NUMBER" --body-file probe.md
          test "$http_status" = '200'
