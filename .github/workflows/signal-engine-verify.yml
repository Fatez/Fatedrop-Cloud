name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  # Engineering branches intentionally run the same release gate as pull requests.
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  local-radar-branch-sync-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Expose official Toyshop/Tesco fetch status
        run: |
          node --input-type=module <<'NODE'
          const urls = [
            'https://www.thetoyshop.com/store/watford',
            'https://www.thetoyshop.com/store/birmingham',
            'https://www.thetoyshop.com/store/tesco-newcastle-upon-tyne-extra',
            'https://www.thetoyshop.com/sitemap/media/Store-en-GBP',
          ];
          const results = [];
          for (const url of urls) {
            try {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 12000);
              const response = await fetch(url, {
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,text/xml;q=0.8,*/*;q=0.5',
                  'user-agent': 'FateDrop-LocalRadar/1.0 (+https://fatedrop.co.uk)',
                },
              });
              clearTimeout(timer);
              const body = await response.text();
              results.push({
                url,
                status: response.status,
                ok: response.ok,
                finalUrl: response.url,
                contentType: response.headers.get('content-type'),
                bytes: body.length,
                prefix: body.slice(0, 160).replace(/\s+/g, ' '),
              });
            } catch (error) {
              results.push({ url, error: String(error?.message || error) });
            }
          }
          console.log('LOCAL_RADAR_TOYSHOP_HTTP_DIAGNOSTIC');
          console.log(JSON.stringify(results, null, 2));
          NODE

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
