name: Local Radar Smyths Snapshot

on:
  pull_request:
    paths:
      - "signal-engine/tmp/snapshot-smyths.mjs"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: write

jobs:
  smyths-snapshot:
    if: github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/local-radar-branch-sync-proof-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe deployed Local Radar providers
        run: |
          set -euo pipefail
          BASE="https://fatedrop-cloud-production.up.railway.app"
          BODY="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/local-radar?lat=51.761&lng=-0.010&radiusMiles=25&tcg=pokemon&types=shops")"
          node -e 'const d=JSON.parse(process.argv[1]); console.log(JSON.stringify({counts:d.counts,providers:d.providers,shopSample:(d.shops||[]).slice(0,5).map(s=>({name:s.name,retailerId:s.retailerId,provider:s.provider,postcode:s.postcode,localStockStatus:s.localStockStatus}))},null,2))' "$BODY"
      - name: Generate official Smyths branch snapshot
        working-directory: signal-engine
        run: node tmp/snapshot-smyths.mjs
      - name: Commit generated snapshot
        run: |
          git config user.name "FateDrop Ops"
          git config user.email "ops@fatedrop.co.uk"
          git add signal-engine/tmp/smyths-branches.generated.json
          git commit -m "Ops: generate Smyths branch snapshot" || exit 0
          git push origin HEAD:ops/local-radar-branch-sync-proof-20260826
