name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  # Engineering branches intentionally run the same release gate as pull requests.
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  local-radar-branch-sync-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Probe three official Toyshop/Tesco pages with production parser
        run: |
          node --input-type=module <<'NODE'
          import {
            crawlToyshopOfficialStoreGraph,
            parseOfficialBranchPage,
          } from './src/encounters/national-branch-directory-sync.mjs';

          const seeds = [
            'https://www.thetoyshop.com/store/watford',
            'https://www.thetoyshop.com/store/birmingham',
            'https://www.thetoyshop.com/store/tesco-newcastle-upon-tyne-extra',
          ];
          const rows = await crawlToyshopOfficialStoreGraph({
            seeds,
            discoveryLimit: 3,
            concurrency: 3,
          });
          const parsed = [];
          for (const row of rows) {
            try {
              const result = await parseOfficialBranchPage(row);
              parsed.push({
                url: row.url,
                retailerId: row.retailerId,
                htmlBytes: row.html?.length ?? 0,
                location: result.location ? {
                  retailerId: result.location.retailerId,
                  provider: result.location.provider,
                  name: result.location.name,
                  postcode: result.location.postcode,
                  latitude: result.location.latitude,
                  longitude: result.location.longitude,
                } : null,
                reason: result.reason,
              });
            } catch (error) {
              parsed.push({ url: row.url, retailerId: row.retailerId, error: String(error?.message || error) });
            }
          }
          console.log('LOCAL_RADAR_TOYSHOP_PARSER_DIAGNOSTIC');
          console.log(JSON.stringify({ discovered: rows.length, parsed }, null, 2));
          NODE

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
