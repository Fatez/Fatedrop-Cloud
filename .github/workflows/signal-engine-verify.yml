name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  local-radar-branch-sync-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Verify Total Cards sources from cloud runner
        run: |
          node --input-type=module <<'NODE'
          const urls = [
            'https://totalcards.net/pages/we-buy-any-cards',
            'https://totalcards.net/products/pokemon-mega-evolution-perfect-order-booster-pack',
            'https://api.postcodes.io/postcodes/DL5%206BF',
          ];
          const results = [];
          for (const url of urls) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  accept: 'text/html,application/json;q=0.9,*/*;q=0.5',
                  'user-agent': 'FateDrop-LocalRadar/1.0 (+https://fatedrop.co.uk)',
                },
              });
              const body = await response.text();
              results.push({
                url,
                status: response.status,
                ok: response.ok,
                finalUrl: response.url,
                bytes: body.length,
                hasGamingCentre: /Total Cards Gaming Centre/i.test(body),
                hasPostcode: /DL5\s*6BF/i.test(body),
                hasPickupOnly: /Pickup Only/i.test(body),
                hasAvailableInStore: /Available to buy in-store/i.test(body),
                hasSoldOut: /Sold out/i.test(body),
                prefix: body.slice(0, 120).replace(/\s+/g, ' '),
              });
            } catch (error) {
              results.push({ url, error: `${error?.name || ''}: ${error?.message || error}` });
            } finally {
              clearTimeout(timer);
            }
          }
          console.log('LOCAL_RADAR_TOTAL_CARDS_FETCH_DIAGNOSTIC');
          console.log(JSON.stringify(results, null, 2));
          NODE

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
