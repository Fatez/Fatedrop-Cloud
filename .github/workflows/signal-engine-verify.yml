name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  # Engineering branches intentionally run the same release gate as pull requests.
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  local-radar-branch-sync-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Diagnose current OSM Overpass fallback
        run: |
          node --input-type=module <<'NODE'
          import { buildKnownChainOverpassQuery } from './src/encounters/osm-retailer-branch-sync.mjs';

          const endpoint = 'https://overpass-api.de/api/interpreter';
          const smallQuery = `[out:json][timeout:20];(nwr["brand"~"^(Tesco|Argos|The Entertainer|Smyths Toys.*)$",i](around:25000,51.5074,-0.1278);nwr["name"~"^(Tesco|Tesco Extra|Tesco Superstore|Argos.*|The Entertainer.*|Smyths Toys.*)$",i](around:25000,51.5074,-0.1278););out center tags 100;`;
          const queries = [
            ['small_london', smallQuery, 30000],
            ['current_national', buildKnownChainOverpassQuery(), 80000],
          ];
          const results = [];

          for (const [label, query, timeoutMs] of queries) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const started = Date.now();
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  accept: 'application/json',
                  'content-type': 'application/x-www-form-urlencoded;charset=UTF-8',
                  'user-agent': 'FateDrop-LocalRadar/1.0 (+https://fatedrop.co.uk)',
                },
                body: new URLSearchParams({ data: query }).toString(),
              });
              const body = await response.text();
              let elementCount = null;
              try { elementCount = JSON.parse(body)?.elements?.length ?? null; } catch {}
              results.push({
                label,
                status: response.status,
                ok: response.ok,
                elapsedMs: Date.now() - started,
                contentType: response.headers.get('content-type'),
                bytes: body.length,
                elementCount,
                prefix: body.slice(0, 220).replace(/\s+/g, ' '),
              });
            } catch (error) {
              results.push({ label, elapsedMs: Date.now() - started, error: String(error?.name || '') + ': ' + String(error?.message || error) });
            } finally {
              clearTimeout(timer);
            }
          }
          console.log('LOCAL_RADAR_OVERPASS_DIAGNOSTIC');
          console.log(JSON.stringify(results, null, 2));
          NODE

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
