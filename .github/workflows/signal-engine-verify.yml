name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  local-radar-branch-sync-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/local-radar-branch-sync-proof-20260826'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Test cheap exact-brand OSM queries
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://overpass.private.coffee/api/interpreter';
          const brands = ['Tesco', 'Argos', 'The Entertainer', 'Smyths Toys Superstores', 'Smyths Toys'];
          const results = [];

          for (const brand of brands) {
            const query = `[out:json][timeout:25];area["ISO3166-1"="GB"][boundary=administrative]->.uk;nwr["brand"="${brand}"](area.uk);out center tags;`;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 35000);
            const started = Date.now();
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                redirect: 'follow',
                signal: controller.signal,
                headers: {
                  accept: 'application/json',
                  'content-type': 'application/x-www-form-urlencoded;charset=UTF-8',
                  'user-agent': 'FateDrop-LocalRadar/1.0 (+https://fatedrop.co.uk)',
                },
                body: new URLSearchParams({ data: query }).toString(),
              });
              const body = await response.text();
              let payload = null;
              try { payload = JSON.parse(body); } catch {}
              results.push({ brand, status: response.status, ok: response.ok, elapsedMs: Date.now() - started, bytes: body.length, elementCount: payload?.elements?.length ?? null, sample: (payload?.elements || []).slice(0, 3).map((e) => ({ type: e.type, id: e.id, name: e.tags?.name, postcode: e.tags?.['addr:postcode'] })) });
            } catch (error) {
              results.push({ brand, elapsedMs: Date.now() - started, error: `${error?.name || ''}: ${error?.message || error}` });
            } finally {
              clearTimeout(timer);
            }
          }
          console.log('LOCAL_RADAR_EXACT_BRAND_OVERPASS_DIAGNOSTIC');
          console.log(JSON.stringify(results, null, 2));
          NODE

  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
