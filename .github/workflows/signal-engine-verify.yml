name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  # Engineering branches intentionally run the same release gate as pull requests.
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test

  production-contract-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed public signal contracts and private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fatedrop-cloud-production.up.railway.app"

          curl --fail --silent --show-error --retry 4 --retry-delay 5 \
            "$BASE/api/signals?limit=1" -o /tmp/signals.json
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/signals.json", "utf8"));
            if (body.contractVersion !== 1) throw new Error(`signals contractVersion=${body.contractVersion}`);
            if (body.source !== "FATEDROP_CLOUD") throw new Error(`signals source=${body.source}`);
            if (body.success !== true) throw new Error(`signals success=${body.success}`);
          '

          curl --fail --silent --show-error --retry 4 --retry-delay 5 \
            "$BASE/api/signal-summary" -o /tmp/summary.json
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/summary.json", "utf8"));
            if (body.contractVersion !== 1) throw new Error(`summary contractVersion=${body.contractVersion}`);
            if (body.source !== "FATEDROP_CLOUD") throw new Error(`summary source=${body.source}`);
            if (body.success !== true || body.available !== true) {
              throw new Error(`summary unavailable success=${body.success} available=${body.available}`);
            }
          '

          status="$(curl --silent --show-error --output /tmp/signal-health.json --write-out '%{http_code}' \
            "$BASE/api/signal-health")"
          test "$status" = "401" || { echo "expected /api/signal-health anonymous 401, got $status"; cat /tmp/signal-health.json; exit 1; }

  web-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed Web dashboard and App gateway routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fatedrop.co.uk"
          EMAIL="p0-smoke-20260827-0256@fatedrop.invalid"
          PASSWORD="P0-$(openssl rand -hex 18)-Aa9!"
          export EMAIL PASSWORD

          node -e '
            const fs = require("fs");
            fs.writeFileSync("/tmp/register.json", JSON.stringify({
              displayName: "P0 Smoke",
              email: process.env.EMAIL,
              password: process.env.PASSWORD,
            }));
          '

          register_status="$(curl --silent --show-error --location \
            --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
            -H "Origin: $BASE" -H "Content-Type: application/json" \
            --data-binary @/tmp/register.json \
            --output /tmp/register-response.json --write-out '%{http_code}' \
            "$BASE/api/auth/register")"
          test "$register_status" = "201" || { echo "register expected 201, got $register_status"; cat /tmp/register-response.json; exit 1; }

          signals_status="$(curl --silent --show-error --location \
            --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt \
            --output /tmp/dashboard-signals.json --write-out '%{http_code}' \
            "$BASE/api/dashboard/signals")"
          test "$signals_status" = "200" || { echo "dashboard signals expected 200, got $signals_status"; cat /tmp/dashboard-signals.json; exit 1; }
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/dashboard-signals.json", "utf8"));
            if (body.available !== true) throw new Error(`dashboard signal ledger unavailable: ${JSON.stringify(body)}`);
            if (body.source !== "FateDrop signal ledger") throw new Error(`unexpected dashboard signal source=${body.source}`);
            if (!Array.isArray(body.signals)) throw new Error("dashboard signals is not an array");
          '

          dashboard_status="$(curl --silent --show-error --location \
            --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt \
            --output /tmp/dashboard.html --write-out '%{http_code}' \
            "$BASE/dashboard")"
          test "$dashboard_status" = "200" || { echo "dashboard expected 200, got $dashboard_status"; exit 1; }
          grep -q "Signals Overview" /tmp/dashboard.html || { echo "dashboard missing Signals Overview"; exit 1; }
          if grep -q "Signal ledger unavailable" /tmp/dashboard.html; then echo "dashboard still reports Signal ledger unavailable"; exit 1; fi
          if grep -q "Alert delivery ledger unavailable" /tmp/dashboard.html; then echo "dashboard still reports Alert delivery ledger unavailable"; exit 1; fi

          for path in \
            "/api/mobile/session" \
            "/api/mobile/alerts" \
            "/api/trader/cards?q=Furret&limit=1" \
            "/dashboard/trader" \
            "/dashboard/stores" \
            "/dashboard/local-radar"; do
            safe_name="$(printf '%s' "$path" | tr '/?=&' '_____')"
            status="$(curl --silent --show-error --location \
              --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt \
              --output "/tmp/${safe_name}.out" --write-out '%{http_code}' \
              "$BASE$path")"
            case "$status" in
              2??) ;;
              *) echo "$path expected 2xx, got $status"; cat "/tmp/${safe_name}.out"; exit 1 ;;
            esac
          done
