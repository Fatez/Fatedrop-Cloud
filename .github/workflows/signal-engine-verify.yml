name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  # Engineering branches intentionally run the same release gate as pull requests.
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Capture RRP v3 diagnostics
        run: |
          set +e
          node --test tests/canonical-rrp-registry.test.mjs tests/rrp-learning-reconcile.test.mjs tests/rrp-learning-store.test.mjs > "$RUNNER_TEMP/rrp-v3-test-output.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/rrp-v3-test-output.txt"
          echo "Targeted RRP diagnostic exit code: $code"
          exit 0
      - name: Upload RRP v3 diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrp-v3-diagnostic
          path: ${{ runner.temp }}/rrp-v3-test-output.txt
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test
