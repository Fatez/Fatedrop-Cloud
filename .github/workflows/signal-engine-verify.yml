name: Verify FateDrop Cloud Release Candidate

on:
  pull_request:
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"
  push:
    branches:
      - main
    paths:
      - "signal-engine/**"
      - "collectors/pokemon-center-browser/**"
      - ".github/workflows/signal-engine-verify.yml"

permissions:
  contents: read
  statuses: write

jobs:
  signal-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - name: Install Signal Engine dependencies
        run: npm ci
      - name: Audit Signal Engine production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete Signal Engine tests
        run: npm test

  pokemon-center-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors/pokemon-center-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install collector dependencies
        run: npm install --ignore-scripts
      - name: Audit collector production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run collector tests
        run: npm test

  smyths-storefinder-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official public branch detail without bypassing protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          base='https://www.smythstoys.com'
          ua='Mozilla/5.0 FateDrop/1.0 (+https://fatedrop.co.uk)'
          status="$(curl --silent --show-error --location --max-time 25 --user-agent "$ua" --output detail.html --write-out '%{http_code}' "$base/uk/en-gb/storefinder/storedetails/stevenage" || true)"
          bytes="$(wc -c < detail.html 2>/dev/null | tr -d ' ' || echo 0)"
          postcodes="$(grep -Eo '\b[A-Z]{1,2}[0-9][0-9A-Z]?[[:space:]]?[0-9][A-Z]{2}\b' detail.html 2>/dev/null | sort -u | paste -sd ',' - || true)"
          addressHit="$(grep -Eio 'Roaring Meg|Great North Road|Stevenage' detail.html 2>/dev/null | sort -u | paste -sd ',' - || true)"
          coords="$(grep -Eio 'latitude|longitude|data-lat|data-lng|\"lat\"|\"lng\"' detail.html 2>/dev/null | sort -u | paste -sd ',' - || true)"
          scripts="$(grep -Eo '<script[^>]+src=["'"'][^"'"']+' detail.html 2>/dev/null | sed -E 's/.*src=["'"']//g' | head -n 3 | paste -sd ',' - || true)"
          challenge="$(grep -Eio 'captcha|access denied|challenge-platform|cf-chl|akamai|perimeterx|px-captcha' detail.html 2>/dev/null | head -n 1 || true)"

          post_status () {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="smyths-detail-probe/$1" \
              -f description="${2:0:140}" >/dev/null
          }
          post_status http "HTTP=${status};bytes=${bytes};challenge=${challenge:-none}"
          post_status address "postcode=${postcodes:-none};addressTokens=${addressHit:-none}"
          post_status coords "coordTokens=${coords:-none}"
          post_status scripts "scripts=${scripts:-none}"
