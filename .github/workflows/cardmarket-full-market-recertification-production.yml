name: Cardmarket Full English Market Recertification Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cardmarket-full-market-recertification-production.yml'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-release-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-full-market-recertification-verify-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-reverse-public-market.mjs'
      - 'signal-engine/src/trader/value/cardmarket-reverse-public-cycle-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-rebuild.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-rebuild-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-tcggo-full-cli.mjs'
      - 'signal-engine/src/trader/value/cardmarket-url-first-tcggo-strict-validate.mjs'
      - 'signal-engine/src/trader/value/provider-policy.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardmarket-full-english-recertification-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci

      - name: Rebuild simple deterministic market model from live production truth
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-url-first-rebuild-cli.mjs

      - name: Fail closed on simple-model source collisions
        run: node src/trader/value/cardmarket-url-first-rebuild-validate.mjs

      - name: Resolve only the residual through exact-ID fallback
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-url-first-tcggo-full-cli.mjs

      - name: Strictly validate fallback product identity
        run: node src/trader/value/cardmarket-url-first-tcggo-strict-validate.mjs

      - name: Build complete English-market reconciliation including reverse mappings
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-full-market-recertification-simple-cli.mjs

      - name: Persist exact mappings, URLs and provenance transactionally
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          MAPPING_WRITE: 'true'
        run: node src/trader/value/cardmarket-full-market-recertification-release-cli.mjs

      - name: Refresh standard and holo Cardmarket guide pricing
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_MODE: persist
        run: node src/trader/value/cardmarket-production-cycle-cli.mjs

      - name: Price reverse holos from the same certified public product URLs
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          CARDMARKET_REVERSE_MODE: persist
          CARDMARKET_REVERSE_CONCURRENCY: '2'
          CARDMARKET_REVERSE_REQUEST_DELAY_MS: '300'
          CARDMARKET_REVERSE_MIN_OFFERS: '3'
        run: node src/trader/value/cardmarket-reverse-public-cycle-cli.mjs

      - name: Verify every certified mapping and every deterministic guide lane
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-full-market-recertification-verify-cli.mjs

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-full-market-recertification-production
          path: |
            ${{ runner.temp }}/cardmarket-url-first-rebuild.json
            ${{ runner.temp }}/cardmarket-url-first-tcggo-full.json
            ${{ runner.temp }}/cardmarket-url-first-tcggo-strict.json
            ${{ runner.temp }}/cardmarket-full-market-recertification.json
            ${{ runner.temp }}/cardmarket-full-market-recertification-release.json
            ${{ runner.temp }}/cardmarket-production-cycle.json
            ${{ runner.temp }}/cardmarket-reverse-public-cycle.json
            ${{ runner.temp }}/cardmarket-full-market-recertification-verify.json
          if-no-files-found: warn
          retention-days: 30
