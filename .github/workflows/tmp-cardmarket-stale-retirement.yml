name: TEMP Cardmarket Stale Retirement Persist

on:
  push:
    branches:
      - ops/cardmarket-stale-retirement-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact merged base and workflow-only diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bd391bc90185dfd1f417dc443428e6ca397ab576 HEAD
          test -z "$(git diff --name-only bd391bc90185dfd1f417dc443428e6ca397ab576..HEAD | grep -v '^.github/workflows/tmp-cardmarket-stale-retirement.yml$' || true)"
      - name: Check out pinned TCGdex evidence
        uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Execute transactional reviewed retirement
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          CORRECTION_WRITE: 'true'
        run: node src/trader/value/cardmarket-reviewed-stale-variant-retirement-cli.mjs
      - name: Verify exact correction outcome
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          import { REVIEWED_BASELINE_HOLO_PRODUCT_IDS, REVIEWED_STALE_VARIANT_RETIREMENTS } from './src/trader/value/cardmarket-reviewed-stale-variant-retirement.mjs';
          const audit = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cardmarket-reviewed-stale-variant-retirement.json`, 'utf8'));
          if (audit.status !== 'write_complete' || audit.productionWrites !== true) throw new Error('retirement did not persist');
          if (audit.persistence?.retiredMappings !== 58) throw new Error(`expected 58 retired mappings, got ${audit.persistence?.retiredMappings}`);
          if (audit.persistence?.deletedObservations !== 4) throw new Error(`expected 4 deleted stale observations, got ${audit.persistence?.deletedObservations}`);
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2 });
          try {
            const ids = REVIEWED_STALE_VARIANT_RETIREMENTS.map((row) => row.mappingId);
            const gone = await pool.query(`SELECT COUNT(*)::int AS count FROM fatedrop_card_source_mappings WHERE id=ANY($1::text[])`, [ids]);
            if (gone.rows[0].count !== 0) throw new Error(`${gone.rows[0].count} reviewed stale mappings remain`);
            const base = await pool.query(`SELECT source_record_id,COUNT(*)::int AS owners,
                COUNT(*) FILTER (WHERE source_variant_key='holo')::int AS holo_owners,
                COUNT(*) FILTER (WHERE source_variant_key='normal')::int AS normal_owners
              FROM fatedrop_card_source_mappings
              WHERE source_name='cardmarket' AND source_record_id=ANY($1::text[])
              GROUP BY source_record_id ORDER BY source_record_id`, [REVIEWED_BASELINE_HOLO_PRODUCT_IDS]);
            if (base.rows.length !== 42 || base.rows.some((r) => r.owners !== 1 || r.holo_owners !== 1 || r.normal_owners !== 0)) throw new Error('reviewed baseline ownership is not exactly one holo owner per product');
            const conflicts = await pool.query(`SELECT source_record_id,source_variant_key,card_identity_id FROM fatedrop_card_source_mappings WHERE source_name='cardmarket' AND source_record_id=ANY($1::text[]) ORDER BY source_record_id,source_variant_key`, [['568801','760792']]);
            if (conflicts.rows.length !== 2 || conflicts.rows.some((r) => r.source_variant_key !== 'holo')) throw new Error('568801/760792 were not reduced to their exact holo owners');
            const report = { retiredMappings: 58, deletedObservations: 4, baselineProductsVerified: 42, heldPolicyProductsNowHoloOnly: conflicts.rows };
            console.log(JSON.stringify(report));
            await writeFile(`${process.env.RUNNER_TEMP}/cardmarket-stale-retirement-production-verification.json`, JSON.stringify(report, null, 2));
          } finally { await pool.end(); }
          NODE
      - name: Run canonical residual audit after correction
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        run: node src/trader/value/cardmarket-residual-price-audit-cli.mjs
      - name: Print canonical residual counts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const r = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/cardmarket-residual-price-audit.json`, 'utf8'));
          console.log(JSON.stringify({ counts:r.counts, classes:r.classes }));
          NODE
      - name: Upload production verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-stale-retirement-production-verification
          path: |
            ${{ runner.temp }}/cardmarket-reviewed-stale-variant-retirement.json
            ${{ runner.temp }}/cardmarket-stale-retirement-production-verification.json
            ${{ runner.temp }}/cardmarket-residual-price-audit.json
          if-no-files-found: error
          retention-days: 14
