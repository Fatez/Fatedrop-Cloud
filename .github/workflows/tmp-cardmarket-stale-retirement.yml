name: TEMP Cardmarket Post-Correction Evidence Freeze

on:
  push:
    branches:
      - ops/cardmarket-stale-retirement-2026-09-12

permissions:
  contents: read

concurrency:
  group: fateprice-cardmarket-daily-ingest
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact merged base and workflow-only diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bd391bc90185dfd1f417dc443428e6ca397ab576 HEAD
          test -z "$(git diff --name-only bd391bc90185dfd1f417dc443428e6ca397ab576..HEAD | grep -v '^.github/workflows/tmp-cardmarket-stale-retirement.yml$' || true)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Freeze exact 42-card post-correction mapping digest and confirm 91 admission
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { Pool } from 'pg';
          import { REVIEWED_BASELINE_HOLO_PRODUCT_IDS } from './src/trader/value/cardmarket-reviewed-stale-variant-retirement.mjs';
          import { REVIEWED_EXPLICIT_HOLO_BASE_LANE_PRODUCT_IDS } from './src/trader/value/cardmarket-reviewed-explicit-holo-base-lane.mjs';
          import { fetchCardmarketPokemonPriceGuide } from './src/trader/value/cardmarket-source-client.mjs';
          import { listVerifiedPriceCapableCardmarketProductIds, scopeCardmarketPriceGuideToMappedProducts } from './src/trader/value/cardmarket-market-cycle.mjs';
          import { collectCurrentGuideInherentHoloBaseLaneEligibleProductIds, createCardmarketBatchExactMappingResolution } from './src/trader/value/cardmarket-daily-ingest.mjs';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2 });
          const store = { pool: async () => pool };
          const line = (r) => [r.id,r.card_identity_id,String(r.source_record_id),r.source_variant_key,r.canonical_variant_code,r.language_code,r.verification_status].join('|');
          try {
            const { rows } = await pool.query(`SELECT m.id,m.card_identity_id,m.source_record_id,m.source_variant_key,
                i.variant_code AS canonical_variant_code,i.language_code,i.verification_status
              FROM fatedrop_card_source_mappings m
              JOIN fatedrop_card_identities i ON i.id=m.card_identity_id
              WHERE m.source_name='cardmarket' AND m.source_record_id=ANY($1::text[])
              ORDER BY m.source_record_id,m.id`, [REVIEWED_BASELINE_HOLO_PRODUCT_IDS]);
            if (rows.length !== 42) throw new Error(`expected 42 exact mapping rows, got ${rows.length}`);
            if (new Set(rows.map((r)=>String(r.source_record_id))).size !== 42) throw new Error('42-card source IDs are not unique');
            if (rows.some((r)=>r.source_variant_key!=='holo'||r.canonical_variant_code!=='holo'||r.language_code!=='en'||r.verification_status!=='verified')) throw new Error('42-card mapping shape drifted');
            const digest = createHash('sha256').update([...rows].sort((a,b)=>String(a.source_record_id).localeCompare(String(b.source_record_id))).map(line).join('\n')).digest('hex');

            const source = await fetchCardmarketPokemonPriceGuide();
            const mapped = await listVerifiedPriceCapableCardmarketProductIds(store);
            const scoped = scopeCardmarketPriceGuideToMappedProducts(source.artifact.payload, mapped);
            const eligible = collectCurrentGuideInherentHoloBaseLaneEligibleProductIds(scoped);
            const resolution = await createCardmarketBatchExactMappingResolution(store, new Set(scoped.priceGuides.map((row)=>String(row?.idProduct??''))), { inherentHoloBaseLaneEligibleProductIds: eligible });
            const policy91 = new Set(REVIEWED_EXPLICIT_HOLO_BASE_LANE_PRODUCT_IDS.map(String));
            const admitted91 = [...resolution.inherentHoloBaseLaneProductIds].filter((id)=>policy91.has(String(id))).sort();
            if (admitted91.length !== 91) throw new Error(`expected all 91 reviewed products admitted after correction, got ${admitted91.length}`);

            const guide42 = scoped.priceGuides.filter((row)=>REVIEWED_BASELINE_HOLO_PRODUCT_IDS.includes(String(row?.idProduct??'')));
            const report = {
              mappingCount: rows.length,
              productCount: REVIEWED_BASELINE_HOLO_PRODUCT_IDS.length,
              mappingDigest: digest,
              admittedExisting91: admitted91.length,
              guide42Rows: guide42.length,
              guideSha256: source.artifact.sha256,
              rows,
            };
            console.log(JSON.stringify({mappingCount:report.mappingCount,productCount:report.productCount,mappingDigest:report.mappingDigest,admittedExisting91:report.admittedExisting91,guide42Rows:report.guide42Rows,guideSha256:report.guideSha256}));
            if (guide42.length !== 42) throw new Error(`expected all 42 retained products in scoped guide, got ${guide42.length}`);
            await writeFile(`${process.env.RUNNER_TEMP}/cardmarket-post-correction-42-evidence.json`, JSON.stringify(report,null,2));
          } finally { await pool.end(); }
          NODE
      - name: Upload frozen evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardmarket-post-correction-42-evidence
          path: ${{ runner.temp }}/cardmarket-post-correction-42-evidence.json
          if-no-files-found: error
          retention-days: 14
