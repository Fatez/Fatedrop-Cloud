name: Legacy Cardmarket Unique Base Audit
on:
  push:
    branches: [audit/cardmarket-legacy-unique-base-2026-09-12]
    paths:
      - '.github/workflows/legacy-cardmarket-unique-base-audit.yml'
      - 'signal-engine/src/trader/value/cardmarket-legacy-unique-base-audit-cli.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: signal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tcgdex/cards-database
          ref: 5b6a2859f454972477a9953ffe5cb554d24c45e9
          path: _evidence/tcgdex-cards-database
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signal-engine/package-lock.json
      - run: npm ci
      - name: Run read-only unique-base audit
        env:
          DATABASE_URL: ${{ secrets.FATEPRICE_PRODUCTION_DATABASE_URL }}
          TCGDEX_REPO: ${{ github.workspace }}/_evidence/tcgdex-cards-database
          TCGDEX_REVISION: 5b6a2859f454972477a9953ffe5cb554d24c45e9
        run: node src/trader/value/cardmarket-legacy-unique-base-audit-cli.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-legacy-unique-base-audit
          path: ${{ runner.temp }}/cardmarket-legacy-unique-base-audit.json
          if-no-files-found: error
          retention-days: 14
