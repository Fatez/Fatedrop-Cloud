name: Diagnose Card Collective Live Price Stock

on:
  push:
    branches:
      - diag/card-collective-live-price-stock-2026-08-30

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare Shopify GB and CA presentment markets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://card-collective.com/collections/pokemon-tcg/products.json?limit=250&page=1'
          CLOUD='https://fatedrop-cloud-production.up.railway.app/api/catalogue?retailer=card-collective&q=Terastal%20Grand%20Gathering&limit=25'
          curl --fail --silent --show-error --location --retry 3 "${BASE}&country=GB" -o /tmp/gb.json
          curl --fail --silent --show-error --location --retry 3 "${BASE}&country=CA" -o /tmp/ca.json
          curl --fail --silent --show-error --location --retry 3 "${BASE}&country=US" -o /tmp/us.json
          curl --fail --silent --show-error --location --retry 3 "$CLOUD" -o /tmp/cloud.json

          node <<'NODE'
          const fs = require('fs');
          const wanted = new Set(['58272935772541','58272935805309']);
          function rows(file) {
            const payload = JSON.parse(fs.readFileSync(file,'utf8'));
            const out=[];
            for (const p of payload.products || []) for (const v of p.variants || []) if (wanted.has(String(v.id||''))) out.push({sku:String(v.id),price:v.price,available:v.available});
            return out;
          }
          const cloud=JSON.parse(fs.readFileSync('/tmp/cloud.json','utf8'));
          const canonical=(cloud.products||[]).filter((p)=>wanted.has(String(p.sku||''))).map((p)=>({sku:p.sku,price:p.price,availability:p.availability,lastSeen:p.lastSeen}));
          console.log(JSON.stringify({gb:rows('/tmp/gb.json'),ca:rows('/tmp/ca.json'),us:rows('/tmp/us.json'),canonical},null,2));
          NODE
