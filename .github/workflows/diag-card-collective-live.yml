name: Diagnose Manifested Vanished Threads

on:
  push:
    branches:
      - diag/card-collective-live-price-stock-2026-08-30

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Perfect Order lifecycle history
        shell: bash
        run: |
          set -euo pipefail
          CLOUD='https://fatedrop-cloud-production.up.railway.app'
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/signals?state=manifested&limit=100" -o /tmp/manifested.json
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/signals?state=vanished&limit=100" -o /tmp/vanished.json
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/catalogue?q=perfect&limit=100" -o /tmp/perfect.json

          node <<'NODE'
          const fs = require('fs');
          const manifested = JSON.parse(fs.readFileSync('/tmp/manifested.json','utf8'));
          const vanished = JSON.parse(fs.readFileSync('/tmp/vanished.json','utf8'));
          const catalogue = JSON.parse(fs.readFileSync('/tmp/perfect.json','utf8'));
          const wanted = (value) => /perfect order/i.test(String(value || ''));
          const compactSignal = (row) => ({ id: row.id, state: row.state, title: row.title, retailer: row.retailerName, offerId: row.offerId, detectedAt: row.detectedAt, stockStatus: row.stockStatus });
          const perfectManifested = (manifested.signals || []).filter((row) => wanted(row.title)).map(compactSignal);
          const perfectVanished = (vanished.signals || []).filter((row) => wanted(row.title)).map(compactSignal);
          const magic = (catalogue.products || []).filter((row) => row.retailer === 'Magic Madhouse' && wanted(row.title)).map((row) => ({ title: row.title, sku: row.sku, offerId: row.offerId || null, availability: row.availability, lastSeen: row.lastSeen, firstSeen: row.firstSeen || null }));
          console.log(JSON.stringify({
            manifestedTotal: manifested.count,
            vanishedTotal: vanished.count,
            perfectManifested,
            perfectVanished,
            magicMadhousePerfectOrder: magic,
          }, null, 2));
          NODE
