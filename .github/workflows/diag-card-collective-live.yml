name: Diagnose Card Collective Live Price Stock

on:
  push:
    branches:
      - diag/card-collective-live-price-stock-2026-08-30

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace exact Card Collective variants across scanner pages
        shell: bash
        run: |
          set -euo pipefail
          SKU_SEALED='58272935772541'
          SKU_OPENED='58272935805309'
          CLOUD='https://fatedrop-cloud-production.up.railway.app/api/catalogue?retailer=card-collective&q=Terastal%20Grand%20Gathering&limit=25'

          for page in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://card-collective.com/collections/pokemon-tcg/products.json?limit=250&page=${page}" \
              -o "/tmp/page-${page}.json"
          done
          curl --fail --silent --show-error --location --retry 3 "$CLOUD" -o /tmp/cloud.json

          node <<'NODE'
          const fs = require('fs');
          const wanted = new Set(['58272935772541','58272935805309']);
          const occurrences = [];
          for (let page = 1; page <= 6; page += 1) {
            const payload = JSON.parse(fs.readFileSync(`/tmp/page-${page}.json`, 'utf8'));
            for (const product of payload.products || []) {
              for (const variant of product.variants || []) {
                if (!wanted.has(String(variant.id || ''))) continue;
                occurrences.push({
                  page,
                  productTitle: product.title || null,
                  handle: product.handle || null,
                  id: String(variant.id || ''),
                  variantTitle: variant.title || null,
                  price: variant.price ?? null,
                  available: variant.available ?? null,
                });
              }
            }
          }
          const cloud = JSON.parse(fs.readFileSync('/tmp/cloud.json', 'utf8'));
          const cloudRows = (cloud.products || []).filter((p) => wanted.has(String(p.sku || ''))).map((p) => ({
            sku:p.sku||null,title:p.title||null,price:p.price??null,availability:p.availability||null,lastSeen:p.lastSeen||null,
          }));
          console.log(JSON.stringify({ occurrences, fateDrop: cloudRows }, null, 2));
          NODE
