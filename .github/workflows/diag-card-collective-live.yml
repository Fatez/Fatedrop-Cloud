name: Diagnose Manifested Vanished Threads

on:
  push:
    branches:
      - diag/card-collective-live-price-stock-2026-08-30

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect recent production lifecycle threads
        shell: bash
        run: |
          set -euo pipefail
          CLOUD='https://fatedrop-cloud-production.up.railway.app'
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/signals?detail=alerts&limit=100" -o /tmp/alerts.json
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/signals?limit=100" -o /tmp/signals.json
          curl --fail --silent --show-error --location --retry 3 "${CLOUD}/api/catalogue?q=perfect&limit=100" -o /tmp/perfect.json || true

          node <<'NODE'
          const fs = require('fs');
          const alerts = JSON.parse(fs.readFileSync('/tmp/alerts.json','utf8'));
          const signals = JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          let perfect = {};
          try { perfect = JSON.parse(fs.readFileSync('/tmp/perfect.json','utf8')); } catch {}

          const rows = Array.isArray(alerts.alerts) ? alerts.alerts : [];
          const vanished = rows.filter((row) => row.fateStage === 'VANISHED').map((row) => {
            const thread = Array.isArray(row.signalThread) ? row.signalThread : [];
            const manifested = thread.filter((entry) => entry.fateStage === 'MANIFESTED');
            return {
              id: row.id,
              title: row.title,
              retailer: row.retailer,
              detectedAt: row.detectedAt,
              observedDurationSeconds: row.observedDurationSeconds ?? null,
              threadStages: thread.map((entry) => entry.fateStage),
              manifestedCount: manifested.length,
              latestManifestedAt: manifested.at(-1)?.occurredAt ?? null,
              thread: thread.map((entry) => ({ stage: entry.fateStage, at: entry.occurredAt, status: entry.stockStatus })),
            };
          });

          const orphanLike = vanished.filter((row) => row.manifestedCount === 0 || row.observedDurationSeconds == null);
          const recentSignals = Array.isArray(signals.signals) ? signals.signals : [];
          const perfectRows = Array.isArray(perfect.products) ? perfect.products : [];
          console.log(JSON.stringify({
            generatedAt: alerts.generatedAt,
            alertCount: rows.length,
            vanishedCount: vanished.length,
            vanished,
            orphanLike,
            recentManifested: recentSignals.filter((row) => row.state === 'manifested').slice(0,30).map((row) => ({ title: row.title, retailer: row.retailerName, detectedAt: row.detectedAt, offerId: row.offerId })),
            perfectCatalogue: perfectRows.map((row) => ({ title: row.title, retailer: row.retailer, sku: row.sku, availability: row.availability, lastSeen: row.lastSeen })),
          }, null, 2));
          NODE
