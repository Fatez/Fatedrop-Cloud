name: P0 Railway Credential Capability

on:
  push:
    branches:
      - fix/p0-railway-credential-capability-2026-08-30

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      FATEDROP_METRICS_INGEST_SECRET: ${{ secrets.FATEDROP_METRICS_INGEST_SECRET }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          console.log(JSON.stringify({
            railwayProjectTokenConfigured: Boolean(process.env.RAILWAY_TOKEN),
            railwayApiTokenConfigured: Boolean(process.env.RAILWAY_API_TOKEN),
            metricsIngestSecretConfiguredInActions: Boolean(process.env.FATEDROP_METRICS_INGEST_SECRET),
          }));
          NODE
